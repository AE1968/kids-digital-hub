<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>Daily Challenges - Kids Digital Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <script data-goatcounter="https://adrian.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .stat {
            background: rgba(255, 255, 255, 0.2);
            padding: 15px 25px;
            border-radius: 20px;
            color: white;
            text-align: center;
        }

        .stat .value {
            font-size: 2rem;
            font-weight: bold;
        }

        .stat .label {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .challenges-section {
            background: white;
            border-radius: 30px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
        }

        .section-title {
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid #f0f0f0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .challenge-card {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 20px;
            margin-bottom: 15px;
            transition: all 0.3s;
            border: 3px solid transparent;
        }

        .challenge-card:hover {
            transform: translateX(5px);
            border-color: #667eea;
        }

        .challenge-card.completed {
            background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
            border-color: #4CAF50;
        }

        .challenge-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            flex-shrink: 0;
        }

        .challenge-card.completed .challenge-icon {
            background: linear-gradient(135deg, #4CAF50, #8BC34A);
        }

        .challenge-content {
            flex: 1;
        }

        .challenge-task {
            font-size: 1.1rem;
            color: #333;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .challenge-reward {
            color: #FFB300;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .challenge-status {
            font-size: 2rem;
        }

        .completed-badge {
            background: #4CAF50;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .timer {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 15px 30px;
            border-radius: 20px;
            text-align: center;
            margin-top: 30px;
        }

        .timer-value {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: bold;
        }

        .progress-ring {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
        }

        .coins-display {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: white;
            padding: 20px 30px;
            border-radius: 20px;
            text-align: center;
            margin-top: 20px;
        }

        .coins-value {
            font-size: 2.5rem;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <a href="index.html" class="back-btn" data-i18n="btn_back">← Back</a>

    <div class="header">
        <h1>⭐ Daily Challenges</h1>
        <p>Complete challenges to earn coins!</p>
    </div>

    <div class="container">
        <div class="stats-bar">
            <div class="stat">
                <div class="value" id="completedToday">0</div>
                <div class="label" data-i18n="stat_done_today">Completed Today</div>
            </div>
            <div class="stat">
                <div class="value" id="totalCompleted">0</div>
                <div class="label" data-i18n="stat_total_done">Total Completed</div>
            </div>
            <div class="stat">
                <div class="value" id="totalRewards">0</div>
                <div class="label" data-i18n="stat_coins_earned">Coins Earned</div>
            </div>
        </div>

        <div class="challenges-section">
            <div class="section-title" data-i18n="today_challenges">📋 Today's Challenges</div>
            <div id="challengesList"></div>

            <div class="coins-display">
                <div data-i18n="your_coins">💰 Your Coins</div>
                <div class="coins-value" id="totalCoins">0</div>
            </div>
        </div>

        <div class="timer">
            <div data-i18n="new_challenges_in">⏰ New challenges in:</div>
            <div class="timer-value" id="countdown">--:--:--</div>
        </div>
    </div>

    <script src="js/translations.js"></script>
    <script src="js/challenges.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => changeLanguage('en'), 100);
        });

        function renderChallenges() {
            const challenges = KDH_Challenges.getToday();
            const container = document.getElementById('challengesList');
            container.innerHTML = '';

            challenges.forEach(challenge => {
                const card = document.createElement('div');
                card.className = `challenge-card ${challenge.completed ? 'completed' : ''}`;
                card.innerHTML = `
                    <div class="challenge-icon">${challenge.icon}</div>
                    <div class="challenge-content">
                        <div class="challenge-task">${challenge.task}</div>
                        <div class="challenge-reward">🪙 ${challenge.reward} coins</div>
                    </div>
                    <div class="challenge-status">
                        ${challenge.completed ? '<span class="completed-badge">✓ Done!</span>' : '⏳'}
                    </div>
                `;
                container.appendChild(card);
            });

            // Update stats
            const stats = KDH_Challenges.getStats();
            document.getElementById('completedToday').textContent = stats.completedToday;
            document.getElementById('totalCompleted').textContent = stats.totalCompleted;
            document.getElementById('totalRewards').textContent = stats.totalRewards;
            document.getElementById('totalCoins').textContent = localStorage.getItem('kdh_coins') || '0';
        }

        function updateCountdown() {
            const now = new Date();
            const tomorrow = new Date(now);
            tomorrow.setDate(tomorrow.getDate() + 1);
            tomorrow.setHours(0, 0, 0, 0);

            const diff = tomorrow - now;
            const hours = Math.floor(diff / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById('countdown').textContent =
                `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        // Initialize
        renderChallenges();
        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>
</body>

</html>
