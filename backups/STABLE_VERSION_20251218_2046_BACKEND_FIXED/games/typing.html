<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>Typing Adventure - Kids Digital Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <script data-goatcounter="https://adrian.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 2.5rem;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .game-container {
            max-width: 700px;
            margin: 0 auto;
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .stat {
            background: rgba(255, 255, 255, 0.2);
            padding: 10px 25px;
            border-radius: 20px;
            color: white;
        }

        .level-selector {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .level-btn {
            padding: 10px 25px;
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid white;
            border-radius: 20px;
            color: white;
            font-family: 'Fredoka', sans-serif;
            cursor: pointer;
        }

        .level-btn.active {
            background: white;
            color: #4facfe;
        }

        .typing-area {
            background: white;
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .word-display {
            font-size: 3rem;
            color: #333;
            margin-bottom: 20px;
            letter-spacing: 5px;
            font-weight: bold;
        }

        .word-display .correct {
            color: #4CAF50;
        }

        .word-display .current {
            background: #fff3cd;
            border-radius: 5px;
        }

        .word-display .wrong {
            color: #f44336;
            text-decoration: underline;
        }

        .word-hint {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .input-wrapper {
            margin-bottom: 20px;
        }

        #typingInput {
            font-size: 2rem;
            padding: 15px 30px;
            border: 3px solid #ddd;
            border-radius: 20px;
            text-align: center;
            width: 100%;
            max-width: 400px;
            font-family: 'Fredoka', sans-serif;
            letter-spacing: 3px;
        }

        #typingInput:focus {
            outline: none;
            border-color: #4facfe;
        }

        .progress {
            background: #eee;
            height: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #8BC34A);
            transition: width 0.3s;
        }

        .feedback {
            font-size: 1.5rem;
            min-height: 50px;
        }

        .feedback.success {
            color: #4CAF50;
        }

        .feedback.error {
            color: #f44336;
        }

        .btn {
            padding: 15px 40px;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: white;
            border: none;
            border-radius: 25px;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.1rem;
            cursor: pointer;
            margin: 10px;
        }

        .results {
            display: none;
        }

        .results.show {
            display: block;
        }

        .results h2 {
            color: #4facfe;
            font-size: 2rem;
            margin-bottom: 20px;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .result-stat {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 15px;
        }

        .result-stat .value {
            font-size: 2rem;
            color: #4facfe;
            font-weight: bold;
        }

        .result-stat .label {
            color: #888;
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: bold;
        }

        .keyboard-hint {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .key {
            width: 40px;
            height: 40px;
            background: #f0f0f0;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #666;
        }

        .key.highlight {
            background: #4facfe;
            color: white;
        }
    </style>
</head>

<body>
    <a href="../gallery-games.html" class="back-btn">← Back</a>

    <div class="header">
        <h1>⌨️ Typing Adventure</h1>
        <p>Type the words as fast as you can!</p>
    </div>

    <div class="game-container">
        <div class="stats-bar">
            <div class="stat">⭐ Score: <span id="score">0</span></div>
            <div class="stat">⏱️ Time: <span id="timer">60</span>s</div>
            <div class="stat">🎯 Words: <span id="wordsTyped">0</span></div>
            <div class="stat">🔥 Streak: <span id="streak">0</span></div>
        </div>

        <div class="level-selector">
            <button class="level-btn active" onclick="setLevel('easy')">Easy</button>
            <button class="level-btn" onclick="setLevel('medium')">Medium</button>
            <button class="level-btn" onclick="setLevel('hard')">Hard</button>
        </div>

        <div class="typing-area" id="gameArea">
            <div class="word-hint" id="wordHint">🐱</div>
            <div class="word-display" id="wordDisplay">CAT</div>
            <div class="input-wrapper">
                <input type="text" id="typingInput" placeholder="Type here..." autocomplete="off" autofocus>
            </div>
            <div class="progress">
                <div class="progress-fill" id="progressFill" style="width: 100%"></div>
            </div>
            <div class="feedback" id="feedback"></div>
            <button class="btn" onclick="startGame()">🚀 Start Game</button>
        </div>

        <div class="typing-area results" id="resultsArea">
            <h2>🎉 Time's Up!</h2>
            <div class="results-grid">
                <div class="result-stat">
                    <div class="value" id="finalScore">0</div>
                    <div class="label">Total Score</div>
                </div>
                <div class="result-stat">
                    <div class="value" id="finalWords">0</div>
                    <div class="label">Words Typed</div>
                </div>
                <div class="result-stat">
                    <div class="value" id="finalWPM">0</div>
                    <div class="label">Words/Minute</div>
                </div>
                <div class="result-stat">
                    <div class="value" id="finalAccuracy">0%</div>
                    <div class="label">Accuracy</div>
                </div>
            </div>
            <button class="btn" onclick="startGame()">🔄 Play Again</button>
            <a href="../gallery-games.html" class="btn">🎮 More Games</a>
        </div>
    </div>

    <script>
        const wordSets = {
            easy: [
                { word: 'CAT', emoji: '🐱' },
                { word: 'DOG', emoji: '🐶' },
                { word: 'SUN', emoji: '☀️' },
                { word: 'MOON', emoji: '🌙' },
                { word: 'STAR', emoji: '⭐' },
                { word: 'TREE', emoji: '🌲' },
                { word: 'FISH', emoji: '🐟' },
                { word: 'BIRD', emoji: '🐦' },
                { word: 'CAKE', emoji: '🎂' },
                { word: 'BALL', emoji: '⚽' }
            ],
            medium: [
                { word: 'APPLE', emoji: '🍎' },
                { word: 'HOUSE', emoji: '🏠' },
                { word: 'HAPPY', emoji: '😊' },
                { word: 'WATER', emoji: '💧' },
                { word: 'MUSIC', emoji: '🎵' },
                { word: 'CLOUD', emoji: '☁️' },
                { word: 'HEART', emoji: '❤️' },
                { word: 'PIZZA', emoji: '🍕' },
                { word: 'ROBOT', emoji: '🤖' },
                { word: 'CROWN', emoji: '👑' }
            ],
            hard: [
                { word: 'RAINBOW', emoji: '🌈' },
                { word: 'UNICORN', emoji: '🦄' },
                { word: 'DRAGON', emoji: '🐉' },
                { word: 'ROCKET', emoji: '🚀' },
                { word: 'BUTTERFLY', emoji: '🦋' },
                { word: 'ELEPHANT', emoji: '🐘' },
                { word: 'CHOCOLATE', emoji: '🍫' },
                { word: 'PRINCESS', emoji: '👸' },
                { word: 'TREASURE', emoji: '💎' },
                { word: 'ADVENTURE', emoji: '🗺️' }
            ]
        };

        let level = 'easy';
        let currentWord = null;
        let score = 0;
        let wordsTyped = 0;
        let streak = 0;
        let timeLeft = 60;
        let gameInterval = null;
        let totalAttempts = 0;
        let correctAttempts = 0;
        let gameActive = false;

        function setLevel(newLevel) {
            level = newLevel;
            document.querySelectorAll('.level-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        function getRandomWord() {
            const words = wordSets[level];
            return words[Math.floor(Math.random() * words.length)];
        }

        function displayWord() {
            currentWord = getRandomWord();
            document.getElementById('wordHint').textContent = currentWord.emoji;
            document.getElementById('wordDisplay').textContent = currentWord.word;
            document.getElementById('typingInput').value = '';
            document.getElementById('typingInput').focus();
        }

        function startGame() {
            score = 0;
            wordsTyped = 0;
            streak = 0;
            timeLeft = 60;
            totalAttempts = 0;
            correctAttempts = 0;
            gameActive = true;

            document.getElementById('score').textContent = '0';
            document.getElementById('wordsTyped').textContent = '0';
            document.getElementById('streak').textContent = '0';
            document.getElementById('timer').textContent = '60';
            document.getElementById('feedback').textContent = '';
            document.getElementById('progressFill').style.width = '100%';
            document.getElementById('gameArea').classList.remove('hidden');
            document.getElementById('resultsArea').classList.remove('show');

            displayWord();

            gameInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').textContent = timeLeft;
                document.getElementById('progressFill').style.width = (timeLeft / 60 * 100) + '%';

                if (timeLeft <= 10) {
                    document.getElementById('progressFill').style.background = 'linear-gradient(90deg, #f44336, #ff9800)';
                }

                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        function checkWord() {
            if (!gameActive) return;

            const input = document.getElementById('typingInput').value.toUpperCase();
            totalAttempts++;

            if (input === currentWord.word) {
                correctAttempts++;
                wordsTyped++;
                streak++;

                const bonus = Math.min(streak, 5);
                score += 10 * bonus;

                document.getElementById('score').textContent = score;
                document.getElementById('wordsTyped').textContent = wordsTyped;
                document.getElementById('streak').textContent = streak;
                document.getElementById('feedback').textContent = streak > 1 ? `🔥 ${streak} Streak!` : '✅ Correct!';
                document.getElementById('feedback').className = 'feedback success';

                if (window.KDH_Sounds) KDH_Sounds.playSuccess();

                displayWord();
            }
        }

        function endGame() {
            gameActive = false;
            clearInterval(gameInterval);

            const wpm = wordsTyped;
            const accuracy = totalAttempts > 0 ? Math.round((correctAttempts / totalAttempts) * 100) : 0;

            document.getElementById('finalScore').textContent = score;
            document.getElementById('finalWords').textContent = wordsTyped;
            document.getElementById('finalWPM').textContent = wpm;
            document.getElementById('finalAccuracy').textContent = accuracy + '%';

            document.getElementById('gameArea').classList.add('hidden');
            document.getElementById('resultsArea').classList.add('show');

            if (window.KDH_Achievements) {
                KDH_Achievements.addProgress('typing');
            }
        }

        // Input handler
        document.getElementById('typingInput').addEventListener('input', checkWord);

        // Prevent form submission
        document.getElementById('typingInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
            }
        });
    </script>
</body>

</html>
