<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>Math Blaster - Kids Digital Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <script data-goatcounter="https://adrian.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background-image:
                radial-gradient(3px 3px at 100px 50px, rgba(255, 255, 255, 0.5), transparent),
                radial-gradient(2px 2px at 200px 150px, rgba(255, 255, 255, 0.4), transparent),
                radial-gradient(2px 2px at 300px 100px, rgba(255, 255, 255, 0.3), transparent);
            background-size: 400px 300px;
            animation: float 20s linear infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(0);
            }

            100% {
                transform: translateY(-300px);
            }
        }

        .game-header {
            text-align: center;
            color: white;
            margin-bottom: 20px;
            position: relative;
            z-index: 10;
        }

        .game-header h1 {
            font-size: 2.5rem;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .game-container {
            max-width: 500px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat {
            background: rgba(255, 255, 255, 0.2);
            padding: 10px 25px;
            border-radius: 20px;
            color: white;
            font-weight: bold;
        }

        .level-select {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .level-btn {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid white;
            border-radius: 20px;
            color: white;
            font-family: 'Fredoka', sans-serif;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .level-btn.active {
            background: white;
            color: #11998e;
        }

        .question-card {
            background: white;
            border-radius: 30px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
        }

        .timer-bar {
            height: 10px;
            background: #eee;
            border-radius: 10px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .timer-fill {
            height: 100%;
            background: linear-gradient(90deg, #11998e, #38ef7d);
            border-radius: 10px;
            transition: width 0.1s linear;
        }

        .timer-fill.warning {
            background: linear-gradient(90deg, #f44336, #ff9800);
        }

        .question {
            font-size: 4rem;
            color: #333;
            margin-bottom: 30px;
        }

        .answer-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .answer-btn {
            padding: 25px;
            font-size: 2rem;
            border: 3px solid #ddd;
            border-radius: 20px;
            background: white;
            cursor: pointer;
            font-family: 'Fredoka', sans-serif;
            transition: all 0.2s;
        }

        .answer-btn:hover {
            border-color: #11998e;
            transform: scale(1.02);
        }

        .answer-btn.correct {
            background: #4CAF50;
            border-color: #4CAF50;
            color: white;
        }

        .answer-btn.wrong {
            background: #f44336;
            border-color: #f44336;
            color: white;
        }

        .streak-display {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 5rem;
            color: white;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.8);
            pointer-events: none;
            opacity: 0;
            z-index: 100;
        }

        .streak-display.show {
            animation: streakPop 1s ease-out;
        }

        @keyframes streakPop {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(0.5);
            }

            50% {
                transform: translate(-50%, -50%) scale(1.2);
            }

            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        .combo-badge {
            display: none;
            position: absolute;
            top: -20px;
            right: -20px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: white;
            padding: 10px 15px;
            border-radius: 15px;
            font-weight: bold;
            animation: pulse 0.5s infinite;
        }

        .combo-badge.show {
            display: block;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: bold;
            z-index: 100;
        }

        .results {
            display: none;
        }

        .results.show {
            display: block;
        }

        .results h2 {
            font-size: 2.5rem;
            color: #11998e;
            margin-bottom: 20px;
        }

        .results-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .result-stat {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 15px;
        }

        .result-stat .value {
            font-size: 2rem;
            color: #11998e;
            font-weight: bold;
        }

        .result-stat .label {
            color: #666;
            font-size: 0.9rem;
        }

        .btn {
            display: inline-block;
            padding: 15px 40px;
            background: linear-gradient(135deg, #11998e, #38ef7d);
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            margin: 10px;
        }
    </style>
</head>

<body>
    <div class="stars"></div>
    <a href="../gallery-games.html" class="back-btn">← Back</a>

    <div class="game-header">
        <h1>🚀 Math Blaster!</h1>
        <p>Solve math problems as fast as you can!</p>
    </div>

    <div class="game-container">
        <div class="stats-bar">
            <div class="stat">⭐ Score: <span id="score">0</span></div>
            <div class="stat">🔥 Streak: <span id="streak">0</span></div>
            <div class="stat">❤️ Lives: <span id="lives">3</span></div>
        </div>

        <div class="level-select">
            <button class="level-btn active" onclick="setLevel('easy')">Easy (+−)</button>
            <button class="level-btn" onclick="setLevel('medium')">Medium (×)</button>
            <button class="level-btn" onclick="setLevel('hard')">Hard (÷)</button>
        </div>

        <div class="question-card" id="gameCard">
            <div class="combo-badge" id="comboBadge">🔥 x3!</div>
            <div class="timer-bar">
                <div class="timer-fill" id="timerFill"></div>
            </div>
            <div class="question" id="question">5 + 3 = ?</div>
            <div class="answer-grid" id="answerGrid"></div>
        </div>

        <div class="question-card results" id="resultsCard">
            <h2>🎉 Game Over!</h2>
            <div class="results-stats">
                <div class="result-stat">
                    <div class="value" id="finalScore">0</div>
                    <div class="label">Total Score</div>
                </div>
                <div class="result-stat">
                    <div class="value" id="correctCount">0</div>
                    <div class="label">Correct</div>
                </div>
                <div class="result-stat">
                    <div class="value" id="bestStreak">0</div>
                    <div class="label">Best Streak</div>
                </div>
                <div class="result-stat">
                    <div class="value" id="accuracy">0%</div>
                    <div class="label">Accuracy</div>
                </div>
            </div>
            <button class="btn" onclick="restartGame()">🔄 Play Again</button>
            <a href="../gallery-games.html" class="btn">🎮 More Games</a>
        </div>
    </div>

    <div class="streak-display" id="streakDisplay">🔥</div>

    <script>
        let level = 'easy';
        let score = 0;
        let streak = 0;
        let bestStreak = 0;
        let lives = 3;
        let correct = 0;
        let total = 0;
        let correctAnswer = 0;
        let timerValue = 100;
        let timerInterval = null;
        let gameActive = true;

        function setLevel(newLevel) {
            level = newLevel;
            document.querySelectorAll('.level-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            generateQuestion();
        }

        function generateQuestion() {
            if (!gameActive) return;

            let num1, num2, operator, answer;

            switch (level) {
                case 'easy':
                    num1 = Math.floor(Math.random() * 10) + 1;
                    num2 = Math.floor(Math.random() * 10) + 1;
                    operator = Math.random() > 0.5 ? '+' : '-';
                    if (operator === '-' && num2 > num1) [num1, num2] = [num2, num1];
                    answer = operator === '+' ? num1 + num2 : num1 - num2;
                    break;

                case 'medium':
                    num1 = Math.floor(Math.random() * 10) + 1;
                    num2 = Math.floor(Math.random() * 10) + 1;
                    operator = '×';
                    answer = num1 * num2;
                    break;

                case 'hard':
                    num2 = Math.floor(Math.random() * 10) + 1;
                    answer = Math.floor(Math.random() * 10) + 1;
                    num1 = num2 * answer;
                    operator = '÷';
                    break;
            }

            correctAnswer = answer;
            document.getElementById('question').textContent = `${num1} ${operator} ${num2} = ?`;

            // Generate wrong answers
            const answers = [answer];
            while (answers.length < 4) {
                const wrongAnswer = answer + Math.floor(Math.random() * 10) - 5;
                if (wrongAnswer !== answer && wrongAnswer >= 0 && !answers.includes(wrongAnswer)) {
                    answers.push(wrongAnswer);
                }
            }

            // Shuffle answers
            answers.sort(() => Math.random() - 0.5);

            const grid = document.getElementById('answerGrid');
            grid.innerHTML = '';
            answers.forEach(ans => {
                const btn = document.createElement('button');
                btn.className = 'answer-btn';
                btn.textContent = ans;
                btn.onclick = () => checkAnswer(ans, btn);
                grid.appendChild(btn);
            });

            // Reset and start timer
            startTimer();
        }

        function startTimer() {
            timerValue = 100;
            clearInterval(timerInterval);

            timerInterval = setInterval(() => {
                timerValue -= 2;
                const fill = document.getElementById('timerFill');
                fill.style.width = timerValue + '%';

                if (timerValue <= 30) {
                    fill.classList.add('warning');
                } else {
                    fill.classList.remove('warning');
                }

                if (timerValue <= 0) {
                    clearInterval(timerInterval);
                    wrongAnswer();
                }
            }, 100);
        }

        function checkAnswer(answer, btn) {
            if (!gameActive) return;
            clearInterval(timerInterval);
            total++;

            if (answer === correctAnswer) {
                btn.classList.add('correct');
                correct++;
                streak++;
                if (streak > bestStreak) bestStreak = streak;

                // Score with streak bonus
                const bonus = Math.min(streak, 5);
                score += 10 * bonus;

                document.getElementById('score').textContent = score;
                document.getElementById('streak').textContent = streak;

                // Show combo badge
                if (streak >= 3) {
                    const badge = document.getElementById('comboBadge');
                    badge.textContent = `🔥 x${streak}!`;
                    badge.classList.add('show');
                    setTimeout(() => badge.classList.remove('show'), 1000);

                    const streakDisplay = document.getElementById('streakDisplay');
                    streakDisplay.textContent = `🔥 ${streak}!`;
                    streakDisplay.classList.add('show');
                    setTimeout(() => streakDisplay.classList.remove('show'), 1000);
                }

                setTimeout(generateQuestion, 500);
            } else {
                wrongAnswer(btn);
            }
        }

        function wrongAnswer(btn) {
            if (btn) btn.classList.add('wrong');

            // Show correct answer
            document.querySelectorAll('.answer-btn').forEach(b => {
                if (parseInt(b.textContent) === correctAnswer) {
                    b.classList.add('correct');
                }
            });

            streak = 0;
            lives--;
            document.getElementById('streak').textContent = '0';
            document.getElementById('lives').textContent = lives;

            if (lives <= 0) {
                gameActive = false;
                setTimeout(showResults, 1000);
            } else {
                setTimeout(generateQuestion, 1000);
            }
        }

        function showResults() {
            document.getElementById('gameCard').style.display = 'none';
            document.getElementById('resultsCard').classList.add('show');

            document.getElementById('finalScore').textContent = score;
            document.getElementById('correctCount').textContent = correct;
            document.getElementById('bestStreak').textContent = bestStreak;
            document.getElementById('accuracy').textContent = total > 0 ? Math.round((correct / total) * 100) + '%' : '0%';
        }

        function restartGame() {
            score = 0;
            streak = 0;
            bestStreak = 0;
            lives = 3;
            correct = 0;
            total = 0;
            gameActive = true;

            document.getElementById('score').textContent = '0';
            document.getElementById('streak').textContent = '0';
            document.getElementById('lives').textContent = '3';
            document.getElementById('gameCard').style.display = 'block';
            document.getElementById('resultsCard').classList.remove('show');

            generateQuestion();
        }

        // Initialize
        generateQuestion();
    </script>
</body>

</html>
