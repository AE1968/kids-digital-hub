<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>Reward Shop - Kids Digital Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <script data-goatcounter="https://adrian.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        .header h1 {
            font-size: 2.5rem;
        }

        .coins-bar {
            background: white;
            padding: 15px 30px;
            border-radius: 50px;
            display: inline-flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
            margin-bottom: 30px;
        }

        .coins-bar .icon {
            font-size: 2rem;
        }

        .coins-bar .amount {
            font-size: 1.8rem;
            font-weight: bold;
            color: #FFA500;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .section-title {
            color: white;
            font-size: 1.5rem;
            margin-bottom: 20px;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .item-card {
            background: white;
            border-radius: 25px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            transition: transform 0.3s;
            position: relative;
            overflow: hidden;
        }

        .item-card:hover {
            transform: translateY(-5px);
        }

        .item-card.owned {
            background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
        }

        .item-card.owned::after {
            content: '✓ OWNED';
            position: absolute;
            top: 10px;
            right: -30px;
            background: #4CAF50;
            color: white;
            padding: 5px 35px;
            font-size: 0.7rem;
            transform: rotate(45deg);
        }

        .item-icon {
            font-size: 4rem;
            margin-bottom: 15px;
        }

        .item-name {
            font-size: 1.1rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        .item-price {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            font-size: 1.2rem;
            color: #FFA500;
            margin-bottom: 15px;
        }

        .buy-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 15px;
            font-family: 'Fredoka', sans-serif;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .buy-btn:hover {
            transform: scale(1.05);
        }

        .buy-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .buy-btn.owned {
            background: #4CAF50;
        }

        .category-tabs {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 12px 25px;
            background: rgba(255, 255, 255, 0.3);
            border: none;
            border-radius: 25px;
            color: white;
            font-family: 'Fredoka', sans-serif;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .tab-btn.active {
            background: white;
            color: #FFA500;
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.3);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: bold;
        }

        .earn-more {
            background: white;
            border-radius: 25px;
            padding: 30px;
            text-align: center;
            margin-top: 30px;
        }

        .earn-more h3 {
            color: #333;
            margin-bottom: 15px;
        }

        .earn-options {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .earn-option {
            padding: 15px 25px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: white;
            text-decoration: none;
            border-radius: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <a href="index.html" class="back-btn" data-i18n="btn_back">← Back</a>

    <div class="header">
        <h1 data-i18n="shop_title">🛍️ Reward Shop</h1>
        <p data-i18n="shop_subtitle">Spend your coins on cool stuff!</p>
        <div style="margin-top: 20px;">
            <div class="coins-bar">
                <span class="icon">💰</span>
                <span class="amount" id="coinBalance">0</span>
                <span data-i18n="shop_coins">coins</span>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="category-tabs">
            <button class="tab-btn active" onclick="showCategory('avatars')" data-i18n="tab_avatars">😊 Avatars</button>
            <button class="tab-btn" onclick="showCategory('frames')" data-i18n="tab_frames">🖼️ Frames</button>
            <button class="tab-btn" onclick="showCategory('effects')" data-i18n="tab_effects">✨ Effects</button>
            <button class="tab-btn" onclick="showCategory('titles')" data-i18n="tab_titles">🏷️ Titles</button>
        </div>

        <div id="shopItems"></div>

        <div class="earn-more">
            <h3 data-i18n="need_more_coins">💡 Need More Coins?</h3>
            <div class="earn-options">
                <a href="challenges.html" class="earn-option" data-i18n="daily_challenges">⭐ Daily Challenges</a>
                <a href="gallery-games.html" class="earn-option" data-i18n="nav_games">🎮 Play Games</a>
                <a href="games/quiz.html" class="earn-option">📚 Take Quizzes</a>
            </div>
        </div>
    </div>

    <script src="js/translations.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('selectedLanguage') || 'en';
            setTimeout(() => changeLanguage(savedLang), 100);
        });

        const shopItems = {
            avatars: [
                { id: 'avatar_star', icon: '⭐', name: 'Star Kid', price: 50 },
                { id: 'avatar_rocket', icon: '🚀', name: 'Space Explorer', price: 100 },
                { id: 'avatar_unicorn', icon: '🦄', name: 'Magic Unicorn', price: 150 },
                { id: 'avatar_dragon', icon: '🐉', name: 'Friendly Dragon', price: 200 },
                { id: 'avatar_robot', icon: '🤖', name: 'Cool Robot', price: 250 },
                { id: 'avatar_wizard', icon: '🧙', name: 'Wise Wizard', price: 300 }
            ],
            frames: [
                { id: 'frame_rainbow', icon: '🌈', name: 'Rainbow Frame', price: 75 },
                { id: 'frame_stars', icon: '✨', name: 'Starry Frame', price: 100 },
                { id: 'frame_hearts', icon: '💖', name: 'Heart Frame', price: 125 },
                { id: 'frame_gold', icon: '🏆', name: 'Golden Frame', price: 200 }
            ],
            effects: [
                { id: 'effect_sparkle', icon: '✨', name: 'Sparkle Trail', price: 150 },
                { id: 'effect_rainbow', icon: '🌈', name: 'Rainbow Glow', price: 200 },
                { id: 'effect_fire', icon: '🔥', name: 'Fire Effect', price: 250 },
                { id: 'effect_snow', icon: '❄️', name: 'Snowfall', price: 175 }
            ],
            titles: [
                { id: 'title_explorer', icon: '🗺️', name: 'Explorer', price: 50 },
                { id: 'title_champion', icon: '🏆', name: 'Champion', price: 100 },
                { id: 'title_master', icon: '🎓', name: 'Master', price: 150 },
                { id: 'title_legend', icon: '👑', name: 'Legend', price: 300 }
            ]
        };

        let currentCategory = 'avatars';

        function getCoins() {
            return parseInt(localStorage.getItem('kdh_coins') || '0');
        }

        function setCoins(amount) {
            localStorage.setItem('kdh_coins', amount);
            document.getElementById('coinBalance').textContent = amount;
        }

        function getOwned() {
            return JSON.parse(localStorage.getItem('kdh_owned_items') || '[]');
        }

        function ownItem(id) {
            const owned = getOwned();
            if (!owned.includes(id)) {
                owned.push(id);
                localStorage.setItem('kdh_owned_items', JSON.stringify(owned));
            }
        }

        function isOwned(id) {
            return getOwned().includes(id);
        }

        function showCategory(category) {
            currentCategory = category;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderShop();
        }

        function buyItem(id, price, name) {
            const coins = getCoins();

            if (coins < price) {
                alert('Not enough coins! Keep playing to earn more! 🎮');
                return;
            }

            if (confirm(`Buy ${name} for ${price} coins?`)) {
                setCoins(coins - price);
                ownItem(id);

                // Play sound
                if (window.KDH_Sounds) {
                    KDH_Sounds.playCoin();
                }

                // Show celebration
                showPurchaseAnimation(name);
                renderShop();
            }
        }

        function showPurchaseAnimation(itemName) {
            const overlay = document.createElement('div');
            overlay.innerHTML = `
                <div style="
                    position: fixed;
                    top: 0;
                    left: 0;
                    width: 100%;
                    height: 100%;
                    background: rgba(0, 0, 0, 0.8);
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    z-index: 10000;
                ">
                    <div style="
                        text-align: center;
                        color: white;
                        animation: bounceIn 0.5s;
                    ">
                        <div style="font-size: 6rem; animation: spin 1s;">🎉</div>
                        <h2 style="font-size: 2rem; margin: 20px 0;" data-i18n="success_buy_title">You Got It!</h2>
                        <p style="font-size: 1.2rem;">${itemName} <span data-i18n="success_buy_text">is now yours!</span></p>
                    </div>
                </div>
                <style>
                    @keyframes bounceIn {
                        0% { transform: scale(0); }
                        50% { transform: scale(1.2); }
                        100% { transform: scale(1); }
                    }
                    @keyframes spin {
                        from { transform: rotate(0deg); }
                        to { transform: rotate(360deg); }
                    }
                </style>
            `;
            document.body.appendChild(overlay);
            setTimeout(() => overlay.remove(), 2000);
        }

        function renderShop() {
            const container = document.getElementById('shopItems');
            const items = shopItems[currentCategory];
            const coins = getCoins();

            container.innerHTML = `
                <div class="shop-grid">
                    ${items.map(item => {
                const owned = isOwned(item.id);
                const canAfford = coins >= item.price;
                return `
                            <div class="item-card ${owned ? 'owned' : ''}">
                                <div class="item-icon">${item.icon}</div>
                                <div class="item-name">${item.name}</div>
                                <div class="item-price">
                                    <span>💰</span>${item.price}
                                </div>
                                ${owned
                        ? '<button class="buy-btn owned" disabled data-i18n="label_owned">✓ Owned</button>'
                        : `<button class="buy-btn" ${!canAfford ? 'disabled' : ''} onclick="buyItem('${item.id}', ${item.price}, '${item.name}')" data-i18n="${canAfford ? 'btn_buy_now' : 'btn_need_more'}">${canAfford ? '🛒 Buy Now' : '🔒 Need More'}</button>`
                    }
                            </div>
                        `;
            }).join('')}
                </div>
            `;
        }

        // Initialize
        document.getElementById('coinBalance').textContent = getCoins();
        renderShop();
    </script>
</body>

</html>
