name: Emergency Monitor & Auto-Fix

on:
  schedule:
    # Rulează la fiecare oră fixă pentru monitorizare și reparații urgente
    - cron: '0 * * * *'
  workflow_dispatch: # Permite rulare manuală

jobs:
  emergency-auto-fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 🩺 Run Robot Doctor (Self-Healing)
        run: python utils/robot_doctor.py

      - name: Commit Status & Resolutions
        run: |
          git config --global user.name 'Robot Doctor'
          git config --global user.email 'doctor@kidsdigitalhub.com'
          git add data/resolutions.json
          git commit -m "🩺 Robot Doctor: System Health Verified & Repaired" || echo "No new fixes needed."
          git push
