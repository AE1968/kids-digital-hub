name: Nexus Virtual Auditor

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight
  workflow_dispatch: # Allow manual trigger

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: 🚀 Run Nexus Virtual Auditor
        run: python tests/nexus_auditor.py

      - name: Commit Audit Report
        run: |
          git config --global user.name 'Nexus Auditor'
          git config --global user.email 'nexus@kidsdigitalhub.com'
          git add data/audit_report.json
          git commit -m "📊 Audit Report Updated [$(date +'%Y-%m-%d')]" || echo "No changes to report"
          git push
