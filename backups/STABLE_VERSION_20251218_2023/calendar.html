<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar - Kids Digital Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .calendar-container {
            max-width: 900px;
            margin: 50px auto;
            background: white;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .calendar-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .calendar-header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .month-selector {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            background: #f8f9fa;
        }

        .month-selector button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 15px;
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .month-selector button:hover {
            transform: scale(1.05);
        }

        .current-month {
            font-size: 1.8rem;
            font-weight: 700;
            color: #667eea;
        }

        .calendar-grid {
            padding: 30px;
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .weekday {
            text-align: center;
            font-weight: 700;
            color: #667eea;
            padding: 10px;
            font-size: 1.1rem;
        }

        .days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
        }

        .day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 15px;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }

        .day:not(.empty):hover {
            background: #e8f0fe;
            transform: scale(1.1);
        }

        .day.today {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .day.selected {
            background: #4CAF50;
            color: white;
        }

        .day.empty {
            cursor: default;
        }

        .back-link {
            display: block;
            text-align: center;
            margin: 20px;
            padding: 12px 30px;
            background: white;
            color: #667eea;
            text-decoration: none;
            border-radius: 25px;
            font-weight: 600;
            display: inline-block;
        }

        .calendar-footer {
            text-align: center;
            padding: 20px;
        }

        @media (max-width: 768px) {
            .calendar-header h1 {
                font-size: 1.8rem;
            }

            .current-month {
                font-size: 1.3rem;
            }

            .day {
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>
    <div class="calendar-container">
        <div class="calendar-header">
            <h1>📅 Interactive Calendar</h1>
            <p>Click on any day to select it!</p>
        </div>

        <div class="month-selector">
            <button onclick="previousMonth()">◀ Previous</button>
            <div class="current-month" id="currentMonth"></div>
            <button onclick="nextMonth()">Next ▶</button>
        </div>

        <div class="calendar-grid">
            <div class="weekdays">
                <div class="weekday">Sun</div>
                <div class="weekday">Mon</div>
                <div class="weekday">Tue</div>
                <div class="weekday">Wed</div>
                <div class="weekday">Thu</div>
                <div class="weekday">Fri</div>
                <div class="weekday">Sat</div>
            </div>
            <div class="days" id="calendarDays"></div>
        </div>

        <div class="calendar-footer">
            <a href="index.html" class="back-link">🏠 Back to Home</a>
        </div>
    </div>

    <script>
        let currentDate = new Date();
        let selectedDate = null;

        const monthNames = [
            'January', 'February', 'March', 'April', 'May', 'June',
            'July', 'August', 'September', 'October', 'November', 'December'
        ];

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            // Update month display
            document.getElementById('currentMonth').textContent = `${monthNames[month]} ${year}`;

            // Get first day of month and number of days
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            // Get today's date for highlighting
            const today = new Date();
            const isCurrentMonth = today.getMonth() === month && today.getFullYear() === year;
            const todayDate = today.getDate();

            // Clear calendar
            const calendarDays = document.getElementById('calendarDays');
            calendarDays.innerHTML = '';

            // Add empty cells for days before month starts
            for (let i = 0; i < firstDay; i++) {
                const emptyDay = document.createElement('div');
                emptyDay.className = 'day empty';
                calendarDays.appendChild(emptyDay);
            }

            // Add days of month
            for (let day = 1; day <= daysInMonth; day++) {
                const dayElement = document.createElement('div');
                dayElement.className = 'day';
                dayElement.textContent = day;

                // Highlight today
                if (isCurrentMonth && day === todayDate) {
                    dayElement.classList.add('today');
                }

                // Add click handler
                dayElement.addEventListener('click', () => selectDay(day, dayElement));

                calendarDays.appendChild(dayElement);
            }
        }

        function selectDay(day, element) {
            // Remove previous selection
            document.querySelectorAll('.day.selected').forEach(el => {
                if (!el.classList.contains('today')) {
                    el.classList.remove('selected');
                }
            });

            // Add selection to clicked day
            if (!element.classList.contains('today')) {
                element.classList.add('selected');
            }

            selectedDate = new Date(currentDate.getFullYear(), currentDate.getMonth(), day);
            console.log('Selected date:', selectedDate.toDateString());
        }

        function previousMonth() {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
        }

        function nextMonth() {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
        }

        // Initialize calendar
        renderCalendar();
    </script>
</body>

</html>
