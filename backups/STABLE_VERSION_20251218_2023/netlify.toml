[build]
  publish = "."
  functions = "netlify/functions"

# 📡 Backend API proxy
[[redirects]]
  from = "/api/*"
  to = "https://web-production-b215.up.railway.app/api/:splat"
  status = 200
  force = true

# NOTE: Domain redirects (WWW vs non-WWW) are now handled by Netlify Dashboard 
# to avoid ERR_TOO_MANY_REDIRECTS loops with Cloudflare.

# NOTE: SPA redirect (/* to /index.html) removed for Multi-Page Site stability.
