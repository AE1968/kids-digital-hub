<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>Word Scramble - Kids Digital Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <script data-goatcounter="https://adrian.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 2.5rem;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .game-container {
            max-width: 600px;
            margin: 0 auto;
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat {
            background: rgba(255, 255, 255, 0.2);
            padding: 10px 25px;
            border-radius: 20px;
            color: white;
        }

        .game-card {
            background: white;
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .hint-emoji {
            font-size: 5rem;
            margin-bottom: 20px;
        }

        .scrambled-word {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .letter-tile {
            width: 50px;
            height: 60px;
            background: linear-gradient(135deg, #a18cd1, #fbc2eb);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .letter-tile:hover {
            transform: translateY(-5px);
        }

        .letter-tile.used {
            opacity: 0.3;
            transform: scale(0.9);
        }

        .answer-area {
            min-height: 70px;
            background: #f8f9fa;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .answer-tile {
            width: 50px;
            height: 60px;
            background: #4CAF50;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
            animation: popIn 0.2s;
        }

        @keyframes popIn {
            0% {
                transform: scale(0);
            }

            100% {
                transform: scale(1);
            }
        }

        .hint-text {
            color: #888;
            font-size: 1.1rem;
            margin-bottom: 20px;
        }

        .btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #a18cd1, #fbc2eb);
            color: white;
            border: none;
            border-radius: 20px;
            font-family: 'Fredoka', sans-serif;
            font-size: 1rem;
            cursor: pointer;
            margin: 5px;
        }

        .btn:hover {
            transform: scale(1.05);
        }

        .btn.clear {
            background: #f44336;
        }

        .btn.hint {
            background: #FF9800;
        }

        .feedback {
            font-size: 1.5rem;
            margin-top: 20px;
            min-height: 40px;
        }

        .feedback.correct {
            color: #4CAF50;
        }

        .feedback.wrong {
            color: #f44336;
        }

        .level-progress {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .level-dot {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
        }

        .level-dot.complete {
            background: #4CAF50;
            color: white;
        }

        .level-dot.current {
            background: #a18cd1;
            color: white;
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: bold;
        }

        .win-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .win-overlay.show {
            display: flex;
        }

        .win-box {
            background: white;
            padding: 50px;
            border-radius: 30px;
            text-align: center;
        }
    </style>
</head>

<body>
    <a href="../gallery-games.html" class="back-btn">← Back</a>

    <div class="header">
        <h1>🔤 Word Scramble</h1>
        <p>Unscramble the letters to find the word!</p>
    </div>

    <div class="game-container">
        <div class="stats-bar">
            <div class="stat">⭐ Score: <span id="score">0</span></div>
            <div class="stat">💡 Hints: <span id="hints">3</span></div>
        </div>

        <div class="game-card">
            <div class="level-progress" id="levelProgress"></div>

            <div class="hint-emoji" id="hintEmoji">🐱</div>
            <div class="hint-text" id="hintText">It's a furry pet that says "meow"</div>

            <div class="scrambled-word" id="scrambledWord"></div>
            <div class="answer-area" id="answerArea"></div>

            <div>
                <button class="btn clear" onclick="clearAnswer()">🔄 Clear</button>
                <button class="btn hint" onclick="useHint()">💡 Hint</button>
                <button class="btn" onclick="checkAnswer()">✓ Check</button>
            </div>

            <div class="feedback" id="feedback"></div>
        </div>
    </div>

    <div class="win-overlay" id="winOverlay">
        <div class="win-box">
            <h2 style="font-size: 2.5rem; color: #a18cd1; margin-bottom: 20px;">🎉 Level Complete!</h2>
            <p style="font-size: 1.2rem; margin-bottom: 30px;">Final Score: <span id="finalScore">0</span></p>
            <button class="btn" onclick="restartGame()">🔄 Play Again</button>
            <a href="../gallery-games.html" class="btn">🎮 More Games</a>
        </div>
    </div>

    <script>
        const words = [
            { word: 'CAT', emoji: '🐱', hint: 'A furry pet that says "meow"' },
            { word: 'DOG', emoji: '🐶', hint: 'Man\'s best friend' },
            { word: 'SUN', emoji: '☀️', hint: 'It shines in the sky during the day' },
            { word: 'STAR', emoji: '⭐', hint: 'It twinkles at night' },
            { word: 'FISH', emoji: '🐟', hint: 'It swims in water' },
            { word: 'CAKE', emoji: '🎂', hint: 'A sweet treat for birthdays' },
            { word: 'TREE', emoji: '🌳', hint: 'It has leaves and branches' },
            { word: 'MOON', emoji: '🌙', hint: 'It comes out at night' },
            { word: 'BIRD', emoji: '🐦', hint: 'It can fly and has feathers' },
            { word: 'BOOK', emoji: '📖', hint: 'You read stories in it' }
        ];

        let currentLevel = 0;
        let score = 0;
        let hints = 3;
        let currentWord = null;
        let scrambled = [];
        let answer = [];
        let usedIndices = [];

        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function loadLevel() {
            currentWord = words[currentLevel];
            scrambled = shuffleArray(currentWord.word.split(''));
            answer = [];
            usedIndices = [];

            document.getElementById('hintEmoji').textContent = currentWord.emoji;
            document.getElementById('hintText').textContent = currentWord.hint;
            document.getElementById('feedback').textContent = '';

            renderScrambled();
            renderAnswer();
            renderProgress();
        }

        function renderScrambled() {
            const container = document.getElementById('scrambledWord');
            container.innerHTML = scrambled.map((letter, i) => `
                <div class="letter-tile ${usedIndices.includes(i) ? 'used' : ''}" 
                     onclick="selectLetter(${i})">${letter}</div>
            `).join('');
        }

        function renderAnswer() {
            const container = document.getElementById('answerArea');
            container.innerHTML = answer.map((letter, i) => `
                <div class="answer-tile" onclick="removeLetter(${i})">${letter}</div>
            `).join('');
        }

        function renderProgress() {
            const container = document.getElementById('levelProgress');
            container.innerHTML = words.map((_, i) => `
                <div class="level-dot ${i < currentLevel ? 'complete' : i === currentLevel ? 'current' : ''}">${i + 1}</div>
            `).join('');
        }

        function selectLetter(index) {
            if (usedIndices.includes(index)) return;

            answer.push(scrambled[index]);
            usedIndices.push(index);

            renderScrambled();
            renderAnswer();

            if (window.KDH_Sounds) KDH_Sounds.playClick();
        }

        function removeLetter(index) {
            const letterIndex = usedIndices[index];
            answer.splice(index, 1);
            usedIndices.splice(index, 1);

            renderScrambled();
            renderAnswer();
        }

        function clearAnswer() {
            answer = [];
            usedIndices = [];
            renderScrambled();
            renderAnswer();
        }

        function useHint() {
            if (hints <= 0) {
                document.getElementById('feedback').textContent = '❌ No hints left!';
                document.getElementById('feedback').className = 'feedback wrong';
                return;
            }

            // Find next correct letter
            const nextIndex = answer.length;
            if (nextIndex >= currentWord.word.length) return;

            const correctLetter = currentWord.word[nextIndex];
            const availableIndex = scrambled.findIndex((l, i) =>
                l === correctLetter && !usedIndices.includes(i)
            );

            if (availableIndex !== -1) {
                selectLetter(availableIndex);
                hints--;
                document.getElementById('hints').textContent = hints;
            }
        }

        function checkAnswer() {
            const userAnswer = answer.join('');

            if (userAnswer === currentWord.word) {
                score += 10;
                document.getElementById('score').textContent = score;
                document.getElementById('feedback').textContent = '✅ Correct!';
                document.getElementById('feedback').className = 'feedback correct';

                if (window.KDH_Sounds) KDH_Sounds.playSuccess();

                setTimeout(() => {
                    currentLevel++;
                    if (currentLevel >= words.length) {
                        showWin();
                    } else {
                        loadLevel();
                    }
                }, 1000);
            } else {
                document.getElementById('feedback').textContent = '❌ Try again!';
                document.getElementById('feedback').className = 'feedback wrong';
                if (window.KDH_Sounds) KDH_Sounds.playError();
            }
        }

        function showWin() {
            document.getElementById('finalScore').textContent = score;
            document.getElementById('winOverlay').classList.add('show');

            if (window.KDH_Achievements) {
                KDH_Achievements.addProgress('spelling');
            }
        }

        function restartGame() {
            currentLevel = 0;
            score = 0;
            hints = 3;
            document.getElementById('score').textContent = '0';
            document.getElementById('hints').textContent = '3';
            document.getElementById('winOverlay').classList.remove('show');
            loadLevel();
        }

        // Initialize
        loadLevel();
    </script>
</body>

</html>
