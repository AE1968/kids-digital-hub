<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>Sudoku Kids - Kids Digital Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <script data-goatcounter="https://adrian.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            background: linear-gradient(135deg, #FFD1FF 0%, #FAE1FF 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            text-align: center;
            color: #764ba2;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 2.5rem;
            text-shadow: 2px 2px 0 rgba(255, 255, 255, 0.5);
        }

        .game-container {
            max-width: 500px;
            margin: 0 auto;
            text-align: center;
        }

        .sudoku-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            background: #764ba2;
            padding: 5px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(118, 75, 162, 0.3);
        }

        .cell {
            aspect-ratio: 1;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 5px;
        }

        .cell:hover {
            background: #f0f0f0;
        }

        .cell.fixed {
            background: #f8f9fa;
            color: #333;
            cursor: default;
        }

        .cell.selected {
            background: #FFD1FF;
            box-shadow: inset 0 0 10px #764ba2;
        }

        .cell.wrong {
            background: #FFCDD2;
        }

        .picker {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        .picker-btn {
            width: 60px;
            height: 60px;
            background: white;
            border: 3px solid #764ba2;
            border-radius: 15px;
            font-size: 2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }

        .picker-btn:hover {
            transform: scale(1.1);
        }

        .controls {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .btn {
            padding: 12px 30px;
            background: #764ba2;
            color: white;
            border: none;
            border-radius: 20px;
            font-family: 'Fredoka', sans-serif;
            font-size: 1rem;
            cursor: pointer;
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(118, 75, 162, 0.2);
            color: #764ba2;
            padding: 10px 20px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: bold;
        }

        .win-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .win-overlay.show {
            display: flex;
        }

        .win-box {
            background: white;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            animation: bounceIn 0.8s;
        }

        @keyframes bounceIn {
            0% {
                transform: scale(0.3);
                opacity: 0;
            }

            50% {
                transform: scale(1.05);
                opacity: 1;
            }

            70% {
                transform: scale(0.9);
            }

            100% {
                transform: scale(1);
            }
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
            color: #764ba2;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <a href="../gallery-games.html" class="back-btn">← Back</a>

    <div class="header">
        <h1>🦄 Sudoku Kids</h1>
        <p>Fill the grid with magic emojis!</p>
    </div>

    <div class="game-container">
        <div class="stats-bar">
            <span>⏱️ <span id="timer">0:00</span></span>
            <span>⭐ Difficulty: Easy</span>
        </div>

        <div class="sudoku-grid" id="grid"></div>

        <div class="picker" id="picker"></div>

        <div class="controls">
            <button class="btn" onclick="newGame()">🔄 New Game</button>
            <button class="btn" onclick="checkFullBoard()">✨ Check Logic</button>
        </div>
    </div>

    <div class="win-overlay" id="winOverlay">
        <div class="win-box">
            <h2 style="color: #4CAF50; font-size: 2.5rem; margin-bottom: 20px;">🎉 Perfect Match!</h2>
            <p style="font-size: 1.2rem; margin-bottom: 10px;">You solved the magic puzzle!</p>
            <p style="font-size: 1.5rem; color: #764ba2; margin-bottom: 30px;">Time: <span id="finalTime">0:00</span>
            </p>
            <button class="btn" onclick="newGame()">🌈 Play Again</button>
            <br><br>
            <a href="../gallery-games.html" class="btn" style="background: #9c27b0;">🎮 More Games</a>
        </div>
    </div>

    <script>
        const emojis = ['🐶', '🐱', '🤖', '🚀'];
        let grid = [];
        let fixed = [];
        let selectedCell = null;
        let timer = 0;
        let timerInterval;

        // Valid 4x4 Sudoku Puzzles
        const puzzles = [
            [
                [1, 2, 3, 4],
                [3, 4, 1, 2],
                [2, 3, 4, 1],
                [4, 1, 2, 3]
            ],
            [
                [4, 3, 2, 1],
                [1, 2, 3, 4],
                [3, 4, 1, 2],
                [2, 1, 4, 3]
            ],
            [
                [2, 4, 1, 3],
                [1, 3, 2, 4],
                [4, 2, 3, 1],
                [3, 1, 4, 2]
            ]
        ];

        function startTimer() {
            clearInterval(timerInterval);
            timer = 0;
            timerInterval = setInterval(() => {
                timer++;
                const mins = Math.floor(timer / 60);
                const secs = timer % 60;
                document.getElementById('timer').textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
            }, 1000);
        }

        function newGame() {
            document.getElementById('winOverlay').classList.remove('show');
            startTimer();

            // Pick a random puzzle base
            const base = puzzles[Math.floor(Math.random() * puzzles.length)];
            grid = base.map(row => [...row]);
            fixed = base.map(row => row.map(() => Math.random() > 0.4)); // Hide some cells

            renderGrid();
            renderPicker();
        }

        function renderGrid() {
            const gridEl = document.getElementById('grid');
            gridEl.innerHTML = '';

            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    if (fixed[r][c]) {
                        cell.classList.add('fixed');
                        cell.textContent = emojis[grid[r][c] - 1];
                    } else {
                        cell.textContent = grid[r][c] === 0 ? '' : emojis[grid[r][c] - 1];
                        cell.onclick = () => selectCell(r, c);
                    }
                    if (selectedCell && selectedCell.r === r && selectedCell.c === c) {
                        cell.classList.add('selected');
                    }
                    gridEl.appendChild(cell);
                }
            }
        }

        function renderPicker() {
            const pickerEl = document.getElementById('picker');
            pickerEl.innerHTML = '';
            emojis.forEach((emoji, i) => {
                const btn = document.createElement('button');
                btn.className = 'picker-btn';
                btn.textContent = emoji;
                btn.onclick = () => fillCell(i + 1);
                pickerEl.appendChild(btn);
            });
            // Eraser
            const eraser = document.createElement('button');
            eraser.className = 'picker-btn';
            eraser.textContent = '❌';
            eraser.onclick = () => fillCell(0);
            pickerEl.appendChild(eraser);
        }

        function selectCell(r, c) {
            if (fixed[r][c]) return;
            selectedCell = { r, c };
            renderGrid();
        }

        function fillCell(val) {
            if (!selectedCell) return;
            grid[selectedCell.r][selectedCell.c] = val;
            renderGrid();

            if (window.KDH_Sounds) KDH_Sounds.playClick();

            // Auto check for win if board is full
            if (isBoardFull()) {
                checkWin();
            }
        }

        function isBoardFull() {
            return grid.every(row => row.every(cell => cell !== 0));
        }

        function checkWin() {
            // Check rows, cols, and 2x2 squares
            if (isValidSudoku()) {
                clearInterval(timerInterval);
                document.getElementById('finalTime').textContent = document.getElementById('timer').textContent;
                document.getElementById('winOverlay').classList.add('show');
                if (window.KDH_Sounds) KDH_Sounds.playSuccess();
                if (window.KDH_Achievements) KDH_Achievements.addProgress('puzzles');
            }
        }

        function isValidSudoku() {
            // Rough check (since our base is valid, we just need to see if it matches the current logic)
            // 1. Check Rows
            for (let r = 0; r < 4; r++) {
                if (new Set(grid[r]).size !== 4) return false;
            }
            // 2. Check Columns
            for (let c = 0; c < 4; c++) {
                const col = [grid[0][c], grid[1][c], grid[2][c], grid[3][c]];
                if (new Set(col).size !== 4) return false;
            }
            // 3. Check 2x2 Squares
            const squares = [
                [grid[0][0], grid[0][1], grid[1][0], grid[1][1]],
                [grid[0][2], grid[0][3], grid[1][2], grid[1][3]],
                [grid[2][0], grid[2][1], grid[3][0], grid[3][1]],
                [grid[2][2], grid[2][3], grid[3][2], grid[3][3]]
            ];
            for (const sq of squares) {
                if (new Set(sq).size !== 4) return false;
            }
            return true;
        }

        function checkFullBoard() {
            if (!isBoardFull()) {
                alert("Fill the board first! 🧩");
                return;
            }
            if (isValidSudoku()) {
                checkWin();
            } else {
                alert("Some emojis are in the wrong place! Try again. 🤔");
                if (window.KDH_Sounds) KDH_Sounds.playError();
            }
        }

        // Initialize
        newGame();
    </script>
</body>

</html>
