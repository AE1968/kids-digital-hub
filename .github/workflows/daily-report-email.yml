name: Daily Evening Report

on:
  # Rulează automat în fiecare zi la ora 19:00 UTC (21:00 România)
  schedule:
    - cron: '0 19 * * *'
  
  # Permite și rulare manuală
  workflow_dispatch:

jobs:
  send-email-report:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      
      - name: Send Daily Report Email
        env:
          SMTP_HOST: 'smtp.gmail.com'
          SMTP_PORT: '587'
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          TO_EMAIL: 'adrianenc11@gmail.com'
        run: |
          python send_daily_report.py
