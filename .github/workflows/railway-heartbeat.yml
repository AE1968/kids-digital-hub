name: 💓 Railway Heartbeat (Keep-Alive)

on:
  schedule:
    - cron: '*/15 * * * *' # Every 15 minutes
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send Heartbeat to Railway
        run: |
          curl -f https://web-production-b215.up.railway.app/api/ping || echo "Server might be sleeping, waking up..."
          curl -f https://web-production-b215.up.railway.app/api/uptime/detailed || echo "Waiting for server to fully initialize..."
