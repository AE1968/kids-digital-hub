    /* CENTERED AE BUTTON STYLE */
    /* CENTERED AE BUTTON WITH PULSE */
    .ae-hero-btn {
      display: inline-block;
      margin-top: 80px;
      position: relative;
      cursor: pointer;
      z-index: 10;
    }

    .ae-hero-btn img {
      width: 120px;
      height: auto;
      filter: drop-shadow(0 5px 15px rgba(0, 0, 0, 0.2));
      position: relative;
      /* Above the pulse */
      z-index: 2;
      transition: transform 0.3s;
    }

    .ae-hero-btn:hover img {
      transform: scale(1.1);
    }

    /* PULSE ANIMATION (Warning Circles) */
    .ae-pulse {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: rgba(255, 87, 34, 0.4);
      /* Warning Orange */
      animation: pulse-ring 2s infinite;
      z-index: 1;
    }

    .ae-pulse::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid #FF5722;
      animation: pulse-ring 2s infinite 0.5s;
    }

    @keyframes pulse-ring {
      0% {
        transform: translate(-50%, -50%) scale(0.8);
        opacity: 0.8;
      }

      100% {
        transform: translate(-50%, -50%) scale(2.5);
        opacity: 0;
      }
    }
  </style>

  <script>
    // Initialize Language
    document.addEventListener('DOMContentLoaded', () => {
      // 1. Check for Saved Preference (localStorage)
      const savedLang = localStorage.getItem('kdh_lang');

      // 2. Check for Edge Function Auto-Detect (Cookie)
      const getCookie = (name) => {
        const value = `; ${document.cookie}`;
        const parts = value.split(`; ${name}=`);
        if (parts.length === 2) return parts.pop().split(';').shift();
      };
      const autoLang = getCookie('nf_lang');

      // Priority: Saved > Auto > Default (en)
      const lang = savedLang || autoLang || 'en';

      // Set dropdown value
      const select = document.querySelector('.lang-select');
      if (select) {
        select.value = lang;
      }

      // Apply translation
      changeLanguage(lang);
    });

    function changeLanguage(lang) {
      // Save preference
      localStorage.setItem('kdh_lang', lang);

      // Also update cookie to match selection
      document.cookie = `nf_lang=${lang}; Path=/; SameSite=Lax`;

      const t = translations[lang] || translations['en'];

      if (!t) return; // Safety check

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (t[key]) {
          el.innerHTML = t[key];
        }
      });

      // Update Seasonal Background Text if function exists
      if (typeof updateSeasonalBackground === 'function') {
        updateSeasonalBackground();
      }
    }


  </script>
