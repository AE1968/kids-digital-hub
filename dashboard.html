<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dashboard - Kids Digital Hub</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        .dashboard-header {
            background: #4DB6AC;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            border-bottom: 5px solid #00897B;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .avatar-circle {
            width: 60px;
            height: 60px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            border: 3px solid #B2DFDB;
        }

        .stats-container {
            max-width: 1000px;
            margin: 40px auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            padding: 20px;
        }

        .stat-card {
            background: white;
            border-radius: 25px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 8px 0 rgba(0, 0, 0, 0.1);
            border: 4px solid;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .card-drawings {
            border-color: #FF7043;
            color: #D84315;
        }

        .card-games {
            border-color: #42A5F5;
            color: #1565C0;
        }

        .card-stories {
            border-color: #66BB6A;
            color: #2E7D32;
        }

        .stat-icon {
            font-size: 3.5rem;
            margin-bottom: 10px;
            display: block;
        }

        .stat-count {
            font-size: 2.5rem;
            font-weight: bold;
        }

        .stat-label {
            font-size: 1.2rem;
            font-weight: 600;
            opacity: 0.8;
        }

        .progress-bar {
            background: #ECEFF1;
            height: 15px;
            border-radius: 10px;
            margin-top: 15px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            border-radius: 10px;
            transition: width 0.5s;
        }

        .premium-teaser {
            background: linear-gradient(45deg, #FFD54F, #FFCA28);
            margin: 40px 20px;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            color: #5D4037;
            position: relative;
            overflow: hidden;
            border: 4px dashed #FFA000;
        }

        .back-home-btn {
            background: #FFF;
            color: #00897B;
            padding: 8px 15px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: bold;
            border: 2px solid #00897B;
        }
    </style>
</head>

<body>

    <header class="dashboard-header">
        <div class="user-profile">
            <div class="avatar-circle">🦖</div>
            <div>
                <h2 style="margin:0;">Hi, Guest!</h2>
                <span style="font-size:0.9rem; opacity:0.9;">Free Explorer</span>
            </div>
        </div>
        <a href="index.html" class="back-home-btn">🚪 Logout</a>
    </header>

    <main>
        <div class="stats-container">
            <!-- SLOT 1: DESENE -->
            <div class="stat-card card-drawings">
                <span class="stat-icon">🎨</span>
                <div class="stat-count">2/10</div>
                <div class="stat-label">Saved Drawings</div>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: 20%; background: #FF7043;"></div>
                </div>
                <button
                    style="margin-top:15px; padding:10px 20px; border-radius:15px; border:none; background:#FFCCBC; color:#BF360C; font-weight:bold; cursor:pointer;">See
                    Gallery</button>
            </div>

            <!-- SLOT 2: JOCURI -->
            <div class="stat-card card-games">
                <span class="stat-icon">🎮</span>
                <div class="stat-count">5/10</div>
                <div class="stat-label">Favorite Games</div>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: 50%; background: #42A5F5;"></div>
                </div>
                <button
                    style="margin-top:15px; padding:10px 20px; border-radius:15px; border:none; background:#BBDEFB; color:#0D47A1; font-weight:bold; cursor:pointer;"
                    onclick="location.href='gallery-games.html'">Play
                    Now</button>
            </div>

            <!-- SLOT 3: POVESTI -->
            <div class="stat-card card-stories">
                <span class="stat-icon">📚</span>
                <div class="stat-count">1/10</div>
                <div class="stat-label">Library Books</div>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: 10%; background: #66BB6A;"></div>
                </div>
                <button
                    style="margin-top:15px; padding:10px 20px; border-radius:15px; border:none; background:#C8E6C9; color:#1B5E20; font-weight:bold; cursor:pointer;"
                    onclick="location.href='gallery-stories.html'">Read
                    More</button>
            </div>
        </div>

        <section class="premium-teaser">
            <h2>🚀 Need More Space?</h2>
            <p>Unlock UNLIMITED space for all your creations!</p>
            <div style="font-size:3rem; margin:10px;">🔒</div>
            <p style="opacity:0.7;">(Premium Feature - Coming Soon)</p>
        </section>
    </main>

    <script>
        // Check Premium Status
        document.addEventListener('DOMContentLoaded', () => {
            const isPremium = localStorage.getItem('kdh_premium_user') === 'true';

            if (isPremium) {
                const teaser = document.querySelector('.premium-teaser');
                teaser.style.background = "linear-gradient(45deg, #81C784, #4CAF50)";
                teaser.style.color = "white";
                teaser.style.border = "none";
                teaser.innerHTML = `
                    <h2>🌟 Premium Member</h2>
                    <p>You have UNLIMITED access to all features!</p>
                    <div style="font-size:3rem; margin:10px;">🔓</div>
                    <button onclick="alert('Accessing Premium Library...')" style="background:white; color:#2E7D32; border:none; padding:10px 20px; border-radius:20px; font-weight:bold; cursor:pointer;">Browse Premium Content</button>
                `;

                // Update Profile Badge
                document.querySelector('.user-profile span').textContent = "👑 Premium Super-Star";
            } else {
                // Link Teaser to Payment
                const teaser = document.querySelector('.premium-teaser');
                teaser.style.cursor = "pointer";
                teaser.onclick = () => {
                    window.location.href = "payment.html";
                }
            }
        });
    </script>
</body>

</html>
