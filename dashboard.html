<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dashboard - Kids Digital Hub</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        .dashboard-header {
            background: #4DB6AC;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            border-bottom: 5px solid #00897B;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .avatar-circle {
            width: 60px;
            height: 60px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            border: 3px solid #B2DFDB;
        }

        .stats-container {
            max-width: 1000px;
            margin: 40px auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            padding: 20px;
        }

        .stat-card {
            background: white;
            border-radius: 25px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 8px 0 rgba(0, 0, 0, 0.1);
            border: 4px solid;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .card-drawings {
            border-color: #FF7043;
            color: #D84315;
        }

        .card-games {
            border-color: #42A5F5;
            color: #1565C0;
        }

        .card-stories {
            border-color: #66BB6A;
            color: #2E7D32;
        }

        .stat-icon {
            font-size: 3.5rem;
            margin-bottom: 10px;
            display: block;
        }

        .stat-count {
            font-size: 2.5rem;
            font-weight: bold;
        }

        .stat-label {
            font-size: 1.2rem;
            font-weight: 600;
            opacity: 0.8;
        }

        .progress-bar {
            background: #ECEFF1;
            height: 15px;
            border-radius: 10px;
            margin-top: 15px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            border-radius: 10px;
            transition: width 0.5s;
        }

        .premium-teaser {
            background: linear-gradient(45deg, #FFD54F, #FFCA28);
            margin: 40px 20px;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            color: #5D4037;
            position: relative;
            overflow: hidden;
            border: 4px dashed #FFA000;
        }

        .btn-action {
            margin-top: 15px;
            padding: 10px 20px;
            border-radius: 15px;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-logout {
            background: #FFF;
            color: #d32f2f;
            padding: 8px 15px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: bold;
            border: 2px solid #d32f2f;
            cursor: pointer;
        }

        .login-box {
            background: white;
            padding: 40px;
            border-radius: 25px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            margin: 40px auto;
            border: 5px solid #00897B;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .login-input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #B2DFDB;
            border-radius: 10px;
            font-size: 1rem;
            box-sizing: border-box;
        }

        .login-btn {
            background: #00897B;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 20px;
            font-size: 1.1rem;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }

        .plans-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .plan-card {
            background: white;
            border: 3px solid #E0E0E0;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .plan-card:hover {
            transform: translateY(-5px);
            border-color: #00897B;
        }

        .plan-card.active {
            border-color: #00897B;
            background: #E0F2F1;
        }

        .plan-price {
            font-size: 1.5rem;
            font-weight: bold;
            color: #00897B;
            margin: 10px 0;
        }
    </style>
</head>

<body>

    <header class="dashboard-header">
        <div class="user-profile">
            <div class="avatar-circle">🦖</div>
            <div>
                <h2 style="margin:0;" id="user-name-display">Guest</h2>
                <span style="font-size:0.9rem; opacity:0.9;" id="storage-display">0GB</span>
            </div>
        </div>
        <div>
            <a href="index.html" class="btn-logout" data-i18n="btn_back"
                style="margin-right:10px; border-color:#fff; color:#00897B;">Back</a>
            <button id="btn-logout" class="btn-logout" style="display:none;" data-i18n="nav_myhub">Logout</button>
        </div>
    </header>

    <main>
        <!-- LOGIN SECTION -->
        <section id="login-section">
            <div class="login-box">
                <div style="font-size:3rem; margin-bottom:10px;">🦖</div>
                <h2 data-i18n="login_title">Login to Kids Hub</h2>
                <form id="login-form">
                    <input type="text" id="username" class="login-input" placeholder="Username" data-i18n="login_user">
                    <input type="password" id="password" class="login-input" placeholder="Password"
                        data-i18n="login_pass">
                    <button type="submit" class="login-btn" data-i18n="btn_login">Login</button>
                </form>
            </div>
        </section>

        <!-- PROFILE SECTION (Initially Hidden) -->
        <section id="profile-section" style="display:none;">
            <div class="stats-container">
                <!-- SLOT 1: DRAWINGS -->
                <div class="stat-card card-drawings">
                    <span class="stat-icon">🎨</span>
                    <div class="stat-count">0/10</div>
                    <div class="stat-label" data-i18n="nav_coloring">Coloring</div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: 0%; background: #FF7043;"></div>
                    </div>
                    <button class="btn-action" style="background:#FFCCBC; color:#BF360C;"
                        onclick="location.href='gallery-drawings.html'" data-i18n="nav_coloring">Go</button>
                </div>

                <!-- SLOT 2: GAMES -->
                <div class="stat-card card-games">
                    <span class="stat-icon">🎮</span>
                    <div class="stat-count">0/10</div>
                    <div class="stat-label" data-i18n="nav_games">Games</div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: 0%; background: #42A5F5;"></div>
                    </div>
                    <button class="btn-action" style="background:#BBDEFB; color:#0D47A1;"
                        onclick="location.href='gallery-games.html'" data-i18n="btn_play">Play</button>
                </div>

                <!-- SLOT 3: STORIES -->
                <div class="stat-card card-stories">
                    <span class="stat-icon">📚</span>
                    <div class="stat-count">0/10</div>
                    <div class="stat-label" data-i18n="nav_stories">Stories</div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: 0%; background: #66BB6A;"></div>
                    </div>
                    <button class="btn-action" style="background:#C8E6C9; color:#1B5E20;"
                        onclick="location.href='gallery-stories.html'" data-i18n="btn_read">Read</button>
                </div>
            </div>

            <section class="premium-teaser">
                <h2 data-i18n="storage_alloc">Storage Allocation</h2>
                <div class="plans-grid">
                    <!-- 2 GBP -->
                    <div class="plan-card">
                        <div style="font-size:2rem;">🥉</div>
                        <div class="plan-price">£2.00 / mo</div>
                        <div class="plan-storage">500 GB</div>
                    </div>
                    <!-- 4 GBP -->
                    <div class="plan-card">
                        <div style="font-size:2rem;">🥈</div>
                        <div class="plan-price">£4.00 / mo</div>
                        <div class="plan-storage">2 TB</div>
                    </div>
                    <!-- 10 GBP -->
                    <div class="plan-card">
                        <div style="font-size:2rem;">🥇</div>
                        <div class="plan-price">£10.00 / mo</div>
                        <div class="plan-storage">10 TB</div>
                    </div>
                </div>
            </section>
        </section>
    </main>

    <script src="js/translations.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const lang = localStorage.getItem('kdh_lang') || 'en';
            if (typeof changeLanguage === 'function') {
                changeLanguage(lang);
            }
        });
    </script>
</body>

</html>
