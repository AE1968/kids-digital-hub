<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Drawings - Kids Digital Hub</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        .gallery-header {
            background: #FF7043;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: white;
            border-bottom: 5px solid #D84315;
        }

        .gallery-grid {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .slot {
            aspect-ratio: 1;
            background: white;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }

        .slot.filled {
            border: 4px solid #FFAB91;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .slot.filled:hover {
            transform: scale(1.05);
        }

        .slot.empty {
            border: 4px dashed #CFD8DC;
            background: #F5F5F5;
        }

        .slot-content {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%) contrast(1.5) brightness(1.1) !important;
            /* FORCED B&W + Outline Effect */
        }

        .slot:hover .slot-content {
            /* No color on hover, stricly coloring book style */
            transform: scale(1.02);
        }

        .empty-label {
            color: #B0BEC5;
            font-weight: bold;
            font-size: 0.9rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .slot-number {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: bold;
            z-index: 2;
        }

        .btn-delete {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: #FFEB3B;
            /* Yellow for Admin Visibility */
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
            font-size: 1.2rem;
            display: none;
            /* Hidden by default, shown by JS if admin */
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            z-index: 20;
        }

        .btn-delete:hover {
            background: #ffebee;
            transform: scale(1.1);
        }

        .slot.filled:hover .btn-delete {
            opacity: 1;
        }

        .btn-back-dash {
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 15px;
            border-radius: 20px;
            color: white;
            text-decoration: none;
            font-weight: bold;
            border: 2px solid white;
        }
    </style>
</head>

<body>

    <header class="gallery-header">
        <div style="display:flex; align-items:center; gap:10px;">
            <span style="font-size:2rem;">🎨</span>
            <h2 style="margin:0;">My Art Gallery</h2>
        </div>
        <a href="index.html" class="btn-back-dash" data-i18n="btn_back">⬅️ Back</a>
    </header>

    <main>
        <div class="gallery-grid">
            <!-- SLOT 1: FILLED (New AI Generation) -->
            <div class="slot filled">
                <span class="slot-number">1</span>
                <span
                    style="position:absolute; top:10px; right:10px; font-weight:bold; color:#555; background:rgba(255,255,255,0.8); padding:2px 5px; border-radius:5px; z-index:10; pointer-events:none;">Space
                    Robot</span>
                <img src="assets/images/coloring_robot_space.png" class="slot-content" alt="Space Robot"
                    onclick="openPainter('assets/images/coloring_robot_space.png')" style="cursor: pointer;">
                <button class="btn-delete" title="Delete Drawing">🗑️</button>
            </div>
            <!-- SLOT 2: EMPTY -->
            <div class="slot empty"><span class="slot-number">2</span>
                <div class="empty-label"><span>➕</span><span>Empty</span></div>
            </div>

            <!-- SLOT 3: EMPTY -->
            <div class="slot empty"><span class="slot-number">3</span>
                <div class="empty-label"><span>➕</span><span>Empty</span></div>
            </div>
            <div class="slot empty"><span class="slot-number">4</span>
                <div class="empty-label"><span>➕</span><span>Empty</span></div>
            </div>
            <div class="slot empty"><span class="slot-number">5</span>
                <div class="empty-label"><span>➕</span><span>Empty</span></div>
            </div>
            <div class="slot empty"><span class="slot-number">6</span>
                <div class="empty-label"><span>➕</span><span>Empty</span></div>
            </div>
            <div class="slot empty"><span class="slot-number">7</span>
                <div class="empty-label"><span>➕</span><span>Empty</span></div>
            </div>
            <div class="slot empty"><span class="slot-number">8</span>
                <div class="empty-label"><span>➕</span><span>Empty</span></div>
            </div>
            <div class="slot empty"><span class="slot-number">9</span>
                <div class="empty-label"><span>➕</span><span>Empty</span></div>
            </div>

            <!-- SLOT 10: PREMIUM -->
            <div class="slot empty premium-slot"><span class="slot-number">10</span>
                <div class="empty-label"><span>🔒 Premium</span></div>
            </div>
        </div>
    </main>

    <script src="js/translations.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Language
            const lang = localStorage.getItem('kdh_lang') || 'en';
            changeLanguage(lang);

            // Auth Protection
            auth.applyProtection();

            // Dynamic Stats: Count filled slots and save
            const filledCount = document.querySelectorAll('.slot.filled').length;
            localStorage.setItem('kdh_cnt_drawings', filledCount);

            // Attach Delete Handlers
            document.querySelectorAll('.btn-delete').forEach(btn => {
                btn.addEventListener('click', function () {
                    const confirmMsg = lang === 'ro' ? "Sigur vrei să ștergi acest desen?" : "Are you sure you want to delete this drawing?";
                    if (confirm(confirmMsg)) {
                        const slot = this.parentElement;
                        // Clear slot content visually
                        slot.classList.remove('filled');
                        slot.classList.add('empty');
                        const number = slot.querySelector('.slot-number').textContent;
                        slot.innerHTML = `
                            <span class="slot-number">${number}</span>
                            <div class="empty-label"><span>➕</span><span>Empty</span></div>
                        `;
                    }
                });
            });
        });
    </script>

    <!-- PAINT APP OVERLAY -->
    <div id="paintOverlay"
        style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:2000; flex-direction:column; align-items:center; justify-content:center;">
        <div style="background:white; padding:10px; border-radius:15px; display:flex; gap:10px; margin-bottom:10px;">
            <div class="color-btn" style="background:red;" onclick="setColor('red')"></div>
            <div class="color-btn" style="background:blue;" onclick="setColor('blue')"></div>
            <div class="color-btn" style="background:green;" onclick="setColor('green')"></div>
            <div class="color-btn" style="background:yellow;" onclick="setColor('yellow')"></div>
            <div class="color-btn" style="background:orange;" onclick="setColor('orange')"></div>
            <div class="color-btn" style="background:purple;" onclick="setColor('purple')"></div>
            <div class="color-btn" style="background:black;" onclick="setColor('black')"></div>
            <div class="color-btn" style="background:white; border:2px solid #ccc; cursor:pointer;"
                onclick="setColor('white')" title="Eraser">🧽</div>
            <div style="width:20px;"></div>
            <button onclick="printDrawing()"
                style="background:#2196F3; color:white; border:none; padding:5px 15px; border-radius:5px; cursor:pointer; font-weight:bold; margin-right:10px;">PRINT
                🖨️</button>
            <button onclick="closePainter()"
                style="background:#f44336; color:white; border:none; padding:5px 15px; border-radius:5px; cursor:pointer; font-weight:bold;">EXIT
                ❌</button>
        </div>
        <div style="position:relative; width:500px; height:500px; background:white; border:4px solid #333;"
            id="printableArea">
            <img id="paintBg" src=""
                style="position:absolute; width:100%; height:100%; object-fit:contain; pointer-events:none; opacity:0.3;">
            <canvas id="paintCanvas" width="500" height="500"
                style="position:absolute; top:0; left:0; cursor:crosshair;"></canvas>
        </div>
        <style>
            .color-btn {
                width: 30px;
                height: 30px;
                border-radius: 50%;
                cursor: pointer;
                border: 2px solid #fff;
                box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
                transition: transform 0.2s;
            }

            .color-btn:hover {
                transform: scale(1.2);
            }

            @media print {
                body * {
                    visibility: hidden;
                }

                #printableArea,
                #printableArea * {
                    visibility: visible;
                }

                #printableArea {
                    position: absolute;
                    left: 0;
                    top: 0;
                    width: 100%;
                    height: 100%;
                    border: none;
                }

                #paintOverlay {
                    background: white !important;
                    display: block !important;
                }
            }
        </style>
    </div>

    <!-- PAINTER SCRIPT -->
    <script>
        const canvas = document.getElementById('paintCanvas');
        const ctx = canvas.getContext('2d');
        let painting = false;
        let currentColor = 'red';

        function openPainter(imgSrc) {
            document.getElementById('paintOverlay').style.display = 'flex';
            document.getElementById('paintBg').src = imgSrc;
            // Resize canvas to match display size
            canvas.width = 500;
            canvas.height = 500;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.lineWidth = 5;
            ctx.lineCap = 'round';
            ctx.strokeStyle = currentColor;
        }

        function closePainter() {
            document.getElementById('paintOverlay').style.display = 'none';
        }

        function setColor(color) {
            currentColor = color;
            ctx.strokeStyle = currentColor;
            if (color === 'white') ctx.lineWidth = 20;
            else ctx.lineWidth = 5;
        }

        function printDrawing() {
            window.print();
        }

        function startPosition(e) {
            painting = true;
            draw(e);
        }
        function endPosition() {
            painting = false;
            ctx.beginPath();
        }
        function draw(e) {
            if (!painting) return;
            // Handle both mouse and touch coordinates
            let clientX = e.clientX;
            let clientY = e.clientY;

            const rect = canvas.getBoundingClientRect();
            ctx.lineWidth = (currentColor === 'white') ? 20 : 5;
            ctx.lineCap = 'round';
            ctx.strokeStyle = currentColor;

            ctx.lineTo(clientX - rect.left, clientY - rect.top);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(clientX - rect.left, clientY - rect.top);
        }

        // Mouse Events
        canvas.addEventListener('mousedown', startPosition);
        canvas.addEventListener('mouseup', endPosition);
        canvas.addEventListener('mousemove', draw);

        // Touch Events
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const mouseEvent = new MouseEvent("mousedown", {
                clientX: touch.clientX,
                clientY: touch.clientY
            });
            canvas.dispatchEvent(mouseEvent);
        }, { passive: false });

        canvas.addEventListener('touchend', (e) => {
            const mouseEvent = new MouseEvent("mouseup", {});
            canvas.dispatchEvent(mouseEvent);
        });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const mouseEvent = new MouseEvent("mousemove", {
                clientX: touch.clientX,
                clientY: touch.clientY
            });
            canvas.dispatchEvent(mouseEvent);
        }, { passive: false });
    </script>

</body>

</html>
