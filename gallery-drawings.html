<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Drawings - Kids Digital Hub</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        .gallery-header {
            background: #FF7043;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: white;
            border-bottom: 5px solid #D84315;
            z-index: 1000;
            position: relative;
        }

        .gallery-grid {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .slot {
            aspect-ratio: 1;
            background: white;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }

        .slot.filled {
            border: 4px solid #FFAB91;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .slot.filled:hover {
            transform: scale(1.05);
        }

        .slot.empty {
            border: 4px dashed #CFD8DC;
            background: #F5F5F5;
        }

        .slot.premium-slot {
            border-color: gold;
            background: #fff8e1;
            /* Light gold tint */
        }

        .slot-content {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%) contrast(1.5) brightness(1.1) !important;
        }

        .slot:hover .slot-content {
            transform: scale(1.02);
        }

        .empty-label {
            color: #B0BEC5;
            font-weight: bold;
            font-size: 0.9rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .slot-number {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: bold;
            z-index: 2;
        }

        .btn-delete {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: #FFEB3B;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
            font-size: 1.2rem;
            display: none;
            /* Shown by JS for filled slots */
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            z-index: 20;
        }

        /* Ensure delete button is visible on hover for filled slots */
        .slot.filled:hover .btn-delete {
            display: block;
        }

        .btn-delete:hover {
            background: #ffebee;
            transform: scale(1.1);
        }

        .btn-back-dash {
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 15px;
            border-radius: 20px;
            color: white;
            text-decoration: none;
            font-weight: bold;
            border: 2px solid white;
        }
    </style>
</head>

<body>

    <header class="gallery-header">
        <div style="display:flex; align-items:center; gap:10px;">
            <span style="font-size:2rem;">🎨</span>
            <h2 style="margin:0;">My Art Gallery</h2>
        </div>
        <a href="index.html" class="btn-back-dash" data-i18n="btn_back">⬅️ Back</a>
    </header>

    <main>
        <!-- DYNAMIC CONTAINER -->
        <div class="gallery-grid" id="galleryContainer">
            <!-- Content generated by JS -->
        </div>
    </main>

    <script src="js/translations.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // --- DYNAMIC CONFIGURATION ---
        const drawingsConfig = [
            { id: 1, title: 'Space Robot', img: 'assets/images/coloring_robot_space.png', premium: false },
            { id: 2, title: 'Cute Cat', img: 'assets/images/coloring_cute_cat.png', premium: false },
            { id: 3, title: 'Dino Fun', img: 'assets/images/coloring_dino.png', premium: false },
            { id: 4, title: 'Racing Car', img: 'assets/images/coloring_racing_car.png', premium: false },
            { id: 5, title: 'Princess Castle', img: 'assets/images/coloring_princess_castle.png', premium: false },
            { id: 6, title: 'Butterfly', img: 'assets/images/coloring_butterfly.png', premium: false },
            { id: 7, title: 'Submarine', img: 'assets/images/coloring_submarine.png', premium: false },
            { id: 8, title: 'Magic Unicorn', img: 'assets/images/coloring_unicorn.png', premium: false },
            { id: 9, title: 'Superhero', img: 'assets/images/coloring_superhero.png', premium: false },
            { id: 10, title: 'Expert Mandala', img: 'assets/images/coloring_mandala_complex.png', premium: true }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            // Language
            const lang = localStorage.getItem('kdh_lang') || 'en';
            changeLanguage(lang);

            // Auth Protection
            auth.applyProtection();

            // --- ROLE CHECK (PREMIUM VISIBILITY) ---
            // In a real app, this would verify a token. Here, we check local flag set by admin login.
            const isAdmin = localStorage.getItem('kdh_admin_mode') === 'true';

            // Load Deleted Slots
            let deletedSlots = JSON.parse(localStorage.getItem('kdh_deleted_drawings') || '[]');

            const container = document.getElementById('galleryContainer');
            container.innerHTML = '';

            drawingsConfig.forEach(item => {
                // RULE: If Premium and NOT Admin -> Do NOT render at all.
                if (item.premium && !isAdmin) {
                    return;
                }

                const isDeleted = deletedSlots.includes(item.id.toString());
                const slotDiv = document.createElement('div');
                slotDiv.className = isDeleted ? 'slot empty' : 'slot filled';
                if (item.premium) slotDiv.classList.add('premium-slot');

                if (isDeleted) {
                    // Empty State
                    slotDiv.innerHTML = `
                        <span class="slot-number">${item.id}</span>
                        <div class="empty-label"><span>➕</span><span>Empty</span></div>
                    `;
                } else {
                    // Title Label
                    const titleLabel = `
                        <span style="position:absolute; top:10px; right:10px; font-weight:bold; color:#555; background:rgba(255,255,255,0.8); padding:2px 5px; border-radius:5px; z-index:10; pointer-events:none;">
                            ${item.premium ? '🔒 ' + item.title : item.title}
                        </span>`;

                    // Click Action
                    let clickAction = '';
                    if (item.premium) {
                        // Placeholder for Premium Studio
                        clickAction = `alert('Premium Studio Loading for: ${item.title} (Requires Separate Module)')`;
                    } else {
                        // Standard Paint Pro
                        clickAction = `openPainter('${item.img}', '${item.title}')`;
                    }

                    slotDiv.innerHTML = `
                        <span class="slot-number">${item.id}</span>
                        ${titleLabel}
                        <img src="${item.img}" class="slot-content" alt="${item.title}" onclick="${clickAction}" style="cursor: pointer;">
                        <button class="btn-delete" title="Delete Drawing" onclick="deleteDrawing(${item.id})">🗑️</button>
                    `;
                }
                container.appendChild(slotDiv);
            });

            updateStats();
        });

        function deleteDrawing(id) {
            const lang = localStorage.getItem('kdh_lang') || 'en';
            const confirmMsg = lang === 'ro' ? "Sigur vrei să ștergi acest desen?" : "Are you sure you want to delete this drawing?";

            if (confirm(confirmMsg)) {
                let deletedSlots = JSON.parse(localStorage.getItem('kdh_deleted_drawings') || '[]');
                deletedSlots.push(id.toString());
                localStorage.setItem('kdh_deleted_drawings', JSON.stringify(deletedSlots));
                location.reload();
            }
        }

        function updateStats() {
            const filledCount = document.querySelectorAll('.slot.filled').length;
            localStorage.setItem('kdh_cnt_drawings', filledCount);
        }
    </script>

    <!-- PAINT APP OVERLAY (WINDOWS PAINT STYLE) - Z-INDEX 99999 -->
    <div id="paintOverlay"
        style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#202020; z-index:99999; flex-direction:column; font-family: 'Segoe UI', sans-serif;">

        <!-- HEADER / RIBBON -->
        <div
            style="background:#2b2b2b; padding:10px 20px; display:flex; align-items:center; gap:20px; border-bottom:1px solid #444; height:60px;">
            <div id="paintTitle" style="color:white; font-size:14px; font-weight:bold; margin-right:20px;">🎨 Paint Pro
            </div>

            <!-- Tools Group -->
            <div class="toolbar-group">
                <div class="tool-icon active" onclick="useTool('brush')" title="Brush">🖌️</div>
                <div class="tool-icon" onclick="useTool('marker')" title="Marker">🖍️</div>
                <div class="tool-icon" onclick="useTool('pencil')" title="Pencil">✏️</div>
                <div class="tool-icon" onclick="useTool('eraser')" title="Eraser">🧽</div>
                <div class="tool-icon" onclick="clearCanvas()" title="Clear All (Trash)">🗑️</div>
                <div class="tool-icon" onclick="undoLast()" title="Undo">↩️</div>
            </div>

            <!-- Separator -->
            <div style="width:1px; height:30px; background:#555;"></div>

            <!-- Colors Group -->
            <div class="toolbar-group">
                <input type="color" id="mainColor" value="#ff0000" onchange="setColor(this.value)" title="Choose Color">
                <div class="quick-color" style="background:red;" onclick="setQuickColor('red')"></div>
                <div class="quick-color" style="background:blue;" onclick="setQuickColor('blue')"></div>
                <div class="quick-color" style="background:green;" onclick="setQuickColor('green')"></div>
                <div class="quick-color" style="background:yellow;" onclick="setQuickColor('yellow')"></div>
                <div class="quick-color" style="background:black;" onclick="setQuickColor('black')"></div>
                <div class="quick-color" style="background:white;" onclick="setQuickColor('white')"></div>
            </div>

            <div style="flex:1;"></div>

            <!-- Window Controls -->
            <div class="toolbar-group">
                <button class="win-btn print" onclick="printDrawing()">🖨️ Print</button>
                <button class="win-btn close" onclick="closePainter()">❌ Exit</button>
            </div>
        </div>

        <!-- MAIN WORKSPACE -->
        <div style="flex:1; display:flex; position:relative; overflow:hidden;">

            <!-- LEFT PANEL (SLIDERS) -->
            <div
                style="width:80px; background:#333; display:flex; flex-direction:column; align-items:center; padding-top:20px; border-right:1px solid #444;">
                <!-- Size Slider -->
                <div class="slider-container">
                    <label>Size</label>
                    <input type="range" orient="vertical" id="brushSize" min="1" max="50" value="5"
                        oninput="setSize(this.value)">
                    <span id="sizeVal">5px</span>
                </div>

                <div style="height:20px;"></div>

                <!-- Opacity Slider -->
                <div class="slider-container">
                    <label>Opacity</label>
                    <input type="range" orient="vertical" id="brushOpacity" min="1" max="100" value="100"
                        oninput="setOpacity(this.value)">
                    <span id="opacityVal">100%</span>
                </div>
            </div>

            <!-- CANVAS AREA -->
            <div
                style="flex:1; background:#1e1e1e; display:flex; align-items:center; justify-content:center; overflow:auto; padding:20px;">
                <div id="printableArea"
                    style="position:relative; width:500px; height:500px; background:white; box-shadow:0 0 30px rgba(0,0,0,0.5);">
                    <img id="paintBg" src=""
                        style="position:absolute; width:100%; height:100%; object-fit:contain; pointer-events:none; opacity:0.3;">
                    <canvas id="paintCanvas" width="500" height="500"
                        style="position:absolute; top:0; left:0; cursor:crosshair;"></canvas>
                </div>
            </div>
        </div>

        <style>
            .toolbar-group {
                display: flex;
                gap: 10px;
                align-items: center;
            }

            .tool-icon {
                width: 36px;
                height: 36px;
                display: flex;
                align-items: center;
                justify-content: center;
                border-radius: 5px;
                cursor: pointer;
                font-size: 18px;
                background: #3a3a3a;
                color: white;
                transition: background 0.2s;
            }

            .tool-icon:hover {
                background: #505050;
            }

            .tool-icon.active {
                background: #4C8BF5;
            }

            .quick-color {
                width: 24px;
                height: 24px;
                border-radius: 50%;
                cursor: pointer;
                border: 2px solid #555;
            }

            .quick-color:hover {
                transform: scale(1.2);
                border-color: white;
            }

            #mainColor {
                width: 30px;
                height: 30px;
                border: none;
                background: none;
                cursor: pointer;
                padding: 0;
            }

            .win-btn {
                border: none;
                color: white;
                padding: 8px 16px;
                border-radius: 4px;
                cursor: pointer;
                font-weight: bold;
                display: flex;
                align-items: center;
                gap: 5px;
            }

            .win-btn.print {
                background: #2196F3;
            }

            .win-btn.close {
                background: #d32f2f;
            }

            .win-btn:hover {
                opacity: 0.9;
            }

            .slider-container {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 5px;
                color: #ccc;
                font-size: 12px;
            }

            /* Vertical Range Input Styling */
            input[type=range][orient=vertical] {
                writing-mode: bt-lr;
                /* IE */
                -webkit-appearance: slider-vertical;
                /* WebKit */
                appearance: slider-vertical;
                /* Standard */
                width: 8px;
                height: 120px;
                padding: 0 5px;
            }

            @media print {
                body * {
                    visibility: hidden;
                }

                #printableArea,
                #printableArea * {
                    visibility: visible;
                }

                #printableArea {
                    position: absolute;
                    left: 0;
                    top: 0;
                    width: 100%;
                    height: 100%;
                    border: none;
                    box-shadow: none;
                }

                #paintOverlay {
                    background: white !important;
                    display: block !important;
                }
            }
        </style>
    </div>

    <!-- PAINTER SCRIPT (WINDOWS PAINT STYLE) -->
    <script>
        const canvas = document.getElementById('paintCanvas');
        const ctx = canvas.getContext('2d');
        let painting = false;

        // State
        let currentTool = 'brush'; // brush, marker, pencil, eraser
        let currentColor = '#ff0000';
        let currentSize = 5;
        let currentOpacity = 1.0;

        let history = [];
        let step = -1;

        function openPainter(imgSrc, drawingName) {
            document.getElementById('paintOverlay').style.display = 'flex';
            document.getElementById('paintBg').src = imgSrc;
            document.getElementById('paintTitle').textContent = '🎨 Paint Pro - ' + (drawingName || 'Drawing');

            // Init Canvas
            canvas.width = 500;
            canvas.height = 500;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Reset History
            history = [];
            step = -1;
            saveHistory();

            // Default Settings
            useTool('brush');
            setQuickColor('red');
            setSize(5);
            setOpacity(100);

            // Update UI inputs
            const sizeInput = document.getElementById('brushSize');
            const opacityInput = document.getElementById('brushOpacity');
            if (sizeInput) sizeInput.value = 5;
            if (opacityInput) opacityInput.value = 100;
        }

        function closePainter() {
            document.getElementById('paintOverlay').style.display = 'none';
        }

        function clearCanvas() {
            if (confirm("Are you sure you want to clear the canvas? This cannot be undone.")) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                saveHistory();
            }
        }

        // --- TOOLS & SETTINGS ---
        function useTool(tool) {
            currentTool = tool;
            // Update UI Active State
            const icons = document.querySelectorAll('.tool-icon');
            icons.forEach(el => el.classList.remove('active'));

            let selector = '';
            if (tool === 'brush') selector = 'Brush';
            if (tool === 'marker') selector = 'Marker';
            if (tool === 'pencil') selector = 'Pencil';
            if (tool === 'eraser') selector = 'Eraser';

            const btn = document.querySelector(`.tool-icon[title="${selector}"]`);
            if (btn) btn.classList.add('active');

            updateContext();
        }

        function setQuickColor(colorName) {
            const map = {
                'red': '#ff0000', 'blue': '#0000ff', 'green': '#008000',
                'yellow': '#ffff00', 'black': '#000000', 'white': '#ffffff'
            };
            const hex = map[colorName] || colorName;
            const picker = document.getElementById('mainColor');
            if (picker) picker.value = hex;
            setColor(hex);
        }

        function setColor(hex) {
            currentColor = hex;
            if (currentTool === 'eraser') useTool('brush'); // Switch back to brush if coloring
            updateContext();
        }

        function setSize(val) {
            currentSize = val;
            document.getElementById('sizeVal').textContent = val + 'px';
            updateContext();
        }

        function setOpacity(val) {
            currentOpacity = val / 100;
            document.getElementById('opacityVal').textContent = val + '%';
            updateContext();
        }

        function updateContext() {
            // Logic for different tools
            if (currentTool === 'pencil') {
                ctx.lineWidth = 1; // Always thin
            } else {
                ctx.lineWidth = currentSize;
            }

            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            if (currentTool === 'eraser') {
                ctx.globalCompositeOperation = 'destination-out';
                ctx.globalAlpha = 1.0;
            } else {
                ctx.globalCompositeOperation = 'source-over';
                ctx.strokeStyle = currentColor;

                // Marker effect (translucent)
                if (currentTool === 'marker') {
                    ctx.globalAlpha = currentOpacity * 0.5; // Markers are naturally see-through
                    ctx.lineWidth = currentSize + 5; // Markers are fatter
                } else {
                    ctx.globalAlpha = currentOpacity;
                    ctx.lineWidth = currentTool === 'pencil' ? 1 : currentSize;
                }
            }
        }

        // --- HISTORY (UNDO) ---
        function saveHistory() {
            step++;
            if (step < history.length) { history.length = step; }
            history.push(canvas.toDataURL());
        }

        function undoLast() {
            if (step > 0) {
                step--;
                let canvasPic = new Image();
                canvasPic.src = history[step];
                canvasPic.onload = function () {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);

                    const prevComp = ctx.globalCompositeOperation;
                    const prevAlpha = ctx.globalAlpha;

                    ctx.globalCompositeOperation = 'source-over';
                    ctx.globalAlpha = 1.0;
                    ctx.drawImage(canvasPic, 0, 0);

                    ctx.globalCompositeOperation = prevComp;
                    ctx.globalAlpha = prevAlpha;

                    setTimeout(updateContext, 10);
                }
            }
        }

        function printDrawing() {
            window.print();
        }

        // --- DRAWING LOGIC ---
        function startPosition(e) {
            painting = true;
            draw(e);
        }

        function endPosition() {
            if (painting) {
                painting = false;
                ctx.beginPath();
                saveHistory();
            }
        }

        function draw(e) {
            if (!painting) return;

            const rect = canvas.getBoundingClientRect();
            let clientX = e.clientX || (e.touches ? e.touches[0].clientX : 0);
            let clientY = e.clientY || (e.touches ? e.touches[0].clientY : 0);

            let x = clientX - rect.left;
            let y = clientY - rect.top;

            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            x *= scaleX;
            y *= scaleY;

            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y);
        }

        // Event Listeners
        canvas.addEventListener('mousedown', startPosition);
        canvas.addEventListener('mouseup', endPosition);
        canvas.addEventListener('mousemove', draw);

        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startPosition(e); }, { passive: false });
        canvas.addEventListener('touchend', (e) => { e.preventDefault(); endPosition(); });
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e); }, { passive: false });

    </script>
</body>

</html>
