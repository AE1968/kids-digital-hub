<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Drawings - Kids Digital Hub</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        .gallery-header {
            background: #FF7043;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: white;
            border-bottom: 5px solid #D84315;
        }

        .gallery-grid {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .slot {
            aspect-ratio: 1;
            background: white;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }

        .slot.filled {
            border: 4px solid #FFAB91;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .slot.filled:hover {
            transform: scale(1.05);
        }

        .slot.empty {
            border: 4px dashed #CFD8DC;
            background: #F5F5F5;
        }

        .slot-content {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%) contrast(1.5) brightness(1.1) !important;
            /* FORCED B&W + Outline Effect */
        }

        .slot:hover .slot-content {
            /* No color on hover, stricly coloring book style */
            transform: scale(1.02);
        }

        .empty-label {
            color: #B0BEC5;
            font-weight: bold;
            font-size: 0.9rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .slot-number {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: bold;
            z-index: 2;
        }

        .btn-delete {
            position: absolute;
            top: 5px;
            right: 5px;
            background: #FF5252;
            color: white;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 2;
        }

        .slot.filled:hover .btn-delete {
            opacity: 1;
        }

        .btn-back-dash {
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 15px;
            border-radius: 20px;
            color: white;
            text-decoration: none;
            font-weight: bold;
            border: 2px solid white;
        }
    </style>
</head>

<body>

    <header class="gallery-header">
        <div style="display:flex; align-items:center; gap:10px;">
            <span style="font-size:2rem;">🎨</span>
            <h2 style="margin:0;">My Art Gallery</h2>
        </div>
        <a href="index.html" class="btn-back-dash" data-i18n="btn_back">⬅️ Back</a>
    </header>

    <main>
        <div class="gallery-grid">
            <!-- SLOT 1: FILLED (New AI Generation) -->
            <div class="slot filled">
                <span class="slot-number">1</span>
                <span
                    style="position:absolute; top:10px; right:10px; font-weight:bold; color:#555; background:rgba(255,255,255,0.8); padding:2px 5px; border-radius:5px; z-index:10;">Space
                    Robot</span>
                <img src="assets/images/coloring_robot_space.png" class="slot-content" alt="Space Robot"
                    onclick="openPainter('assets/images/coloring_robot_space.png')" style="cursor: pointer;">
                <button class="btn-delete" title="Delete Drawing">🗑️</button>
            </div>
            <!-- SLOT 2: FILLED (New AI Generation) -->
            <div class="slot filled">
                <span class="slot-number">2</span>
                <span
                    style="position:absolute; top:10px; right:10px; font-weight:bold; color:#555; background:rgba(255,255,255,0.8); padding:2px 5px; border-radius:5px; z-index:10;">Cute
                    Cat</span>
                <img src="assets/images/coloring_cute_cat.png" class="slot-content" alt="Cute Cat"
                    onclick="openPainter('assets/images/coloring_cute_cat.png')" style="cursor: pointer;">
                <button class="btn-delete" title="Delete Drawing">🗑️</button>
            </div>
            <!-- SLOT 3: FILLED (New AI Generation) -->
            <div class="slot filled">
                <span class="slot-number">3</span>
                <span
                    style="position:absolute; top:10px; right:10px; font-weight:bold; color:#555; background:rgba(255,255,255,0.8); padding:2px 5px; border-radius:5px; z-index:10;">Baby
                    Dino</span>
                <img src="assets/images/coloring_dino.png" class="slot-content" alt="Baby Dino"
                    onclick="openPainter('assets/images/coloring_dino.png')" style="cursor: pointer;">
                <button class="btn-delete" title="Delete Drawing">🗑️</button>
            </div>
            <div class="slot empty"><span class="slot-number">4</span>
                <div class="empty-label"><span>➕</span><span>Empty</span></div>
            </div>
            <div class="slot empty"><span class="slot-number">5</span>
                <div class="empty-label"><span>➕</span><span>Empty</span></div>
            </div>
            <div class="slot empty"><span class="slot-number">6</span>
                <div class="empty-label"><span>➕</span><span>Empty</span></div>
            </div>
            <div class="slot empty"><span class="slot-number">7</span>
                <div class="empty-label"><span>➕</span><span>Empty</span></div>
            </div>
            <div class="slot empty"><span class="slot-number">8</span>
                <div class="empty-label"><span>➕</span><span>Empty</span></div>
            </div>
            <div class="slot empty"><span class="slot-number">9</span>
                <div class="empty-label"><span>➕</span><span>Empty</span></div>
            </div>

            <!-- SLOT 10: PREMIUM -->
            <div class="slot empty premium-slot"><span class="slot-number">10</span>
                <div class="empty-label"><span>🔒 Premium</span></div>
            </div>
        </div>
    </main>

    <script src="js/translations.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Language
            const lang = localStorage.getItem('kdh_lang') || 'en';
            changeLanguage(lang);

            // Auth Protection
            auth.applyProtection();

            // Dynamic Stats: Count filled slots and save
            const filledCount = document.querySelectorAll('.slot.filled').length;
            localStorage.setItem('kdh_cnt_drawings', filledCount);

            // Attach Delete Handlers
            document.querySelectorAll('.btn-delete').forEach(btn => {
                btn.addEventListener('click', function () {
                    const confirmMsg = lang === 'ro' ? "Sigur vrei să ștergi acest desen?" : "Are you sure you want to delete this drawing?";
                    if (confirm(confirmMsg)) {
                        const slot = this.parentElement;
                        // Clear slot content visually
                        slot.classList.remove('filled');
                        slot.classList.add('empty');
                        const number = slot.querySelector('.slot-number').textContent;
                        slot.innerHTML = `
                            <span class="slot-number">${number}</span>
                            <div class="empty-label"><span>➕</span><span>Empty</span></div>
                        `;
                    }
                });
            });
        });
    </script>

</body>

</html>
