<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>Picture Puzzle - Kids Digital Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <script data-goatcounter="https://adrian.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 2.5rem;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .game-container {
            max-width: 500px;
            margin: 0 auto;
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat {
            background: rgba(255, 255, 255, 0.2);
            padding: 10px 25px;
            border-radius: 20px;
            color: white;
        }

        .puzzle-selector {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .puzzle-btn {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid white;
            border-radius: 15px;
            color: white;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .puzzle-btn.active {
            background: white;
            color: #f5576c;
        }

        .puzzle-wrapper {
            background: white;
            padding: 20px;
            border-radius: 25px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
        }

        .puzzle-board {
            display: grid;
            gap: 4px;
            width: 100%;
            aspect-ratio: 1;
            background: #ddd;
            border-radius: 10px;
            overflow: hidden;
        }

        .puzzle-piece {
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            cursor: pointer;
            transition: transform 0.1s;
            user-select: none;
        }

        .puzzle-piece:hover:not(.empty) {
            transform: scale(0.95);
            background: #f0f0f0;
        }

        .puzzle-piece.empty {
            background: #ddd;
            cursor: default;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 20px;
            font-family: 'Fredoka', sans-serif;
            font-size: 1rem;
            cursor: pointer;
        }

        .win-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .win-overlay.show {
            display: flex;
        }

        .win-box {
            background: white;
            padding: 50px;
            border-radius: 30px;
            text-align: center;
            animation: popIn 0.5s;
        }

        @keyframes popIn {
            0% {
                transform: scale(0);
            }

            100% {
                transform: scale(1);
            }
        }

        .win-box h2 {
            color: #4CAF50;
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: bold;
        }

        .preview-btn {
            padding: 10px 20px;
            background: #FFD700;
            color: #333;
            border: none;
            border-radius: 15px;
            font-family: 'Fredoka', sans-serif;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <a href="../gallery-games.html" class="back-btn">← Back</a>

    <div class="header">
        <h1>🧩 Picture Puzzle</h1>
        <p>Slide the pieces to complete the picture!</p>
    </div>

    <div class="game-container">
        <div class="stats-bar">
            <div class="stat">🎯 Moves: <span id="moves">0</span></div>
            <div class="stat">⏱️ Time: <span id="timer">0:00</span></div>
        </div>

        <div class="puzzle-selector">
            <button class="puzzle-btn active" onclick="selectPuzzle('animals')">🐱</button>
            <button class="puzzle-btn" onclick="selectPuzzle('space')">🚀</button>
            <button class="puzzle-btn" onclick="selectPuzzle('food')">🍕</button>
            <button class="puzzle-btn" onclick="selectPuzzle('nature')">🌸</button>
        </div>

        <div class="puzzle-wrapper">
            <div class="puzzle-board" id="puzzleBoard"></div>
        </div>

        <div class="controls">
            <button class="preview-btn" onmousedown="showPreview()" onmouseup="hidePreview()"
                ontouchstart="showPreview()" ontouchend="hidePreview()">👁️ Peek</button>
            <button class="btn" onclick="shufflePuzzle()">🔀 Shuffle</button>
            <button class="btn" onclick="newGame()">🔄 New Game</button>
        </div>
    </div>

    <div class="win-overlay" id="winOverlay">
        <div class="win-box">
            <h2>🎉 Puzzle Complete!</h2>
            <p style="margin-bottom: 20px;">You did it in <span id="finalMoves">0</span> moves!</p>
            <p style="margin-bottom: 30px;">Time: <span id="finalTime">0:00</span></p>
            <button class="btn" onclick="newGame(); hideWin();">🧩 Play Again</button>
            <br><br>
            <a href="../gallery-games.html" class="btn">🎮 More Games</a>
        </div>
    </div>

    <script>
        const puzzles = {
            animals: ['🐱', '🐶', '🐰', '🐻', '🦊', '🐼', '🐨', '🐷'],
            space: ['🚀', '🌟', '🌙', '🛸', '🪐', '☀️', '🌎', '👨‍🚀'],
            food: ['🍕', '🍔', '🍟', '🌮', '🍩', '🍦', '🍪', '🧁'],
            nature: ['🌸', '🌺', '🌻', '🌷', '🌹', '🍀', '🌈', '🦋']
        };

        let currentPuzzle = 'animals';
        let gridSize = 3;
        let tiles = [];
        let emptyPos = 8;
        let moves = 0;
        let seconds = 0;
        let timerInterval = null;
        let gameStarted = false;

        function selectPuzzle(type) {
            currentPuzzle = type;
            document.querySelectorAll('.puzzle-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            newGame();
        }

        function createPuzzle() {
            const emojis = puzzles[currentPuzzle];
            tiles = [...emojis, null]; // 8 emojis + 1 empty
            emptyPos = 8;
            renderBoard();
        }

        function renderBoard() {
            const board = document.getElementById('puzzleBoard');
            board.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;
            board.innerHTML = '';

            tiles.forEach((emoji, index) => {
                const piece = document.createElement('div');
                piece.className = 'puzzle-piece' + (emoji === null ? ' empty' : '');
                piece.textContent = emoji || '';
                piece.dataset.index = index;
                if (emoji !== null) {
                    piece.onclick = () => moveTile(index);
                }
                board.appendChild(piece);
            });
        }

        function moveTile(index) {
            if (!canMove(index)) return;

            if (!gameStarted) {
                gameStarted = true;
                startTimer();
            }

            // Swap tiles
            tiles[emptyPos] = tiles[index];
            tiles[index] = null;
            emptyPos = index;
            moves++;
            document.getElementById('moves').textContent = moves;

            renderBoard();
            checkWin();
        }

        function canMove(index) {
            const row = Math.floor(index / gridSize);
            const col = index % gridSize;
            const emptyRow = Math.floor(emptyPos / gridSize);
            const emptyCol = emptyPos % gridSize;

            return (Math.abs(row - emptyRow) + Math.abs(col - emptyCol)) === 1;
        }

        function shufflePuzzle() {
            // Do 100 random valid moves
            for (let i = 0; i < 100; i++) {
                const validMoves = [];
                for (let j = 0; j < 9; j++) {
                    if (canMove(j)) validMoves.push(j);
                }
                const randomMove = validMoves[Math.floor(Math.random() * validMoves.length)];
                tiles[emptyPos] = tiles[randomMove];
                tiles[randomMove] = null;
                emptyPos = randomMove;
            }
            renderBoard();
        }

        function checkWin() {
            const solved = puzzles[currentPuzzle].every((emoji, i) => tiles[i] === emoji);
            if (solved && tiles[8] === null) {
                clearInterval(timerInterval);
                document.getElementById('finalMoves').textContent = moves;
                document.getElementById('finalTime').textContent = document.getElementById('timer').textContent;
                document.getElementById('winOverlay').classList.add('show');

                // Award achievement
                if (window.KDH_Achievements) {
                    KDH_Achievements.addProgress('puzzles');
                }
            }
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                seconds++;
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                document.getElementById('timer').textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
            }, 1000);
        }

        function newGame() {
            clearInterval(timerInterval);
            moves = 0;
            seconds = 0;
            gameStarted = false;
            document.getElementById('moves').textContent = '0';
            document.getElementById('timer').textContent = '0:00';
            createPuzzle();
            shufflePuzzle();
        }

        function hideWin() {
            document.getElementById('winOverlay').classList.remove('show');
        }

        function showPreview() {
            const board = document.getElementById('puzzleBoard');
            const emojis = puzzles[currentPuzzle];
            board.innerHTML = emojis.map(e => `<div class="puzzle-piece">${e}</div>`).join('') +
                '<div class="puzzle-piece empty"></div>';
        }

        function hidePreview() {
            renderBoard();
        }

        // Initialize
        newGame();
    </script>
</body>

</html>
