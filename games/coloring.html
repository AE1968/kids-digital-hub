<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>Magic Coloring - Kids Digital Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <script data-goatcounter="https://adrian.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .game-header {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        .game-header h1 {
            font-size: 2.5rem;
            color: #667eea;
        }

        .canvas-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .canvas-wrapper {
            background: white;
            padding: 20px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
        }

        #drawingCanvas {
            display: block;
            border-radius: 15px;
            cursor: crosshair;
            touch-action: none;
        }

        .tools {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .color-palette {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .color-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 4px solid white;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s;
        }

        .color-btn:hover {
            transform: scale(1.1);
        }

        .color-btn.active {
            border-color: #333;
            transform: scale(1.15);
        }

        .tool-section {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .brush-sizes {
            display: flex;
            gap: 10px;
        }

        .size-btn {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            border: 2px solid #ddd;
            background: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .size-btn.active {
            border-color: #667eea;
            background: #f0f0fe;
        }

        .size-btn span {
            background: #333;
            border-radius: 50%;
        }

        .action-btn {
            padding: 12px 25px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 20px;
            font-family: 'Fredoka', sans-serif;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .action-btn:hover {
            transform: translateY(-2px);
        }

        .action-btn.danger {
            background: linear-gradient(135deg, #f44336, #e91e63);
        }

        .action-btn.success {
            background: linear-gradient(135deg, #4CAF50, #8BC34A);
        }

        .templates {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 20px;
        }

        .template-btn {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.8);
            border: 2px solid #ddd;
            border-radius: 15px;
            cursor: pointer;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.5rem;
            transition: all 0.2s;
        }

        .template-btn:hover {
            border-color: #667eea;
            transform: scale(1.05);
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.9);
            color: #667eea;
            padding: 10px 20px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .eraser-indicator {
            display: none;
            padding: 5px 15px;
            background: #FF9800;
            color: white;
            border-radius: 15px;
            font-size: 0.9rem;
        }

        .eraser-indicator.show {
            display: block;
        }
    </style>
</head>

<body>
    <a href="../gallery-drawings.html" class="back-btn">← Back</a>

    <div class="game-header">
        <h1>🎨 Magic Coloring!</h1>
        <p>Pick a color and start drawing!</p>
    </div>

    <div class="canvas-container">
        <div class="canvas-wrapper">
            <canvas id="drawingCanvas" width="400" height="400"></canvas>
        </div>

        <div class="tools">
            <div class="color-palette">
                <button class="color-btn active" style="background: #f44336" data-color="#f44336"></button>
                <button class="color-btn" style="background: #FF9800" data-color="#FF9800"></button>
                <button class="color-btn" style="background: #FFEB3B" data-color="#FFEB3B"></button>
                <button class="color-btn" style="background: #4CAF50" data-color="#4CAF50"></button>
                <button class="color-btn" style="background: #2196F3" data-color="#2196F3"></button>
                <button class="color-btn" style="background: #9C27B0" data-color="#9C27B0"></button>
                <button class="color-btn" style="background: #E91E63" data-color="#E91E63"></button>
                <button class="color-btn" style="background: #795548" data-color="#795548"></button>
                <button class="color-btn" style="background: #000000" data-color="#000000"></button>
                <button class="color-btn" style="background: #ffffff; border-color: #ddd;"
                    data-color="#ffffff"></button>
            </div>

            <div class="tool-section">
                <span>Size:</span>
                <div class="brush-sizes">
                    <button class="size-btn" data-size="5"><span style="width:8px;height:8px"></span></button>
                    <button class="size-btn active" data-size="15"><span style="width:15px;height:15px"></span></button>
                    <button class="size-btn" data-size="30"><span style="width:22px;height:22px"></span></button>
                </div>
            </div>

            <button class="action-btn" onclick="toggleEraser()">🧹 Eraser</button>
            <span class="eraser-indicator" id="eraserIndicator">Eraser ON</span>
            <button class="action-btn danger" onclick="clearCanvas()">🗑️ Clear</button>
            <button class="action-btn success" onclick="saveDrawing()">💾 Save</button>
        </div>

        <div class="templates">
            <button class="template-btn" onclick="drawTemplate('star')">⭐</button>
            <button class="template-btn" onclick="drawTemplate('heart')">❤️</button>
            <button class="template-btn" onclick="drawTemplate('flower')">🌸</button>
            <button class="template-btn" onclick="drawTemplate('sun')">☀️</button>
            <button class="template-btn" onclick="drawTemplate('house')">🏠</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('drawingCanvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;
        let currentColor = '#f44336';
        let brushSize = 15;
        let isEraser = false;
        let lastX = 0;
        let lastY = 0;

        // Set white background
        ctx.fillStyle = 'white';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Mouse events
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseout', stopDrawing);

        // Touch events
        canvas.addEventListener('touchstart', handleTouch);
        canvas.addEventListener('touchmove', handleTouchMove);
        canvas.addEventListener('touchend', stopDrawing);

        function startDrawing(e) {
            isDrawing = true;
            [lastX, lastY] = getPosition(e);
        }

        function draw(e) {
            if (!isDrawing) return;

            const [x, y] = getPosition(e);

            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(x, y);
            ctx.strokeStyle = isEraser ? 'white' : currentColor;
            ctx.lineWidth = brushSize;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();

            [lastX, lastY] = [x, y];
        }

        function stopDrawing() {
            isDrawing = false;
        }

        function handleTouch(e) {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            lastX = touch.clientX - rect.left;
            lastY = touch.clientY - rect.top;
            isDrawing = true;
        }

        function handleTouchMove(e) {
            e.preventDefault();
            if (!isDrawing) return;
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;

            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(x, y);
            ctx.strokeStyle = isEraser ? 'white' : currentColor;
            ctx.lineWidth = brushSize;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();

            [lastX, lastY] = [x, y];
        }

        function getPosition(e) {
            const rect = canvas.getBoundingClientRect();
            return [e.clientX - rect.left, e.clientY - rect.top];
        }

        // Color buttons
        document.querySelectorAll('.color-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentColor = btn.dataset.color;
                isEraser = false;
                document.getElementById('eraserIndicator').classList.remove('show');
            });
        });

        // Size buttons
        document.querySelectorAll('.size-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                brushSize = parseInt(btn.dataset.size);
            });
        });

        function toggleEraser() {
            isEraser = !isEraser;
            document.getElementById('eraserIndicator').classList.toggle('show', isEraser);
        }

        function clearCanvas() {
            if (confirm('Clear your drawing?')) {
                ctx.fillStyle = 'white';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
        }

        function saveDrawing() {
            const link = document.createElement('a');
            link.download = 'my-drawing.png';
            link.href = canvas.toDataURL();
            link.click();
            alert('🎨 Drawing saved! Check your downloads.');
        }

        function drawTemplate(type) {
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 3;
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            switch (type) {
                case 'star':
                    drawStar(cx, cy, 5, 80, 40);
                    break;
                case 'heart':
                    drawHeart(cx, cy, 100);
                    break;
                case 'flower':
                    drawFlower(cx, cy, 60);
                    break;
                case 'sun':
                    drawSun(cx, cy, 60);
                    break;
                case 'house':
                    drawHouse(cx, cy);
                    break;
            }
        }

        function drawStar(cx, cy, spikes, outerRadius, innerRadius) {
            ctx.beginPath();
            let rot = Math.PI / 2 * 3;
            let step = Math.PI / spikes;
            ctx.moveTo(cx, cy - outerRadius);
            for (let i = 0; i < spikes; i++) {
                let x = cx + Math.cos(rot) * outerRadius;
                let y = cy + Math.sin(rot) * outerRadius;
                ctx.lineTo(x, y);
                rot += step;
                x = cx + Math.cos(rot) * innerRadius;
                y = cy + Math.sin(rot) * innerRadius;
                ctx.lineTo(x, y);
                rot += step;
            }
            ctx.closePath();
            ctx.stroke();
        }

        function drawHeart(cx, cy, size) {
            ctx.beginPath();
            const x = cx - size / 2;
            const y = cy - size / 4;
            ctx.moveTo(x, y + size / 4);
            ctx.quadraticCurveTo(x, y, x + size / 4, y);
            ctx.quadraticCurveTo(x + size / 2, y, x + size / 2, y + size / 4);
            ctx.quadraticCurveTo(x + size / 2, y, x + size * 3 / 4, y);
            ctx.quadraticCurveTo(x + size, y, x + size, y + size / 4);
            ctx.quadraticCurveTo(x + size, y + size / 2, x + size / 2, y + size);
            ctx.quadraticCurveTo(x, y + size / 2, x, y + size / 4);
            ctx.stroke();
        }

        function drawFlower(cx, cy, size) {
            for (let i = 0; i < 6; i++) {
                const angle = (i * Math.PI * 2) / 6;
                const x = cx + Math.cos(angle) * size;
                const y = cy + Math.sin(angle) * size;
                ctx.beginPath();
                ctx.arc(x, y, size / 2, 0, Math.PI * 2);
                ctx.stroke();
            }
            ctx.beginPath();
            ctx.arc(cx, cy, size / 2, 0, Math.PI * 2);
            ctx.stroke();
        }

        function drawSun(cx, cy, size) {
            ctx.beginPath();
            ctx.arc(cx, cy, size, 0, Math.PI * 2);
            ctx.stroke();
            for (let i = 0; i < 12; i++) {
                const angle = (i * Math.PI * 2) / 12;
                const x1 = cx + Math.cos(angle) * (size + 10);
                const y1 = cy + Math.sin(angle) * (size + 10);
                const x2 = cx + Math.cos(angle) * (size + 30);
                const y2 = cy + Math.sin(angle) * (size + 30);
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();
            }
        }

        function drawHouse(cx, cy) {
            // Main body
            ctx.strokeRect(cx - 60, cy - 20, 120, 100);
            // Roof
            ctx.beginPath();
            ctx.moveTo(cx - 70, cy - 20);
            ctx.lineTo(cx, cy - 80);
            ctx.lineTo(cx + 70, cy - 20);
            ctx.closePath();
            ctx.stroke();
            // Door
            ctx.strokeRect(cx - 20, cy + 30, 40, 50);
            // Window
            ctx.strokeRect(cx + 30, cy, 30, 30);
            ctx.moveTo(cx + 45, cy);
            ctx.lineTo(cx + 45, cy + 30);
            ctx.moveTo(cx + 30, cy + 15);
            ctx.lineTo(cx + 60, cy + 15);
            ctx.stroke();
        }
    </script>
</body>

</html>
