<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kids Digital Hub - Promo</title>
    <!-- Prevent translation of code blocks if they accidentally leak -->
    <meta name="google" content="notranslate">
    <style>
        /* Reset and Base */
        * {
            box-sizing: border-box;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: sans-serif;
            background: #000;
        }

        /* Background Image */
        .bg-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('assets/images/parent_chaos.png');
            background-size: cover;
            background-position: center;
            opacity: 0.5;
            z-index: 1;
        }

        /* Main Container */
        .main-container {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Video Player Frame */
        .video-box {
            width: 90%;
            max-width: 400px;
            /* Portait/TikTok feel */
            aspect-ratio: 9/16;
            /* TikTok vertical ratio preference, or 16/9 if video is landscape */
            /* Since our video is landscape 16:9, let's use that */
            max-width: 800px;
            aspect-ratio: 16/9;

            background: #000;
            border: 4px solid #00FFFF;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.6);
            border-radius: 15px;
            overflow: hidden;
            position: relative;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Controls / CTA */
        .controls-area {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .download-btn {
            background: #FF00E6;
            color: #fff;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 0 20px rgba(255, 0, 230, 0.6);
            transition: transform 0.2s;
            text-transform: uppercase;
        }

        .download-btn:hover {
            transform: scale(1.1);
        }

        .back-link {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 20;
        }

        .back-link img {
            width: 60px;
            height: auto;
            filter: drop-shadow(0 0 5px #fff);
        }
    </style>
</head>

<body>

    <!-- Background -->
    <div class="bg-layer"></div>

    <!-- Navigation -->
    <a href="index.html" class="back-link">
        <img src="assets/images/logo_ae.png" alt="Home">
    </a>

    <!-- Main Content -->
    <div class="main-container">

        <div class="video-box">
            <!-- Video linked to the new file -->
            <video id="promoVideo" controls autoplay muted loop playsinline>
                <source src="assets/videos/promo_final_15s.mp4" type="video/mp4">
                Your browser does not support HTML5 video.
            </video>
        </div>

        <div class="controls-area">
            <h2 style="color:white; text-shadow:0 0 5px cyan; margin:0;">KIDS DIGITAL HUB PROMO</h2>
            <a href="assets/videos/promo_final_15s.mp4" download="KDH_Promo_15s.mp4" class="download-btn">
                ⬇️ DOWNLOAD VIDEO
            </a>
            <p style="color:#ccc; font-size:0.9rem;">Perfect for TikTok / Instagram</p>
        </div>

    </div>

</body>

</html>
