<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promo Video Generator Kids Hub (PRO)</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #222;
            margin: 0;
            font-family: 'Fredoka', sans-serif;
            flex-direction: column;
            gap: 20px;
        }

        #phone-frame {
            width: 360px;
            /* Mobile width */
            height: 640px;
            /* Mobile height */
            background: black;
            border: 10px solid #111;
            border-radius: 30px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(255, 255, 255, 0.1);
        }

        /* Common Scene Styles */
        .scene {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.5s ease;
            background: black;
        }

        .active {
            opacity: 1;
            z-index: 10;
        }

        .promo-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            animation: zoomEffect 4s infinite alternate;
        }

        @keyframes zoomEffect {
            from {
                transform: scale(1);
            }

            to {
                transform: scale(1.1);
            }
        }

        #controls {
            color: white;
            text-align: center;
        }

        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            cursor: pointer;
            background: #D500F9;
            /* Neon Purple */
            border: none;
            color: white;
            border-radius: 10px;
            font-weight: bold;
            box-shadow: 0 0 15px #D500F9;
        }

        button:hover {
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <div id="controls">
        <h1>🎬 Kids Hub Video Player</h1>
        <p>Apasă START și înregistrează ecranul!</p>
        <button onclick="startAd()">🌟 PLAY VIDEO</button>
    </div>

    <div id="phone-frame">
        <!-- SCENE 1 -->
        <div id="scene-1" class="scene active">
            <img src="assets/images/promo/scena1.png" class="promo-img" alt="Bored">
        </div>

        <!-- SCENE 2 -->
        <div id="scene-2" class="scene">
            <img src="assets/images/promo/scena2.png" class="promo-img" alt="Solution">
        </div>

        <!-- SCENE 3 -->
        <div id="scene-3" class="scene">
            <img src="assets/images/promo/scena3.png" class="promo-img" alt="Final">
        </div>
    </div>

    <script>
        function startAd() {
            // Reset state
            const s1 = document.getElementById('scene-1');
            const s2 = document.getElementById('scene-2');
            const s3 = document.getElementById('scene-3');

            s1.classList.remove('active');
            s2.classList.remove('active');
            s3.classList.remove('active');

            document.getElementById('controls').style.display = 'none';

            // Start Sequence
            // Force reflow
            void s1.offsetWidth;
            s1.classList.add('active');

            // 3s: S2
            setTimeout(() => {
                s1.classList.remove('active');
                s2.classList.add('active');
            }, 3000);

            // 6.5s: S3
            setTimeout(() => {
                s2.classList.remove('active');
                s3.classList.add('active');
            }, 6500);

            // 10s: End
            setTimeout(() => {
                document.getElementById('controls').style.display = 'block';
                // Reset to scene 3 or 1
            }, 10500);
        }
    </script>
</body>

</html>
