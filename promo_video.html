<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Promo Kids Hub - Auto Start</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            font-family: 'Orbitron', sans-serif;
            /* Font Cyberpunk */
        }

        #promoCanvas {
            display: block;
            margin: 0 auto;
            /* Fullscreen vertical mobile friendly */
            height: 100vh;
            max-width: 100%;
            background: #000;
        }

        /* Overlay pentru interacțiune inițială */
        #overlay,
        #outro-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.8);
            z-index: 10;
            color: white;
            text-align: center;
        }

        /* Ascundem overlay-ul la start, il afisam doar daca autoplay esueaza */
        #overlay {
            display: none;
        }

        .tap-text {
            font-size: 2rem;
            animation: pulse 1s infinite alternate;
            cursor: pointer;
        }

        /* Outro button */
        .cta-btn {
            padding: 20px 40px;
            font-size: 2rem;
            background: #FF00E6;
            /* Neon Pink */
            color: white;
            border: 4px solid #00FFFF;
            /* Neon Cyan */
            border-radius: 50px;
            text-decoration: none;
            font-family: inherit;
            font-weight: bold;
            box-shadow: 0 0 20px #FF00E6;
            cursor: pointer;
            margin-top: 20px;
            animation: shake 3s infinite;
        }

        /* Social Share Bar */
        .social-bar {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 15px;
            z-index: 20;
        }

        .social-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: white;
            text-decoration: none;
            transition: transform 0.2s;
            cursor: pointer;
            border: 2px solid white;
        }

        .social-btn:hover {
            transform: scale(1.1);
        }

        .whatsapp {
            background: #25D366;
        }

        .facebook {
            background: #1877F2;
        }

        .tiktok {
            background: #000000;
            border-color: #FE2C55;
        }

        .copy {
            background: #555;
        }

        @keyframes pulse {
            from {
                opacity: 0.5;
                transform: scale(0.9);
            }

            to {
                opacity: 1;
                transform: scale(1.1);
            }
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            10%,
            30%,
            50%,
            70%,
            90% {
                transform: translateX(-5px);
            }

            20%,
            40%,
            60%,
            80% {
                transform: translateX(5px);
            }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
</head>

<body>

    <canvas id="promoCanvas"></canvas>

    <!-- Fallback overlay for Audio Context if Autoplay fails -->
    <div id="overlay" onclick="startAd()">
        <div class="tap-text">🔊 TAP ANYWHERE TO START 🔊</div>
    </div>

    <!-- Outro Overlay -->
    <div id="outro-overlay" style="display: none;">
        <h1 style="color: #00FFFF; text-shadow: 0 0 10px #00FFFF;">REDIRECTING...</h1>
        <p id="countdown" style="font-size: 1.5rem;">5</p>
        <a href="https://AE1968.github.io/kids-digital-hub/" class="cta-btn">👉 TAP / CLICK HERE! 👈</a>

        <!-- Social Share Buttons for Viral Marketing -->
        <div class="social-bar">
            <a href="#" class="social-btn whatsapp" onclick="shareSocial('whatsapp')">📱</a>
            <a href="#" class="social-btn facebook" onclick="shareSocial('facebook')">📘</a>
            <!-- TikTok/Instagram just copy link because they don't support direct web share -->
            <a href="#" class="social-btn tiktok" onclick="shareSocial('tiktok')">🎵</a>
            <a href="#" class="social-btn copy" onclick="shareSocial('copy')">📋</a>
        </div>
    </div>

    <button id="startBtn" style="display:none;">Start</button>

    <script>
        const canvas = document.getElementById('promoCanvas');
        const ctx = canvas.getContext('2d');

        // Set Vertical Resolution (Mobile First - 9:16 aspect ratio roughly)
        canvas.width = 1080;
        canvas.height = 1920;

        let startTime = null;
        let images = {};
        const ASSETS = {
            // Using placeholders or generating text-based graphics since we don't have files yet
            // We will draw everything with Canvas API for maximum control and "Glitch" effect
        };

        // Audio Context
        let audioCtx;
        let isPlaying = false;

        const TARGET_URL = "https://AE1968.github.io/kids-digital-hub/";

        // --- SCENE DEFINITIONS ---
        // Scene 1: Hook (0-5s) - "BORED KIDS?" (Glitch effect)
        // Scene 2: Problem (5-10s) - "ALWAYS ON SCREENS?" (Dark visuals)
        // Scene 3: Solution (10-15s) - "KIDS DIGITAL HUB!" (Neon explosion) - Robot helper
        // Scene 4: Outro (15-20s) - "JOIN NOW!" (Call to Action + Link)

        function startAd() {
            if (isPlaying) return;

            // Init Audio
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            isPlaying = true;
            document.getElementById('overlay').style.display = 'none';

            // Resize canvas to fit screen (css does it, but internal resolution remains high)

            requestAnimationFrame(loop);

            // Start Music
            playCyberpunkMusic();
        }

        function loop(timestamp) {
            if (!startTime) startTime = timestamp;
            const progress = (timestamp - startTime) / 1000; // seconds

            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (progress < 5) {
                scene1_Hook(progress);
            } else if (progress < 10) {
                scene2_Problem(progress);
            } else if (progress < 15) {
                scene3_Solution(progress);
            } else if (progress < 20) {
                scene4_Outro(progress);
            } else {
                endAd();
                return;
            }

            // Global scanline effect
            drawScanlines(progress);

            requestAnimationFrame(loop);
        }

        // --- SCENES ---

        function scene1_Hook(t) {
            // Text: BORED?
            ctx.textAlign = 'center';
            ctx.font = 'bold 150px Orbitron';

            // Glitch text position
            let offsetX = (Math.random() - 0.5) * 20;
            let offsetY = (Math.random() - 0.5) * 20;
            if (Math.random() > 0.9) offsetX += 50; // Big glitch

            ctx.fillStyle = '#FF0055'; // Neon Red
            ctx.fillText('ARE YOUR', canvas.width / 2 + offsetX, canvas.height / 3 + offsetY);

            ctx.fillStyle = '#00FFFF'; // Neon Cyan overlay
            ctx.fillText('ARE YOUR', canvas.width / 2 - offsetX, canvas.height / 3 - offsetY);

            ctx.fillStyle = '#FFFFFF';
            ctx.fillText('ARE YOUR', canvas.width / 2, canvas.height / 3);

            ctx.font = 'bold 200px Orbitron';
            ctx.fillStyle = '#FFFF00';
            ctx.fillText('KIDS', canvas.width / 2, canvas.height / 2);
            ctx.fillText('BORED?', canvas.width / 2, canvas.height / 2 + 200);
        }

        function scene2_Problem(t) { // 5s to 10s
            const localT = t - 5;

            ctx.textAlign = 'center';
            ctx.font = 'bold 120px Orbitron';

            // Flashing background
            if (Math.floor(localT * 4) % 2 === 0) {
                ctx.fillStyle = '#110000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            ctx.fillStyle = '#FF0000';
            ctx.fillText('NEED A', canvas.width / 2, canvas.height / 2 - 100);

            // Shake effect
            let shake = Math.sin(localT * 20) * 10;
            ctx.font = 'bold 180px Orbitron';
            ctx.fillStyle = '#FFFFFF';
            ctx.fillText('PARENT', canvas.width / 2 + shake, canvas.height / 2 + 100);
            ctx.fillText('BREAK?', canvas.width / 2 - shake, canvas.height / 2 + 300);
        }

        function scene3_Solution(t) { // 10s to 15s
            const localT = t - 10;

            // Robot visual (Generic shape using canvas)
            drawRobot(canvas.width / 2, canvas.height / 2 - 200, localT);

            ctx.textAlign = 'center';
            ctx.font = 'bold 100px Orbitron';
            ctx.fillStyle = '#00FF00'; // Matrix Green
            ctx.fillText('SOLUTION:', canvas.width / 2, canvas.height / 2 + 300);

            ctx.font = 'bold 140px Orbitron';
            ctx.fillStyle = '#FFFFFF';
            ctx.shadowColor = '#00FFFF';
            ctx.shadowBlur = 20;
            ctx.fillText('KIDS DIGITAL', canvas.width / 2, canvas.height / 2 + 450);
            ctx.fillText('HUB', canvas.width / 2, canvas.height / 2 + 600);
            ctx.shadowBlur = 0;
        }

        function scene4_Outro(t) { // 15s to 20s
            const localT = t - 15;

            ctx.textAlign = 'center';

            // Scrolling Text Background
            ctx.globalAlpha = 0.2;
            ctx.font = 'italic 80px Orbitron';
            ctx.fillStyle = '#FFFFFF';
            // Slow scroll vertically
            let scrollY = (localT * 100) % canvas.height;
            for (let i = 0; i < canvas.height; i += 100) {
                ctx.fillText('WWW.KIDSDIGITALHUB.COM', canvas.width / 2, i + scrollY - canvas.height);
                ctx.fillText('WWW.KIDSDIGITALHUB.COM', canvas.width / 2, i + scrollY);
            }
            ctx.globalAlpha = 1.0;

            // Main Text
            ctx.font = 'bold 150px Orbitron';
            ctx.fillStyle = '#FF00E6';
            let scale = 1 + Math.sin(localT * 5) * 0.1;

            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.scale(scale, scale);
            ctx.fillText('JOIN', 0, -100);
            ctx.fillText('NOW!', 0, 100);
            ctx.restore();
        }

        // --- HELPER GRAPHICS ---
        function drawRobot(x, y, t) {
            ctx.save();
            ctx.translate(x, y);

            // Floating animation
            ctx.translate(0, Math.sin(t * 2) * 20);

            // Head
            ctx.fillStyle = '#333';
            ctx.beginPath();
            ctx.roundRect(-150, -150, 300, 300, 20);
            ctx.fill();

            // Eyes (Blinking)
            ctx.fillStyle = '#00FFFF';
            if (Math.sin(t * 10) > 0.95) { // Blink
                ctx.fillRect(-100, -50, 200, 10);
            } else {
                ctx.beginPath();
                ctx.arc(-70, -50, 40, 0, Math.PI * 2);
                ctx.arc(70, -50, 40, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowColor = '#00FFFF';
                ctx.shadowBlur = 30;
                ctx.fill(); // Glow
                ctx.shadowBlur = 0;
            }

            // Antenna
            ctx.beginPath();
            ctx.moveTo(0, -150);
            ctx.lineTo(0, -250);
            ctx.strokeStyle = '#888';
            ctx.lineWidth = 10;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(0, -250, 20, 0, Math.PI * 2);
            ctx.fillStyle = 'red';
            ctx.fill();

            // Mouth
            ctx.fillStyle = '#222';
            ctx.fillRect(-80, 50, 160, 20);
            // Equalizer mouth
            ctx.fillStyle = '#00FF00';
            for (let i = 0; i < 5; i++) {
                let h = Math.random() * 40;
                ctx.fillRect(-70 + i * 30, 70 - h, 20, h);
            }

            ctx.restore();
        }

        function drawScanlines(t) {
            ctx.fillStyle = "rgba(0,0,0,0.1)";
            for (let i = 0; i < canvas.height; i += 10) {
                ctx.fillRect(0, i, canvas.width, 2);
            }
            // Moving bar
            let y = (t * 500) % canvas.height;
            ctx.fillStyle = "rgba(0, 255, 255, 0.05)";
            ctx.fillRect(0, y, canvas.width, 50);
        }

        // --- AUDIO GENERATION (Synth) ---
        function playCyberpunkMusic() {
            // Bass line
            const bassOsc = audioCtx.createOscillator();
            const bassGain = audioCtx.createGain();
            bassOsc.type = 'sawtooth';
            bassOsc.frequency.setValueAtTime(55, audioCtx.currentTime); // A1

            // Bass filter for "wub wub"
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(200, audioCtx.currentTime);
            filter.frequency.linearRampToValueAtTime(800, audioCtx.currentTime + 0.5); // Wah
            filter.frequency.linearRampToValueAtTime(200, audioCtx.currentTime + 1.0);

            bassOsc.connect(filter);
            filter.connect(bassGain);
            bassGain.connect(audioCtx.destination);

            bassOsc.start();
            bassGain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            bassOsc.stop(audioCtx.currentTime + 20); // Play for 20s

            // Melody (Arpeggio)
            setInterval(() => {
                if (audioCtx.state === 'running') playNote();
            }, 250); // 4 times a second
        }

        function playNote() {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';

            // Cyberpunk scale (Minor pentatonicish)
            const freqs = [220, 261.63, 329.63, 392, 440, 523.25];
            const freq = freqs[Math.floor(Math.random() * freqs.length)];

            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        }

        function endAd() {
            isPlaying = false;
            document.getElementById('outro-overlay').style.display = 'flex';

            // Countdown redirect
            let count = 5;
            const counter = document.getElementById('countdown');
            const timer = setInterval(() => {
                count--;
                counter.innerText = count;
                if (count <= 0) {
                    clearInterval(timer);
                    window.location.href = TARGET_URL;
                }
            }, 1000);
        }

        function shareSocial(platform) {
            const url = "https://kidsdigitalhub.com";
            const text = "Check out this awesome Kids Digital Hub! 🤖🎨 #kids #fun";

            if (platform === 'whatsapp') {
                window.location.href = `https://wa.me/?text=${encodeURIComponent(text + " " + url)}`;
            } else if (platform === 'facebook') {
                window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}`, '_blank');
            } else if (platform === 'twitter') {
                window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(url)}`, '_blank');
            } else if (platform === 'copy' || platform === 'tiktok') {
                navigator.clipboard.writeText(url).then(() => {
                    alert("Link COPIED! 📋\nNow open TikTok/Instagram and paste it in your story/bio! 🚀");
                    if (platform === 'tiktok') window.location.href = "https://www.tiktok.com"; // Open TikTok web
                });
            }
        }

        // Auto-start attempt
        window.onload = () => {
            setTimeout(() => {
                // Try autoplay
                startAd();
                // If audio context stays suspended (browser block), show overlay
                if (audioCtx && audioCtx.state === 'suspended') {
                    document.getElementById('overlay').style.display = 'flex';
                }
            }, 500);
        };

        // Fallback click anywhere to start (if blocked)
        document.body.addEventListener('click', () => {
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            if (!isPlaying) startAd();
        });

    </script>
</body>

</html>
