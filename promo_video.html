<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Promo Kids Hub - Auto Start</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            background-image: url('assets/images/parent_chaos.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            overflow: hidden;
            font-family: 'Orbitron', sans-serif;
            height: 100vh;
            width: 100vw;
        }

        #video-container {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 350px;
            height: 350px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            border: 5px solid #fff;
            border-radius: 20px;
            overflow: hidden;
            background: #000;
            z-index: 100;
        }

        @media (max-width: 768px) {
            #video-container {
                width: 200px;
                height: 200px;
                bottom: 10px;
                left: 10px;
            }

            .tap-text {
                font-size: 1rem !important;
            }

            .cta-btn {
                padding: 10px 20px !important;
                font-size: 1rem !important;
                margin: 10px 0 !important;
            }
        }

        #promoCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        #overlay,
        #outro-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.8);
            z-index: 10;
            color: white;
            text-align: center;
        }

        #overlay {
            display: flex;
            cursor: pointer;
        }

        .tap-text {
            font-size: 1.5rem;
            animation: pulse 1s infinite alternate;
        }

        .cta-btn {
            padding: 15px 30px;
            font-size: 1.2rem;
            background: #FF00E6;
            color: white;
            border: 3px solid #00FFFF;
            border-radius: 50px;
            text-decoration: none;
            font-family: inherit;
            font-weight: bold;
            box-shadow: 0 0 20px #FF00E6;
            cursor: pointer;
            margin-top: 10px;
            margin-bottom: 20px;
            animation: shake 3s infinite;
        }

        .social-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            z-index: 20;
        }

        .social-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: white;
            text-decoration: none;
            transition: transform 0.2s;
            cursor: pointer;
            border: 2px solid white;
        }

        .social-btn:hover {
            transform: scale(1.1);
        }

        .whatsapp {
            background: #25D366;
        }

        .facebook {
            background: #1877F2;
        }

        .tiktok {
            background: #000000;
            border-color: #FE2C55;
        }

        @keyframes pulse {
            from {
                opacity: 0.5;
                transform: scale(0.9);
            }

            to {
                opacity: 1;
                transform: scale(1.1);
            }
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            10%,
            30%,
            50%,
            70%,
            90% {
                transform: translateX(-5px);
            }

            20%,
            40%,
            60%,
            80% {
                transform: translateX(5px);
            }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
</head>

<body>

    <!-- Main Content Over Background -->
    <div style="position: absolute; top: 10%; left: 5%; max-width: 60%; z-index: 5; text-align: left;">
        <h1 style="font-size: 4rem; color: #fff; text-shadow: 2px 2px 4px #000; margin-bottom: 20px; line-height: 1.2;">
            IS IT THE SAME FOR YOU?
        </h1>
        <h2 style="font-size: 2.5rem; color: #00FFFF; text-shadow: 1px 1px 3px #000; margin-bottom: 40px;">
            HERE IS THE SOLUTION!
        </h2>
        <a href="https://kidsdigitalhub.com" class="cta-btn"
            style="text-decoration: none; display: inline-block; animation: none;">
            🚀 VISITEAZĂ KIDS DIGITAL HUB
        </a>
    </div>

    <!-- AE Logo Watermark -->
    <div style="position: fixed; top: 20px; right: 20px; z-index: 200;">
        <a href="https://kidsdigitalhub.com" target="_blank" title="Visit Kids Digital Hub">
            <img src="assets/images/logo_ae.png" alt="AE Logo"
                style="width: 100px; height: auto; opacity: 0.9; filter: drop-shadow(0 0 10px rgba(0,255,255,0.5)); transition: transform 0.3s ease, opacity 0.3s ease; cursor: pointer;"
                onmouseover="this.style.transform='scale(1.1)'; this.style.opacity='1';"
                onmouseout="this.style.transform='scale(1)'; this.style.opacity='0.9';">
        </a>
    </div>

    <!-- Video Container in Bottom Right Corner -->
    <div id="video-container">
        <canvas id="promoCanvas"></canvas>

        <div id="overlay" onclick="startAd()">
            <div class="tap-text">▶ PLAY</div>
        </div>

        <div id="outro-overlay" style="display: none;">
            <h2 style="color: #00FFFF; font-size: 1.5rem; margin: 10px 0;">FINISHED</h2>

            <!-- STATIC INSTANT DOWNLOAD Logic -->
            <div id="download-controls" style="margin-bottom: 15px;">
                <button id="saveBtn" class="cta-btn" onclick="downloadInstant()">⬇️ DOWNLOAD</button>
            </div>

            <div class="social-bar">
                <a href="#" class="social-btn whatsapp" onclick="shareSocial('whatsapp')"
                    title="Share on WhatsApp">📱</a>
                <a href="#" class="social-btn facebook" onclick="shareSocial('facebook')"
                    title="Share on Facebook">📘</a>
                <a href="#" class="social-btn tiktok" onclick="shareSocial('tiktok')"
                    title="Copy Link for TikTok">🎵</a>
            </div>

            <br>
            <a href="https://kidsdigitalhub.com" style="color:white; text-decoration:underline; font-size: 0.8rem;">Go
                to Website 🏠</a>
        </div>
    </div>

    <!-- Hidden warnings logic preserved but visually removed from small player to save space -->
    <div id="share-warning" style="display:none;"></div>

    <script>
        const translations = {
            en: "⚠️ NOTICE: By tapping the icons below, you will automatically share this promo video to your friends!",
            ro: "⚠️ ATENȚIE: Apăsând iconițele de mai jos, vei distribui acest video automat prietenilor tăi!",
            fr: "⚠️ ATTENTION: En appuyant sur les icônes ci-dessous, vous partagerez automatiquement cette vidéo avec vos amis !",
            de: "⚠️ HINWEIS: Durch Tippen auf die Symbole teilen Sie dieses Video automatisch mit Freunden!",
            es: "⚠️ AVISO: ¡Al tocar los iconos de abajo, compartirás este video con tus amigos!",
            it: "⚠️ AVVISO: Toccando le icone qui sotto, condividerai questo video con gli amici!"
        };

        const canvas = document.getElementById('promoCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = 1080;
        canvas.height = 1920;

        let startTime = null;
        let audioCtx;
        let isPlaying = false;

        // Auto-detect Language
        function setWarningLanguage() {
            const urlParams = new URLSearchParams(window.location.search);
            let lang = urlParams.get('lang') || navigator.language.substring(0, 2).toLowerCase();
            if (!translations[lang]) lang = 'en';

            const warningEl = document.getElementById('share-warning');
            if (warningEl && translations[lang]) {
                warningEl.innerText = translations[lang];
            }
        }

        function loop(timestamp) {
            if (!isPlaying) return;
            if (!startTime) startTime = timestamp;
            const progress = (timestamp - startTime) / 1000;

            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (progress < 5) scene1_Hook(progress);
            else if (progress < 10) scene2_Problem(progress);
            else if (progress < 15) scene3_Solution(progress);
            else if (progress < 20) scene4_Outro(progress);
            else {
                endAd();
                return;
            }
            drawScanlines(progress);
            requestAnimationFrame(loop);
        }

        function startAd() {
            if (isPlaying) return;
            initAudio();
            isPlaying = true;
            document.getElementById('overlay').style.display = 'none';
            startTime = null;
            requestAnimationFrame(loop);
            playCyberpunkMusic();
        }

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playCyberpunkMusic() {
            // Audio logic remains for video Preview
            const bassOsc = audioCtx.createOscillator();
            const bassGain = audioCtx.createGain();
            bassOsc.type = 'sawtooth';
            bassOsc.frequency.setValueAtTime(55, audioCtx.currentTime);
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(200, audioCtx.currentTime);
            filter.frequency.linearRampToValueAtTime(800, audioCtx.currentTime + 0.5);
            filter.frequency.linearRampToValueAtTime(200, audioCtx.currentTime + 1.0);
            bassOsc.connect(filter);
            filter.connect(bassGain);
            bassGain.connect(audioCtx.destination);
            bassOsc.start();
            bassGain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            bassOsc.stop(audioCtx.currentTime + 20);
            const melodyInterval = setInterval(() => {
                if (!isPlaying) { clearInterval(melodyInterval); return; }
                if (Math.random() > 0.5) playNote();
            }, 250);
        }

        function playNote() {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            const freqs = [220, 261.63, 329.63, 392, 440, 523.25];
            osc.frequency.setValueAtTime(freqs[Math.floor(Math.random() * freqs.length)], audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        }

        // --- INSTANT DOWNLOAD ---
        function downloadInstant() {
            const link = document.createElement('a');
            link.href = 'assets/videos/kids_digital_hub_promo.webm';
            link.download = 'kids_digital_hub_promo.webm';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            // Auto-Redirect to TikTok
            setTimeout(() => {
                alert("✅ DESCARCAT! Redirecting to TikTok... 🚀");
                window.location.href = "https://www.tiktok.com/upload?lang=ro";
            }, 1500);
        }

        function scene1_Hook(t) { ctx.textAlign = 'center'; ctx.font = 'bold 150px Orbitron'; let offX = (Math.random() - 0.5) * 20; let offY = (Math.random() - 0.5) * 20; if (Math.random() > 0.9) offX += 50; ctx.fillStyle = '#FF0055'; ctx.fillText('ARE YOUR', 540 + offX, 640 + offY); ctx.fillStyle = '#00FFFF'; ctx.fillText('ARE YOUR', 540 - offX, 640 - offY); ctx.fillStyle = '#FFFFFF'; ctx.fillText('ARE YOUR', 540, 640); ctx.font = 'bold 200px Orbitron'; ctx.fillStyle = '#FFFF00'; ctx.fillText('KIDS', 540, 960); ctx.fillText('BORED?', 540, 1160); }
        function scene2_Problem(t) { let localT = t - 5; if (Math.floor(localT * 4) % 2 === 0) { ctx.fillStyle = '#110000'; ctx.fillRect(0, 0, 1080, 1920); } ctx.textAlign = 'center'; ctx.font = 'bold 120px Orbitron'; ctx.fillStyle = '#FF0000'; ctx.fillText('NEED A', 540, 860); let s = Math.sin(localT * 20) * 10; ctx.font = 'bold 180px Orbitron'; ctx.fillStyle = '#FFFFFF'; ctx.fillText('PARENT', 540 + s, 1060); ctx.fillText('BREAK?', 540 - s, 1260); }
        function scene3_Solution(t) { let localT = t - 10; drawRobot(540, 760, localT); ctx.textAlign = 'center'; ctx.font = 'bold 100px Orbitron'; ctx.fillStyle = '#00FF00'; ctx.fillText('SOLUTION:', 540, 1260); ctx.font = 'bold 140px Orbitron'; ctx.fillStyle = '#FFFFFF'; ctx.shadowColor = '#00FFFF'; ctx.shadowBlur = 20; ctx.fillText('KIDS DIGITAL', 540, 1410); ctx.fillText('HUB', 540, 1560); ctx.shadowBlur = 0; }
        function scene4_Outro(t) { let localT = t - 15; ctx.globalAlpha = 0.2; ctx.font = 'italic 80px Orbitron'; ctx.fillStyle = '#FFFFFF'; let ry = (localT * 100) % 1920; for (let i = 0; i < 1920; i += 100) ctx.fillText('WWW.KIDSDIGITALHUB.COM', 540, i + ry - 1920); ctx.globalAlpha = 1.0; let sc = 1 + Math.sin(localT * 5) * 0.1; ctx.save(); ctx.translate(540, 960); ctx.scale(sc, sc); ctx.font = 'bold 150px Orbitron'; ctx.fillStyle = '#FF00E6'; ctx.fillText('JOIN', 0, -100); ctx.fillText('NOW!', 0, 100); ctx.restore(); }
        function drawRobot(x, y, t) { ctx.save(); ctx.translate(x, y); ctx.translate(0, Math.sin(t * 2) * 20); ctx.fillStyle = '#333'; ctx.beginPath(); ctx.roundRect(-150, -150, 300, 300, 20); ctx.fill(); ctx.fillStyle = '#00FFFF'; if (Math.sin(t * 10) > 0.95) ctx.fillRect(-100, -50, 200, 10); else { ctx.beginPath(); ctx.arc(-70, -50, 40, 0, Math.PI * 2); ctx.arc(70, -50, 40, 0, Math.PI * 2); ctx.fill(); } ctx.beginPath(); ctx.moveTo(0, -150); ctx.lineTo(0, -250); ctx.strokeStyle = '#888'; ctx.lineWidth = 10; ctx.stroke(); ctx.beginPath(); ctx.arc(0, -250, 20, 0, Math.PI * 2); ctx.fillStyle = 'red'; ctx.fill(); ctx.fillStyle = '#222'; ctx.fillRect(-80, 50, 160, 20); ctx.fillStyle = '#00FF00'; for (let i = 0; i < 5; i++) { let h = Math.random() * 40; ctx.fillRect(-70 + i * 30, 70 - h, 20, h); } ctx.restore(); }
        function drawScanlines(t) { ctx.fillStyle = "rgba(0,0,0,0.1)"; for (let i = 0; i < 1920; i += 10) ctx.fillRect(0, i, 1080, 2); ctx.fillStyle = "rgba(0,255,255,0.05)"; ctx.fillRect(0, (t * 500) % 1920, 1080, 50); }
        function endAd() { isPlaying = false; document.getElementById('outro-overlay').style.display = 'flex'; }
        function shareSocial(platform) {
            const url = "https://kidsdigitalhub.com";
            const text = "Check out this awesome Kids Digital Hub! 🤖🎨 #kids #fun";

            if (platform === 'whatsapp') { window.location.href = `https://wa.me/?text=${encodeURIComponent(text + " " + url)}`; }
            else if (platform === 'facebook') { window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}`, '_blank'); }
            else if (platform === 'tiktok' || platform === 'copy') {
                navigator.clipboard.writeText(url).then(() => {
                    alert("Link COPIED! 📋\nPaste it in TikTok/Instagram Bio/Story! 🚀");
                    if (platform === 'tiktok') window.location.href = "https://www.tiktok.com";
                });
            }
        }

        // Auto-start and Init
        window.onload = () => {
            setWarningLanguage();
            setTimeout(startAd, 500);
        };
        document.body.addEventListener('click', () => { if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); if (!isPlaying) startAd(); });
    </script>
</body>

</html>
