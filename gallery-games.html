<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fun Games - Kids Digital Hub</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        .games-header {
            background: #42A5F5;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: white;
            border-bottom: 5px solid #1E88E5;
        }

        /* --- FILTERS --- */
        .age-filters {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: white;
            border: 2px solid #BBDEFB;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Fredoka', sans-serif;
            font-weight: bold;
            color: #1976D2;
            transition: all 0.2s;
        }

        .filter-btn:hover {
            background: #E3F2FD;
        }

        .filter-btn.active {
            background: #42A5F5;
            color: white;
            border-color: #42A5F5;
        }

        .gallery-grid {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

        .game-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            transition: transform 0.2s;
            border: 3px solid #E3F2FD;
            cursor: pointer;
            position: relative;
        }

        .game-card:hover {
            transform: translateY(-5px);
            border-color: #42A5F5;
        }

        .game-card.premium {
            border-color: #FFD700;
            background: #FFFDE7;
        }

        .game-thumb {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background: #eee;
        }

        .game-info {
            padding: 15px;
            text-align: center;
        }

        .game-title {
            font-weight: bold;
            font-size: 1.2rem;
            color: #1565C0;
            margin-bottom: 5px;
        }

        .age-badge {
            background: #FF7043;
            color: white;
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 0.8rem;
            position: absolute;
            top: 10px;
            right: 10px;
        }

        .game-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .game-container {
            width: 90%;
            max-width: 800px;
            height: 80%;
            /* approximate */
            background: white;
            border-radius: 10px;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .game-canvas {
            flex: 1;
            background: #222;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5rem;
        }

        .btn-close-game {
            position: absolute;
            top: -40px;
            right: 0;
            background: white;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-back-dash {
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 15px;
            border-radius: 20px;
            color: white;
            text-decoration: none;
            font-weight: bold;
            border: 2px solid white;
        }
    </style>
</head>

<body>

    <header class="games-header">
        <div style="display:flex; align-items:center; gap:10px;">
            <span style="font-size:2rem;">🎮</span>
            <h2 style="margin:0;" data-i18n="game_zone">Game Zone</h2>
            <select class="lang-select" onchange="changeLanguage(this.value)"
                style="margin-left:15px; padding:5px 10px; border-radius:15px; border:2px solid #1976D2; background:#E3F2FD; color:#1565C0; font-weight:bold; cursor:pointer;">
                <option value="en">🇬🇧 English</option>
                <option value="fr">🇫🇷 Français</option>
                <option value="de">🇩🇪 Deutsch</option>
                <option value="ro">🇷🇴 Română</option>
                <option value="es">🇪🇸 Español</option>
                <option value="zh">🇨🇳 中文</option>
                <option value="ja">🇯🇵 日本語</option>
                <option value="ko">🇰🇷 한국어</option>
            </select>
        </div>
        <a href="index.html" class="btn-back-dash" data-i18n="btn_back">⬅️ Back</a>
    </header>

    <!-- AGE FILTERS -->
    <div class="age-filters">
        <button class="filter-btn active" onclick="filterGames('all')" data-i18n="filter_all">All Ages</button>
        <button class="filter-btn" onclick="filterGames('3-5')" data-i18n="filter_3_5">3-5 Years</button>
        <button class="filter-btn" onclick="filterGames('6-9')" data-i18n="filter_6_9">6-9 Years</button>
        <button class="filter-btn" onclick="filterGames('10+')" data-i18n="filter_10_plus">10+ Years</button>
    </div>

    <main>
        <div class="gallery-grid" id="gamesGrid">
            <!-- Dynamic Content -->
        </div>
    </main>

    <!-- PLAY OVERLAY -->
    <div id="playOverlay" class="game-overlay">
        <button class="btn-close-game" onclick="closeGame()" data-i18n="btn_close_game">❌ Close Game</button>
        <div class="game-container">
            <div style="background:#ddd; padding:10px; text-align:center; font-weight:bold;" id="activeGameTitle">Game
                Title</div>
            <div class="game-canvas" id="activeGameCanvas">
                <!-- Game Embed / Canvas -->
                Loading Game...
            </div>

            <!-- COIN REWARD ACTION -->
            <div style="padding: 10px; text-align: center; border-top: 1px solid #ddd;">
                <button onclick="claimGameWin()" data-i18n="btn_i_won"
                    style="background: #4CAF50; color: white; border: none; padding: 10px 20px; border-radius: 20px; font-weight: bold; cursor: pointer;">
                    🏆 I Won! (Claim 10 Coins)
                </button>
            </div>
        </div>
    </div>

    <script src="js/translations.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/gamesConfig.js"></script>
    <script src="js/time_manager.js"></script>
    <script src="js/economy.js"></script>
    <script src="js/multiplayer_adapter.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Initialize TimeManager (will redirect if outside active hours)
            if (window.TimeManager) TimeManager.init();

            // Language handled by translations.js DOMContentLoaded

            // Check auth
            auth.applyProtection();

            // Check for Multiplayer Mode via URL Params (from Messenger)
            const urlParams = new URLSearchParams(window.location.search);
            const mode = urlParams.get('mode');
            const gameId = urlParams.get('game');
            const opponent = urlParams.get('opponent');

            if (mode === 'multi' && gameId) {
                // Find game info
                const game = gamesConfig.find(g => g.id === gameId);
                if (game) {
                    launchGame(game, opponent);
                }
            }

            // Initial Render
            filterGames('all');
        });

        function filterGames(ageGroup) {
            const grid = document.getElementById('gamesGrid');
            grid.innerHTML = '';
            const isAdmin = localStorage.getItem('kdh_admin_mode') === 'true';

            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.innerText.toLowerCase().includes(ageGroup) || (ageGroup === 'all' && btn.innerText.includes('All'))) {
                    btn.classList.add('active');
                }
            });

            gamesConfig.forEach(game => {
                if (game.premium && !isAdmin) return; // Hide premium if not admin/premium (simulated)
                if (ageGroup !== 'all' && game.age !== ageGroup) return;

                const lang = localStorage.getItem('kdh_lang') || 'en';
                const playNowText = translations[lang]?.play_now || 'Play Now ►';

                const card = document.createElement('div');
                card.className = game.premium ? 'game-card premium' : 'game-card';
                card.onclick = () => launchGame(game);

                card.innerHTML = `
                    <div style="position:relative;">
                        <img src="${game.thumb}" class="game-thumb">
                        <span class="age-badge">${game.age}+</span>
                    </div>
                    <div class="game-info">
                        <div class="game-title">${game.premium ? '🔒 ' : ''}${game.title}</div>
                        <div style="color:#666; font-size:0.9rem;">${playNowText}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function launchGame(game, opponentName = null) {
            document.getElementById('playOverlay').style.display = 'flex';
            document.getElementById('activeGameTitle').textContent = game.title;

            const canvas = document.getElementById('activeGameCanvas');
            canvas.innerHTML = '';

            // Simulate Game Content
            if (opponentName) {
                canvas.innerHTML = `
                    <div style="text-align:center;">
                        <h2>⚔️ Multiplayer Battle!</h2>
                        <p>You vs <b>${opponentName}</b></p>
                        <div style="margin-top:20px; font-size:3rem;">🎮</div>
                        <p>Connecting to ${opponentName}...</p>
                        <p style="color:#4CAF50;">Syncing Game State 100%</p>
                    </div>
                `;
            } else {
                canvas.innerHTML = `
                    <div style="text-align:center;">
                        <h2>Starting ${game.title}...</h2>
                        <p>Enjoy playing!</p>
                        <hr style="width:50%; border-color:#555;">
                        <p>(This is a placeholder for the actual game iframe/canvas)</p>
                    </div>
                `;
            }

            // FORCE TRANSLATION OF DYNAMIC BUTTONS
            const lang = localStorage.getItem('kdh_lang') || 'en';
            if (typeof changeLanguage === 'function') {
                changeLanguage(lang);
            }
        }

        function closeGame() {
            document.getElementById('playOverlay').style.display = 'none';
            // Stop any audio/game loop here
            if (urlParams.get('mode') === 'multi') {
                // Return to messenger if came from there? or just stay in gallery
                // Optional: history.back();
            }
        }

        function claimGameWin() {
            if (window.EconomyManager) {
                EconomyManager.addCoins(10);
                alert("🏆 Awesome! You earned 10 Coins for playing!");
                closeGame();
            }
        }
    </script>
</body>

</html>
