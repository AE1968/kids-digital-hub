<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Games - Kids Digital Hub</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        .gallery-header {
            background: #42A5F5;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: white;
            border-bottom: 5px solid #1565C0;
        }

        .gallery-grid {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .slot {
            aspect-ratio: 1;
            background: white;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }

        .slot.filled {
            border: 4px solid #90CAF9;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            background: #E3F2FD;
            flex-direction: column;
            gap: 10px;
        }

        .slot.filled:hover {
            transform: scale(1.05);
        }

        .slot.empty {
            border: 4px dashed #CFD8DC;
            background: #F5F5F5;
        }

        .empty-label {
            color: #B0BEC5;
            font-weight: bold;
            font-size: 0.9rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .slot-number {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .game-icon {
            font-size: 4rem;
        }

        .game-title {
            font-weight: bold;
            color: #1565C0;
            font-size: 1rem;
            text-align: center;
            padding: 0 5px;
        }

        .btn-play {
            margin-top: 5px;
            padding: 5px 15px;
            background: #42A5F5;
            color: white;
            border: none;
            border-radius: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-back-dash {
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 15px;
            border-radius: 20px;
            color: white;
            text-decoration: none;
            font-weight: bold;
            border: 2px solid white;
        }
    </style>
</head>

<body>

    <header class="gallery-header">
        <div style="display:flex; align-items:center; gap:10px;">
            <span style="font-size:2rem;">🎮</span>
            <h2 style="margin:0;">My Games Arcade</h2>
        </div>
        <a href="index.html" class="btn-back-dash" data-i18n="btn_back">⬅️ Back</a>
    </header>
    <script src="js/translations.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Language
            const lang = localStorage.getItem('kdh_lang') || 'en';
            changeLanguage(lang);

            // Auth Protection
            auth.applyProtection();
        });

        function playGame(gameName) {
            // Mock Game Loader
            const container = document.querySelector('.gallery-grid');
            const originalContent = container.innerHTML;

            container.innerHTML = `
                <div style="grid-column: 1/-1; background: #000; color: white; height: 500px; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 20px;">
                    <h2>🎮 ${gameName}</h2>
                    <p>Loading Game Engine...</p>
                    <div class="progress-bar" style="width: 300px; height: 20px; background: #333; border-radius: 10px; overflow: hidden; margin: 20px;">
                        <div style="width: 100%; height: 100%; background: #4CAF50; animation: load 2s linear;"></div>
                    </div>
                    <button onclick="location.reload()" style="padding: 10px 20px; background: #f44336; color: white; border: none; border-radius: 10px; cursor: pointer;">Exit Game</button>
                    <style>@keyframes load { from { width: 0; } to { width: 100%; } }</style>
                </div>
            `;
        }
    </script>

    <main>
        <div class="gallery-grid">
            <!-- SLOT 1: FILLED -->
            <div class="slot filled">
                <span class="slot-number">1</span>
                <span class="game-icon">🚀</span>
                <span class="game-title">Space Jump</span>
                <button class="btn-play" data-i18n="btn_play" onclick="playGame('Space Jump')">▶ Play</button>
            </div>

            <!-- SLOT 2: FILLED -->
            <div class="slot filled">
                <span class="slot-number">2</span>
                <span class="game-icon">🔢</span>
                <span class="game-title">Math Whiz</span>
                <button class="btn-play" data-i18n="btn_play" onclick="playGame('Math Whiz')">▶ Play</button>
            </div>
            <!-- SLOT 3: FILLED -->
            <div class="slot filled">
                <span class="slot-number">3</span>
                <span class="game-icon">🧩</span>
                <span class="game-title">Puzzle Mix</span>
                <button class="btn-play" data-i18n="btn_play" onclick="playGame('Puzzle Mix')">▶ Play</button>
            </div>
            <!-- SLOT 4: FILLED -->
            <div class="slot filled">
                <span class="slot-number">4</span>
                <span class="game-icon">🐸</span>
                <span class="game-title">Frogger Hop</span>
                <button class="btn-play" data-i18n="btn_play" onclick="playGame('Frogger Hop')">▶ Play</button>
            </div>
            <!-- SLOT 5: FILLED -->
            <div class="slot filled">
                <span class="slot-number">5</span>
                <span class="game-icon">🎹</span>
                <span class="game-title">Piano Kids</span>
                <button class="btn-play" data-i18n="btn_play" onclick="playGame('Piano Kids')">▶ Play</button>
            </div>

            <!-- SLOTS 6-10: EMPTY -->
            <div class="slot empty"><span class="slot-number">6</span>
                <div class="empty-label"><span>➕</span><span>Empty</span></div>
            </div>
            <div class="slot empty"><span class="slot-number">7</span>
                <div class="empty-label"><span>➕</span><span>Empty</span></div>
            </div>
            <div class="slot empty"><span class="slot-number">8</span>
                <div class="empty-label"><span>➕</span><span>Empty</span></div>
            </div>
            <div class="slot empty"><span class="slot-number">9</span>
                <div class="empty-label"><span>➕</span><span>Empty</span></div>
            </div>
            <div class="slot empty premium-slot"><span class="slot-number">10</span>
                <div class="empty-label"><span>🔒 Premium</span></div>
            </div>
        </div>
    </main>

</body>

</html>
