<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fun Games - Kids Digital Hub</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        .games-header {
            background: #4CAF50;
            /* Green for Games */
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: white;
            border-bottom: 5px solid #2E7D32;
        }

        .gallery-grid {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 25px;
        }

        .game-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
            cursor: pointer;
            border: 2px solid transparent;
            position: relative;
        }

        .game-card:hover {
            transform: translateY(-5px);
            border-color: #4CAF50;
        }

        .game-card.premium {
            border-color: gold;
            background: #fffbef;
        }

        .slot-number {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: bold;
            z-index: 20;
            border: 2px solid rgba(255, 255, 255, 0.5);
        }

        .card-thumb {
            width: 100%;
            height: 150px;
            background: #eee;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: #ccc;
            object-fit: cover;
        }

        .card-info {
            padding: 15px;
            text-align: center;
        }

        .card-title {
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 5px;
            color: #333;
        }

        .card-badge {
            font-size: 0.8rem;
            padding: 3px 8px;
            border-radius: 10px;
            background: #e0e0e0;
            color: #666;
            display: inline-block;
        }

        .card-badge.multi {
            background: #E3F2FD;
            color: #1565C0;
        }

        .card-badge.solo {
            background: #E8F5E9;
            color: #2E7D32;
        }

        .btn-back-dash {
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 15px;
            border-radius: 20px;
            color: white;
            text-decoration: none;
            font-weight: bold;
            border: 2px solid white;
        }

        /* GAME OVERLAY */
        #gameOverlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #222;
            z-index: 10000;
            flex-direction: column;
            color: white;
            font-family: 'Fredoka', sans-serif;
        }

        .game-toolbar {
            height: 60px;
            background: #333;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 20px;
            border-bottom: 1px solid #444;
        }

        .timer-display {
            font-family: monospace;
            font-size: 1.5rem;
            background: black;
            color: #0f0;
            padding: 5px 15px;
            border-radius: 5px;
            border: 1px solid #444;
        }

        .game-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }

        .game-btn.red {
            background: #f44336;
        }

        .game-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>

    <header class="games-header">
        <div style="display:flex; align-items:center; gap:10px;">
            <span style="font-size:2rem;">🎮</span>
            <h2 style="margin:0;">Game Zone</h2>
        </div>
        <a href="index.html" class="btn-back-dash" data-i18n="btn_back">⬅️ Back</a>
    </header>

    <main>
        <div class="gallery-grid" id="gamesContainer">
            <!-- Dynamic Games Here -->
        </div>
    </main>

    <!-- GAME OVERLAY (Labirint & Logic) -->
    <div id="gameOverlay">
        <div class="game-toolbar">
            <div id="gameTitleDisplay" style="font-size:1.2rem; font-weight:bold;">Game Title</div>
            <div style="flex:1;"></div>

            <div id="timerContainer" style="display:flex; align-items:center; gap:10px;">
                <span>TIME:</span>
                <div class="timer-display" id="timerValue">00:00</div>
            </div>

            <button class="game-btn" id="btnStartGame" onclick="startGame()">▶ START</button>
            <button class="game-btn red" onclick="closeGame()">❌ EXIT</button>
        </div>

        <!-- Game Area (Canvas) -->
        <div
            style="flex:1; display:flex; align-items:center; justify-content:center; background:#1a1a1a; position:relative; overflow:auto;">
            <div id="gameBoard"
                style="position:relative; width:600px; height:600px; background:white; border-radius:10px;">
                <img id="gameBg" src="" style="width:100%; height:100%; object-fit:contain; pointer-events:none;">
                <canvas id="gameCanvas" width="600" height="600"
                    style="position:absolute; top:0; left:0; cursor:crosshair;"></canvas>
            </div>
        </div>
    </div>

    <script src="js/translations.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // --- GAMES CONFIGURATION ---
        const gamesList = [
            {
                id: 1,
                title: 'Rocket Maze',
                type: 'worksheet',
                mode: 'solo',
                img: 'assets/images/game_maze_rocket.png',
                description: 'Time yourself!',
                premium: false
            },
            {
                id: 2,
                title: 'Chess (Șah)',
                type: 'board',
                mode: 'multi',
                img: '',
                icon: '♟️',
                description: 'Classic Chess',
                premium: true
            },
            {
                id: 3,
                title: 'Backgammon (Table)',
                type: 'board',
                mode: 'multi',
                img: '',
                icon: '🎲',
                description: 'Online Multiplayer',
                premium: true
            },
            {
                id: 4,
                title: 'Tic Tac Toe (X și 0)',
                type: 'board',
                mode: 'multi',
                img: '',
                icon: '❌',
                description: 'Classic',
                premium: true
            }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            const lang = localStorage.getItem('kdh_lang') || 'en';
            changeLanguage(lang);
            auth.applyProtection();

            const isAdmin = localStorage.getItem('kdh_admin_mode') === 'true';
            const container = document.getElementById('gamesContainer');

            gamesList.forEach(game => {
                if (game.premium && !isAdmin) return;

                const card = document.createElement('div');
                card.className = game.premium ? 'game-card premium' : 'game-card';

                let thumbContent = '';
                if (game.img) {
                    thumbContent = `<img src="${game.img}" class="card-thumb">`;
                } else {
                    thumbContent = `<div class="card-thumb">${game.icon || '🎮'}</div>`;
                }

                const badgeClass = game.mode === 'multi' ? 'multi' : 'solo';
                const badgeText = game.mode === 'multi' ? 'online multi' : 'solo run';

                card.innerHTML = `
                    <span class="slot-number">${game.id}</span>
                    ${thumbContent}
                    <div class="card-info">
                        <div class="card-title">${game.premium ? '🔒 ' : ''}${game.title}</div>
                        <div class="card-badge ${badgeClass}">${badgeText.toUpperCase()}</div>
                    </div>
                 `;

                card.onclick = () => launchGame(game);
                container.appendChild(card);
            });
        });

        // --- GAME ENGINE ---
        let gameTimerInterval;
        let gameSeconds = 0;
        let isGameRunning = false;

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let painting = false;

        function launchGame(game) {
            if (game.premium) {
                alert("Premium Game Module (Online Multiplayer) - Coming Soon!");
                return;
            }
            document.getElementById('gameOverlay').style.display = 'flex';
            document.getElementById('gameTitleDisplay').textContent = game.title;
            document.getElementById('gameBg').src = game.img;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stopTimer();
            document.getElementById('timerValue').textContent = "00:00";

            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#2196F3';
        }

        function closeGame() {
            document.getElementById('gameOverlay').style.display = 'none';
            stopTimer();
        }

        function startGame() {
            if (isGameRunning) return;
            isGameRunning = true;
            gameSeconds = 0;
            document.getElementById('timerValue').textContent = "00:00";
            document.getElementById('btnStartGame').style.opacity = '0.5';

            gameTimerInterval = setInterval(() => {
                gameSeconds++;
                const mins = Math.floor(gameSeconds / 60).toString().padStart(2, '0');
                const secs = (gameSeconds % 60).toString().padStart(2, '0');
                document.getElementById('timerValue').textContent = `${mins}:${secs}`;
            }, 1000);
        }

        function stopTimer() {
            clearInterval(gameTimerInterval);
            isGameRunning = false;
            document.getElementById('btnStartGame').style.opacity = '1';
        }

        // --- DRAWING LOGIC ---
        function startDraw(e) {
            if (!isGameRunning) {
                alert("Please click START to begin the timer!");
                return;
            }
            painting = true;
            draw(e);
        }

        function endDraw() { painting = false; ctx.beginPath(); }

        function draw(e) {
            if (!painting) return;
            const rect = canvas.getBoundingClientRect();
            let clientX = e.clientX || (e.touches ? e.touches[0].clientX : 0);
            let clientY = e.clientY || (e.touches ? e.touches[0].clientY : 0);

            let x = (clientX - rect.left) * (canvas.width / rect.width);
            let y = (clientY - rect.top) * (canvas.height / rect.height);

            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y);
        }

        canvas.addEventListener('mousedown', startDraw);
        canvas.addEventListener('mouseup', endDraw);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDraw(e); }, { passive: false });
        canvas.addEventListener('touchend', (e) => { e.preventDefault(); endDraw(); });
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e); }, { passive: false });

    </script>
</body>

</html>
