<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Games - Kids Digital Hub</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        .gallery-header {
            background: #42A5F5;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: white;
            border-bottom: 5px solid #1565C0;
        }

        .gallery-grid {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .slot {
            aspect-ratio: 1;
            background: white;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }

        .slot.filled {
            border: 4px solid #90CAF9;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            background: #E3F2FD;
            flex-direction: column;
            gap: 10px;
        }

        .slot.filled:hover {
            transform: scale(1.05);
        }

        .slot.empty {
            border: 4px dashed #CFD8DC;
            background: #F5F5F5;
        }

        .empty-label {
            color: #B0BEC5;
            font-weight: bold;
            font-size: 0.9rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .slot-number {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .game-icon {
            font-size: 4rem;
        }

        .game-title {
            font-weight: bold;
            color: #1565C0;
            font-size: 1rem;
            text-align: center;
            padding: 0 5px;
        }

        .btn-play {
            margin-top: 5px;
            padding: 5px 15px;
            background: #42A5F5;
            color: white;
            border: none;
            border-radius: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-back-dash {
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 15px;
            border-radius: 20px;
            color: white;
            text-decoration: none;
            font-weight: bold;
            border: 2px solid white;
        }
    </style>
</head>

<body>

    <header class="gallery-header">
        <div style="display:flex; align-items:center; gap:10px;">
            <span style="font-size:2rem;">🎮</span>
            <h2 style="margin:0;">My Games Arcade</h2>
        </div>
        <a href="index.html" class="btn-back-dash" data-i18n="btn_back">⬅️ Back</a>
    </header>
    <script src="js/translations.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Language logic
            const lang = localStorage.getItem('kdh_lang') || 'en';
            changeLanguage(lang);
            // Auth logic
            auth.applyProtection();

            // Dynamic Stats: Count filled slots and save
            const filledCount = document.querySelectorAll('.slot.filled').length;
            localStorage.setItem('kdh_cnt_games', filledCount);
        });

        // Simple Pong Game Engine
        function playGame(gameName) {
            const overlay = document.getElementById('gameOverlay');
            overlay.style.display = 'flex';

            const container = document.querySelector('.game-container');
            container.innerHTML = `
                <h2 style="color:white; margin-bottom:10px;">${gameName}</h2>
                <canvas id="gameCanvas" width="480" height="320" style="background:black; border:2px solid #555;"></canvas>
                <div style="color:#aaa; font-size:0.9rem; margin-top:5px;">Use Mouse to Move Paddle</div>
                <button class="btn-exit" onclick="closeGame()">Exit Game</button>
            `;

            // Pong Logic
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            let ballRadius = 10;
            let x = canvas.width / 2;
            let y = canvas.height - 30;
            let dx = 2;
            let dy = -2;
            let paddleHeight = 10;
            let paddleWidth = 75;
            let paddleX = (canvas.width - paddleWidth) / 2;
            let interval;

            function drawBall() {
                ctx.beginPath();
                ctx.arc(x, y, ballRadius, 0, Math.PI * 2);
                ctx.fillStyle = "#0095DD";
                ctx.fill();
                ctx.closePath();
            }
            function drawPaddle() {
                ctx.beginPath();
                ctx.rect(paddleX, canvas.height - paddleHeight, paddleWidth, paddleHeight);
                ctx.fillStyle = "#0095DD";
                ctx.fill();
                ctx.closePath();
            }
            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                drawBall();
                drawPaddle();

                if (x + dx > canvas.width - ballRadius || x + dx < ballRadius) {
                    dx = -dx;
                }
                if (y + dy < ballRadius) {
                    dy = -dy;
                } else if (y + dy > canvas.height - ballRadius) {
                    if (x > paddleX && x < paddleX + paddleWidth) {
                        dy = -dy;
                    } else {
                        // Game Over logic simplified - just bounce bottom for endless play demo
                        dy = -dy;
                    }
                }

                x += dx;
                y += dy;
            }

            document.addEventListener("mousemove", mouseMoveHandler, false);
            function mouseMoveHandler(e) {
                const relativeX = e.clientX - canvas.offsetLeft;
                if (relativeX > 0 && relativeX < canvas.width) {
                    paddleX = relativeX - paddleWidth / 2;
                }
            }

            interval = setInterval(draw, 10);

            // attach interval to window to clear it later
            window.currentGameInterval = interval;
        }

        function closeGame() {
            document.getElementById('gameOverlay').style.display = 'none';
            if (window.currentGameInterval) clearInterval(window.currentGameInterval);
        }
    </script>

    <main>
        <div class="gallery-grid">
            <!-- SLOTS 1-9: ALL EMPTY (Site Reset) -->
            <div class="slot empty"><span class="slot-number">1</span>
                <div class="empty-label"><span>➕</span><span>Empty</span></div>
            </div>
            <div class="slot empty"><span class="slot-number">2</span>
                <div class="empty-label"><span>➕</span><span>Empty</span></div>
            </div>
            <div class="slot empty"><span class="slot-number">3</span>
                <div class="empty-label"><span>➕</span><span>Empty</span></div>
            </div>
            <div class="slot empty"><span class="slot-number">4</span>
                <div class="empty-label"><span>➕</span><span>Empty</span></div>
            </div>
            <div class="slot empty"><span class="slot-number">5</span>
                <div class="empty-label"><span>➕</span><span>Empty</span></div>
            </div>
            <div class="slot empty"><span class="slot-number">6</span>
                <div class="empty-label"><span>➕</span><span>Empty</span></div>
            </div>
            <div class="slot empty"><span class="slot-number">7</span>
                <div class="empty-label"><span>➕</span><span>Empty</span></div>
            </div>
            <div class="slot empty"><span class="slot-number">8</span>
                <div class="empty-label"><span>➕</span><span>Empty</span></div>
            </div>
            <div class="slot empty"><span class="slot-number">9</span>
                <div class="empty-label"><span>➕</span><span>Empty</span></div>
            </div>

            <!-- SLOT 10: PREMIUM -->
            <div class="slot empty premium-slot"><span class="slot-number">10</span>
                <div class="empty-label"><span>🔒 Premium</span></div>
            </div>
        </div>
    </main>

</body>

</html>
