<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline | Kids Digital Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: #0a0a12;
            color: #00f3ff;
            font-family: 'Orbitron', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        .orb {
            width: 80px;
            height: 80px;
            border: 2px solid #00f3ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin-bottom: 20px;
            box-shadow: 0 0 20px #00f3ff;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.1);
                opacity: 0.5;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>

<body>
    <div class="orb">🤖</div>
    <h1>NEURAL LINK LOST</h1>
    <p>You are currently offline. Please reconnect to access the Nexus Supreme Hub.</p>
    <button onclick="window.location.reload()"
        style="background:transparent; border:1px solid #00f3ff; color:#00f3ff; padding:10px 20px; cursor:pointer; font-family:'Orbitron';">RETRY
        LINK</button>
</body>

</html>
