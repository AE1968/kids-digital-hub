<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>Contact - Kids Digital Hub</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #4CAF50 0%, #2E7D32 100%);
            min-height: 100vh;
            font-family: 'Fredoka', sans-serif;
        }

        .contact-container {
            max-width: 800px;
            margin: 100px auto 50px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .contact-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .contact-header h1 {
            font-size: 3rem;
            color: #4CAF50;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .contact-header p {
            font-size: 1.2rem;
            color: #666;
        }

        .contact-form {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 40px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 1.1rem;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 15px;
            font-family: 'Fredoka', sans-serif;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #4CAF50;
        }

        .form-group textarea {
            min-height: 150px;
            resize: vertical;
        }

        .submit-btn {
            background: linear-gradient(135deg, #4CAF50 0%, #2E7D32 100%);
            color: white;
            border: none;
            padding: 18px 40px;
            border-radius: 25px;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: 'Fredoka', sans-serif;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(76, 175, 80, 0.4);
        }

        .back-btn {
            display: inline-block;
            margin: 20px auto;
            padding: 12px 30px;
            background: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 20px;
            font-weight: 600;
            transition: transform 0.2s;
        }

        .back-btn:hover {
            transform: translateY(-2px);
        }

        .text-center {
            text-align: center;
        }

        .info-box {
            background: #e8f5e9;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            border-left: 5px solid #4CAF50;
        }

        .info-box h3 {
            color: #2E7D32;
            margin-bottom: 10px;
        }

        .info-box p {
            color: #555;
            line-height: 1.6;
        }
    </style>
</head>

<body>
    <div class="contact-container">
        <div class="contact-header">
            <h1>📧 Contact Us</h1>
            <p>We're here to help! Send us a message.</p>
        </div>

        <div class="info-box">
            <h3>📝 Professional Communication</h3>
            <p>This form is for formal inquiries, partnerships, support requests, and general questions. We respond
                within 24-48 hours.</p>
        </div>

        <div class="contact-form">
            <form id="contactForm" onsubmit="submitContact(event)">
                <div class="form-group">
                    <label for="name">Your Name / Organization 👤</label>
                    <input type="text" id="name" name="name" placeholder="e.g., John Smith / ABC School" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address 📧</label>
                    <input type="email" id="email" name="email" placeholder="your.email@example.com" required>
                </div>

                <div class="form-group">
                    <label for="subject">Subject 📌</label>
                    <select id="subject" name="subject" required>
                        <option value="">-- Select a subject --</option>
                        <option value="General Inquiry">General Inquiry</option>
                        <option value="Technical Support">Technical Support</option>
                        <option value="Partnership">Partnership Opportunity</option>
                        <option value="Feedback">Feedback</option>
                        <option value="Billing">Billing & Payments</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="message">Your Message 💬</label>
                    <textarea id="message" name="message" placeholder="Please describe your inquiry in detail..."
                        required></textarea>
                </div>

                <input type="hidden" id="userLanguage" name="userLanguage" value="en">

                <button type="submit" class="submit-btn">📨 Send Message</button>
            </form>
        </div>

        <div class="text-center">
            <a href="index.html" class="back-btn">🏠 Back to Home</a>
        </div>
    </div>

    <script>
        // Detect user's language from browser
        const userLang = navigator.language.substring(0, 2);
        document.getElementById('userLanguage').value = userLang;

        async function translateText(text, sourceLang, targetLang) {
            try {
                const response = await fetch('https://libretranslate.com/translate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        q: text,
                        source: sourceLang,
                        target: targetLang,
                        format: 'text'
                    })
                });

                const data = await response.json();
                return data.translatedText;
            } catch (error) {
                console.error('Translation error:', error);
                return text; // Return original text if translation fails
            }
        }

        async function submitContact(event) {
            event.preventDefault();

            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const subject = document.getElementById('subject').value;
            const message = document.getElementById('message').value;
            const userLanguage = document.getElementById('userLanguage').value;

            // Show loading state
            const submitBtn = event.target.querySelector('.submit-btn');
            const originalText = submitBtn.textContent;
            submitBtn.textContent = '⏳ Sending...';
            submitBtn.disabled = true;

            try {
                // Translate message to Romanian for admin
                const romanianMessage = await translateText(message, userLanguage, 'ro');

                // Create contact object
                const contactData = {
                    type: 'contact',
                    name,
                    email,
                    subject,
                    message: message,
                    messageLang: userLanguage,
                    romanianMessage: romanianMessage,
                    timestamp: new Date().toISOString(),
                    userLanguage: userLanguage,
                    status: 'unread'
                };

                // 🚀 Send to Railway Server
                fetch('https://web-production-b215.up.railway.app/api/contact', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(contactData)
                })
                    .then(res => res.json())
                    .then(data => console.log('Central Server Response:', data))
                    .catch(err => console.error('Error sending to Central Server:', err));

                // Save to localStorage (as backup)
                const contacts = JSON.parse(localStorage.getItem('contacts') || '[]');
                contacts.unshift(contactData);
                localStorage.setItem('contacts', JSON.stringify(contacts));

                // Show success message
                alert('✅ Thank you for your message! We will respond within 24-48 hours.');

                // Reset form
                document.getElementById('contactForm').reset();
                document.getElementById('userLanguage').value = userLang;

            } catch (error) {
                alert('❌ Error sending message. Please try again or email us directly at contact@kidsdigitalhub.com');
            } finally {
                submitBtn.textContent = originalText;
                submitBtn.disabled = false;
            }
        }
    </script>
</body>

</html>
