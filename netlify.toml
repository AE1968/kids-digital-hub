[build]
  publish = "."
  functions = "netlify/functions"

# 🚀 Canonical Redirect: Force WWW and HTTPS
# This avoids loops by only matching the apex domain.
[[redirects]]
  from = "https://kidsdigitalhub.com/*"
  to = "https://www.kidsdigitalhub.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://kidsdigitalhub.com/*"
  to = "https://www.kidsdigitalhub.com/:splat"
  status = 301
  force = true

# 📡 Backend API proxy
[[redirects]]
  from = "/api/*"
  to = "https://web-production-b215.up.railway.app/api/:splat"
  status = 200
  force = true

# NOTE: SPA redirect (/* to /index.html) removed for Multi-Page Site stability.
