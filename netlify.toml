[build]
  publish = "."
  functions = "netlify/functions"

# Netlify Identity Settings
[identity]
  # Enable Identity widget
  
# Redirect non-WWW to WWW (www.kidsdigitalhub.com is primary)
[[redirects]]
  from = "https://kidsdigitalhub.com/*"
  to = "https://www.kidsdigitalhub.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://kidsdigitalhub.com/*"
  to = "https://www.kidsdigitalhub.com/:splat"
  status = 301
  force = true

# API redirects to Railway backend
[[redirects]]
  from = "/api/*"
  to = "https://web-production-b215.up.railway.app/api/:splat"
  status = 200
  force = true

# Standard SPA redirect
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
