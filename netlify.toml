[build]
  publish = "."
  functions = "netlify/functions"

# Regula 1: Orice accesare pe radacina duce la Nexus
[[redirects]]
  from = "/"
  to = "/nexus.html"
  status = 200

# Regula 2: Fallback pentru SPA (Single Page App)
# Orice pagina care nu exista fizic (gen /www.) va fi trimisa la Nexus
[[redirects]]
  from = "/*"
  to = "/nexus.html"
  status = 200

# Regula 3: Fortam HTTPS
[[redirects]]
  from = "http://kidsdigitalhub.com/*"
  to = "https://www.kidsdigitalhub.com/:splat"
  status = 301
  force = true
