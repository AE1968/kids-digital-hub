[build]
  publish = "."
  command = "echo 'No build command needed for static site'"

# 🔄 REDIRECTS - FORCE NON-WWW
# Aceasta regula redirectioneaza automat www catre domeniul principal
[[redirects]]
  from = "https://www.kidsdigitalhub.com/*"
  to = "https://kidsdigitalhub.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    # 🛡️ SECURITY HEADERS - MAXIMUM PROTECTION
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=*, payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https://libretranslate.de https://translate.terraprint.co https://api.netlify.com; frame-src 'self' https://www.youtube.com;"

# 🌍 EDGE FUNCTIONS: Geo-Detection & Language Redirect
# Această secțiune deleagă decizia de rutare către o funcție Edge (inclusă în planul Pro)
[[edge_functions]]
  path = "/"
  function = "geo_language"
