[build]
  publish = "."

# Redirect WWW to non-WWW (works on Netlify subdomain too)
[[redirects]]
  from = "/www"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/www/*"
  to = "/:splat"
  status = 301
  force = true

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
