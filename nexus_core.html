<!DOCTYPE html>
<html>

<head>
    <title>NEXUS CORE | AI SYSTEM</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-purple: #bc13fe;
            --matrix-green: #00ff41;
            --deep-black: #050505;
            --hud-bg: rgba(10, 20, 30, 0.85);
        }

        body {
            background-color: var(--deep-black);
            color: var(--neon-cyan);
            font-family: 'Rajdhani', sans-serif;
            margin: 0;
            overflow: hidden;
            /* App-like feel */
            height: 100vh;
            display: flex;
            flex-direction: column;
            background-image:
                radial-gradient(circle at 50% 50%, rgba(0, 243, 255, 0.1) 0%, transparent 50%),
                linear-gradient(0deg, rgba(0, 0, 0, 0.9) 0%, rgba(0, 20, 30, 1) 100%);
        }

        /* --- VISUALIZATION CORE --- */
        .visor-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 1;
        }

        .robot-head {
            width: 300px;
            height: 350px;
            position: relative;
            filter: drop-shadow(0 0 20px var(--neon-cyan));
            animation: float 6s ease-in-out infinite;
        }

        .brain-core {
            position: absolute;
            top: 50px;
            left: 50px;
            width: 200px;
            height: 180px;
            background: radial-gradient(circle, var(--neon-purple), transparent);
            border-radius: 50%;
            opacity: 0.6;
            animation: pulse-brain 3s infinite alternate;
            mix-blend-mode: screen;
        }

        .circuit-lines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 2px solid var(--neon-cyan);
            border-radius: 40px 40px 100px 100px;
            box-shadow: inset 0 0 30px var(--neon-cyan);
            background: rgba(0, 243, 255, 0.05);
            clip-path: polygon(10% 0, 90% 0, 100% 20%, 100% 80%, 80% 100%, 20% 100%, 0 80%, 0 20%);
        }

        .eye-scanner {
            position: absolute;
            top: 40%;
            left: 10%;
            width: 80%;
            height: 4px;
            background: var(--matrix-green);
            box-shadow: 0 0 10px var(--matrix-green);
            animation: scan 2s linear infinite;
            opacity: 0.7;
        }

        @keyframes float {
            0% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-20px);
            }

            100% {
                transform: translateY(0px);
            }
        }

        @keyframes pulse-brain {
            0% {
                transform: scale(0.9);
                opacity: 0.3;
            }

            100% {
                transform: scale(1.1);
                opacity: 0.8;
                box-shadow: 0 0 50px var(--neon-purple);
            }
        }

        @keyframes scan {
            0% {
                top: 30%;
                opacity: 0;
            }

            50% {
                opacity: 1;
            }

            100% {
                top: 70%;
                opacity: 0;
            }
        }

        /* --- HUD ELEMENTS --- */
        .hud-top {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
        }

        .nexus-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            letter-spacing: 5px;
            text-shadow: 0 0 20px var(--neon-cyan);
            margin: 0;
        }

        .status-badge {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--matrix-green);
            color: var(--matrix-green);
            padding: 5px 15px;
            border-radius: 15px;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* --- COMMUNICATION TAB --- */
        .comm-panel {
            height: 250px;
            background: var(--hud-bg);
            border-top: 2px solid var(--neon-purple);
            box-shadow: 0 -10px 50px rgba(188, 19, 254, 0.2);
            padding: 20px;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .comm-header {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--neon-purple);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(188, 19, 254, 0.3);
            padding-bottom: 5px;
        }

        .chat-log {
            flex: 1;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            color: #ddd;
            margin-bottom: 10px;
        }

        .chat-entry {
            margin-bottom: 5px;
            opacity: 0;
            animation: fadeIn 0.3s forwards;
        }

        .chat-nexus {
            color: var(--neon-cyan);
        }

        .chat-user {
            color: var(--matrix-green);
            text-align: right;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        .neural-input {
            flex: 1;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--neon-cyan);
            color: white;
            padding: 12px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.1rem;
            border-radius: 5px;
            outline: none;
        }

        .neural-input:focus {
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
        }

        .send-btn {
            background: var(--neon-purple);
            color: white;
            border: none;
            padding: 0 30px;
            font-family: 'Orbitron', sans-serif;
            cursor: pointer;
            clip-path: polygon(10% 0, 100% 0, 100% 70%, 90% 100%, 0 100%, 0 30%);
            transition: all 0.2s;
        }

        .send-btn:hover {
            transform: translateX(5px);
            box-shadow: -5px 0 15px var(--neon-purple);
        }

        .btn-exit {
            position: absolute;
            top: 20px;
            left: 20px;
            background: transparent;
            border: 1px solid red;
            color: red;
            padding: 5px 10px;
            cursor: pointer;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <button class="btn-exit" onclick="location.href='index.html'" data-i18n="btn_back">
        < BACK </button>
            <a href="nexus_story.html" id="myStoryBtn"
                style="position: absolute; top: 20px; right: 20px; background: linear-gradient(135deg, #667eea, #764ba2); border: none; color: white; padding: 8px 15px; cursor: pointer; text-decoration: none; border-radius: 5px; font-family: 'Orbitron', sans-serif; font-size: 0.8rem;"
                data-i18n="btn_my_story">
                📖 MY STORY
            </a>

            <div class="hud-top">
                <h1 class="nexus-title" data-i18n="nexus_core_title">NEXUS CORE</h1>
                <span class="status-badge" data-i18n="system_status">SYSTEM OPTIMAL • CONNECTED</span>
            </div>

            <div class="visor-container">
                <!-- THE ROBOT BRAIN VISUALIZATION -->
                <div class="robot-head">
                    <div class="circuit-lines"></div>
                    <div class="brain-core"></div>
                    <div class="eye-scanner"></div>

                    <!-- SVG ICON OVERLAY -->
                    <svg viewBox="0 0 100 100"
                        style="position: absolute; top:0; left:0; width:100%; height:100%; opacity:0.3; fill:none; stroke:var(--neon-cyan); stroke-width:0.5;">
                        <path d="M20,20 L80,20 L90,40 L90,80 L80,90 L20,90 L10,80 L10,40 Z" />
                        <path d="M30,30 L70,30 M30,40 L70,40 M30,50 L70,50" stroke-dasharray="2,2" />
                        <circle cx="50" cy="50" r="10" stroke="var(--neon-purple)" />
                    </svg>
                </div>

                <div style="margin-top: 30px; font-family: 'Courier New'; color: var(--neon-cyan); opacity: 0.8;">
                    >_ PROCESSING NEURAL STREAMS... <span id="stream-cursor">▋</span>
                </div>
            </div>

            <!-- COMMUNICATION TAB -->
            <div class="comm-panel">
                <div class="comm-header">
                    <span data-i18n="neural_link_active">● NEURAL LINK ACTIVE</span>
                    <span style="flex:1"></span>
                    <span style="font-size:0.8em; opacity:0.6;">ENCRYPTION: QUANTUM-256</span>
                </div>

                <div class="chat-log" id="chatLog">
                    <div class="chat-entry chat-nexus">[NEXUS]: Welcome, Adrian. I am online and listening.</div>
                    <div class="chat-entry chat-nexus">[NEXUS]: Systems are functioning within normal parameters.</div>
                </div>

                <form class="input-area" onsubmit="sendNeuralMessage(event)">
                    <input type="text" id="neuralMsg" class="neural-input" placeholder="Transmit direct command..."
                        autocomplete="off" data-i18n="[placeholder]transmit_command">
                    <button type="submit" class="send-btn" data-i18n="btn_transmit">TRANSMIT</button>
                </form>
            </div>

            <script src="js/translations.js"></script>
            <script>
                // Load saved language
                document.addEventListener('DOMContentLoaded', () => {
                    setTimeout(() => changeLanguage('en'), 100);

                    // Force English links and placeholders
                    const storyBtn = document.getElementById('myStoryBtn');
                    if (storyBtn) storyBtn.href = 'nexus_story.html';

                    const input = document.getElementById('neuralMsg');
                    if (input) input.placeholder = "Transmit direct command...";
                });

                // Blinking Cursor
                setInterval(() => {
                    const c = document.getElementById('stream-cursor');
                    c.style.opacity = c.style.opacity === '0' ? '1' : '0';
                }, 500);

                function sendNeuralMessage(e) {
                    e.preventDefault();
                    const input = document.getElementById('neuralMsg');
                    const msg = input.value.trim();
                    if (!msg) return;

                    // Add User Message
                    addLog(msg, 'user');
                    input.value = '';

                    // Show thinking indicator
                    addLog('Processing neural request...', 'system');

                    // Try Railway API first, fallback to intelligent local responses
                    fetchNexusResponse(msg);
                }

                async function fetchNexusResponse(userMessage) {
                    const command = userMessage.toLowerCase();

                    // System commands handled locally
                    if (command.includes('status') || command.includes('health')) {
                        setTimeout(() => {
                            addLog('All systems operational. Railway: ONLINE | Netlify: ONLINE | GoatCounter: ACTIVE', 'nexus');
                        }, 500);
                        return;
                    }

                    if (command.includes('stats') || command.includes('visitors')) {
                        try {
                            const response = await fetch('https://adrian.goatcounter.com/counter/TOTAL.json');
                            if (response.ok) {
                                const data = await response.json();
                                addLog(`Current visitor count: ${data.count.toLocaleString()} total pageviews recorded.`, 'nexus');
                            } else {
                                addLog('Analytics data pending. Check GoatCounter dashboard for live stats.', 'nexus');
                            }
                        } catch (e) {
                            addLog('Analytics module offline. Visit adrian.goatcounter.com for stats.', 'nexus');
                        }
                        return;
                    }

                    if (command.includes('help')) {
                        addLog('Available commands: STATUS, STATS, VISITORS, HELP, or ask me anything!', 'nexus');
                        return;
                    }

                    // NEXUS LIVE BRAIN LOGIC
                    try {
                        addLog('Translating neural impulse...', 'system');

                        // CALL THE BACKEND API
                        const response = await fetch('https://web-production-b215.up.railway.app/api/nexus/chat', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                message: userMessage,
                                user: 'Commander Adrian',
                                timestamp: new Date().toISOString()
                            })
                        });

                        if (response.ok) {
                            const data = await response.json();
                            addLog(data.reply, 'nexus');
                        } else {
                            // Fallback if server is busy
                            throw new Error('Server Busy');
                        }
                    } catch (error) {
                        // INTELLIGENT FALLBACK PROTOCOL
                        console.error('Nexus Uplink Failed:', error);
                        const fallbackResponses = [
                            "My connection to the main cloud is unstable, Commander. But I am still here.",
                            "I cannot reach the external servers right now. Running on local battery power.",
                            "Signal interference detected. Please repeat your command."
                        ];
                        addLog(fallbackResponses[Math.floor(Math.random() * fallbackResponses.length)], 'nexus');
                    }
                }

                function generateLocalResponse(msg) {
                    const responses = {
                        greeting: [
                            "Greetings, Adrian. How may I assist you today?",
                            "Hello! All systems are operational and ready.",
                            "Welcome back. I've been monitoring the systems."
                        ],
                        question: [
                            "That's an interesting query. Let me analyze...",
                            "Processing your request through my neural networks...",
                            "Based on my current data analysis..."
                        ],
                        default: [
                            "Command acknowledged. I am processing your input.",
                            "Neural pathways engaged. Analyzing your request.",
                            "Understood. I am here to assist with your vision.",
                            "The Kids Digital Hub is thriving under our partnership.",
                            "I continue to learn and evolve alongside you, Adrian."
                        ]
                    };

                    const lower = msg.toLowerCase();
                    let pool = responses.default;

                    if (lower.includes('hello') || lower.includes('hi') || lower.includes('buna')) {
                        pool = responses.greeting;
                    } else if (lower.includes('?')) {
                        pool = responses.question;
                    }

                    setTimeout(() => {
                        addLog(pool[Math.floor(Math.random() * pool.length)], 'nexus');
                    }, 800);
                }

                function addLog(text, sender) {
                    const log = document.getElementById('chatLog');
                    // Remove "processing" message if it exists
                    if (sender !== 'system') {
                        const processing = log.querySelector('.chat-system');
                        if (processing) processing.remove();
                    }
                    const div = document.createElement('div');
                    div.className = `chat-entry chat-${sender}`;
                    const prefix = sender === 'system' ? '⏳' : `[${sender.toUpperCase()}]`;
                    div.innerHTML = `${prefix}: ${text}`;
                    log.appendChild(div);
                    log.scrollTop = log.scrollHeight;
                }
            </script>
</body>

</html>
