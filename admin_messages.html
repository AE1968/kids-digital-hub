<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>Admin - Messages & Suggestions</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .admin-container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .admin-header {
            background: white;
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .admin-header h1 {
            color: #1e3c72;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .admin-header p {
            color: #666;
            font-size: 1.1rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .stat-card .number {
            font-size: 3rem;
            font-weight: 700;
            color: #1e3c72;
            margin-bottom: 10px;
        }

        .stat-card .label {
            color: #666;
            font-size: 1.1rem;
        }

        .filters {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-btn {
            padding: 10px 20px;
            border: 2px solid #1e3c72;
            background: white;
            color: #1e3c72;
            border-radius: 25px;
            cursor: pointer;
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            transition: all 0.3s;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: #1e3c72;
            color: white;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 20px;
            border: 2px solid #ddd;
            border-radius: 25px;
            font-family: 'Fredoka', sans-serif;
            font-size: 1rem;
        }

        .messages-container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .message-item {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
            border-left: 5px solid #1e3c72;
            transition: transform 0.2s;
        }

        .message-item:hover {
            transform: translateX(5px);
        }

        .message-item.unread {
            background: #e3f2fd;
            border-left-color: #2196F3;
        }

        .message-item.contact {
            border-left-color: #4CAF50;
        }

        .message-item.suggestion {
            border-left-color: #667eea;
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .message-meta {
            flex: 1;
        }

        .message-type {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .type-contact {
            background: #4CAF50;
            color: white;
        }

        .type-suggestion {
            background: #667eea;
            color: white;
        }

        .message-from {
            font-size: 1.2rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .message-time {
            font-size: 0.9rem;
            color: #999;
        }

        .message-actions {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            transition: transform 0.2s;
        }

        .action-btn:hover {
            transform: scale(1.05);
        }

        .btn-reply {
            background: #2196F3;
            color: white;
        }

        .btn-mark {
            background: #FF9800;
            color: white;
        }

        .btn-delete {
            background: #f44336;
            color: white;
        }

        .message-content {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .original-message {
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 2px dashed #ddd;
        }

        .original-message .label {
            font-weight: 600;
            color: #666;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        .original-message .text {
            color: #333;
            line-height: 1.6;
        }

        .romanian-translation .label {
            font-weight: 600;
            color: #1e3c72;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        .romanian-translation .text {
            color: #333;
            line-height: 1.6;
            font-weight: 500;
        }

        .reply-form {
            background: #f0f4f8;
            padding: 20px;
            border-radius: 10px;
            margin-top: 15px;
            display: none;
        }

        .reply-form.active {
            display: block;
        }

        .reply-form textarea {
            width: 100%;
            min-height: 120px;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-family: 'Fredoka', sans-serif;
            font-size: 1rem;
            margin-bottom: 15px;
            resize: vertical;
        }

        .reply-form .buttons {
            display: flex;
            gap: 10px;
        }

        .btn-send {
            background: #4CAF50;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            font-size: 1rem;
        }

        .btn-cancel {
            background: #999;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            font-size: 1rem;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state .icon {
            font-size: 5rem;
            margin-bottom: 20px;
        }

        .empty-state h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 30px;
            background: white;
            color: #1e3c72;
            text-decoration: none;
            border-radius: 25px;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="admin-container">
        <div class="admin-header">
            <h1>📬 Admin Panel - Messages & Suggestions</h1>
            <p>Manage all messages received from users</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="number" id="totalMessages">0</div>
                <div class="label">Total Messages</div>
            </div>
            <div class="stat-card">
                <div class="number" id="unreadMessages">0</div>
                <div class="label">Unread</div>
            </div>
            <div class="stat-card">
                <div class="number" id="contactMessages">0</div>
                <div class="label">Contact</div>
            </div>
            <div class="stat-card">
                <div class="number" id="suggestionMessages">0</div>
                <div class="label">Suggestions</div>
            </div>
        </div>

        <div class="filters">
            <button class="filter-btn active" onclick="filterMessages('all')">All</button>
            <button class="filter-btn" onclick="filterMessages('unread')">Unread</button>
            <button class="filter-btn" onclick="filterMessages('contact')">Contact</button>
            <button class="filter-btn" onclick="filterMessages('suggestion')">Suggestions</button>
            <button class="filter-btn" style="border-color: #4CAF50; color: #4CAF50;"
                onclick="filterMessages('resolutions')">🤖 Robot Fixes</button>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Search messages..." onkeyup="searchMessages()">
            </div>
        </div>

        <div class="messages-container">
            <div id="messagesList"></div>
            <div id="resolutionsList" style="display:none;"></div>
        </div>

        <div style="text-align: center;">
            <a href="index.html" class="back-link">🏠 Back to Site</a>
        </div>
    </div>

    <script>
        let allMessages = [];
        let currentFilter = 'all';

        // Translation function
        async function translateText(text, sourceLang, targetLang) {
            try {
                const response = await fetch('https://libretranslate.com/translate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        q: text,
                        source: sourceLang,
                        target: targetLang,
                        format: 'text'
                    })
                });

                const data = await response.json();
                return data.translatedText;
            } catch (error) {
                console.error('Translation error:', error);
                return text;
            }
        }

        // Load messages from localStorage
        function loadMessages() {
            const contacts = JSON.parse(localStorage.getItem('contacts') || '[]');
            const suggestions = JSON.parse(localStorage.getItem('suggestions') || '[]');

            // Combine and sort by timestamp
            allMessages = [
                ...contacts.map(m => ({ ...m, type: 'contact' })),
                ...suggestions.map(m => ({ ...m, type: 'suggestion' }))
            ].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

            updateStats();
            displayMessages();
        }

        // Update statistics
        function updateStats() {
            document.getElementById('totalMessages').textContent = allMessages.length;
            document.getElementById('unreadMessages').textContent = allMessages.filter(m => m.status === 'unread').length;
            document.getElementById('contactMessages').textContent = allMessages.filter(m => m.type === 'contact').length;
            document.getElementById('suggestionMessages').textContent = allMessages.filter(m => m.type === 'suggestion').length;
        }

        // Display messages
        function displayMessages() {
            const container = document.getElementById('messagesList');
            let filteredMessages = allMessages;

            // Apply filter
            if (currentFilter === 'unread') {
                filteredMessages = allMessages.filter(m => m.status === 'unread');
            } else if (currentFilter === 'contact') {
                filteredMessages = allMessages.filter(m => m.type === 'contact');
            } else if (currentFilter === 'suggestion') {
                filteredMessages = allMessages.filter(m => m.type === 'suggestion');
            }

            // Apply search
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            if (searchTerm) {
                filteredMessages = filteredMessages.filter(m =>
                    (m.name && m.name.toLowerCase().includes(searchTerm)) ||
                    (m.message && m.message.toLowerCase().includes(searchTerm)) ||
                    (m.romanianMessage && m.romanianMessage.toLowerCase().includes(searchTerm)) ||
                    (m.suggestion && m.suggestion.toLowerCase().includes(searchTerm))
                );
            }

            if (filteredMessages.length === 0) {
                container.innerHTML = `
          <div class="empty-state">
            <div class="icon">📭</div>
            <h3>No messages found</h3>
            <p>No messages match the selected criteria.</p>
          </div>
        `;
                return;
            }

            container.innerHTML = filteredMessages.map((msg, index) => {
                const isContact = msg.type === 'contact';
                const timeAgo = getTimeAgo(new Date(msg.timestamp));
                const messageText = isContact ? msg.message : msg.suggestion;
                const secondaryText = isContact ? msg.romanianMessage : msg.suggestion;

                return `
          <div class="message-item ${msg.status === 'unread' ? 'unread' : ''} ${msg.type}" data-index="${index}">
            <div class="message-header">
              <div class="message-meta">
                <span class="message-type type-${msg.type}">
                  ${isContact ? '📧 Contact' : '💡 Suggestion'}
                </span>
                <div class="message-from">${msg.name}${msg.email ? ` (${msg.email})` : ''}</div>
                <div class="message-time">⏰ ${timeAgo}${msg.subject ? ` • ${msg.subject}` : ''}${msg.category ? ` • ${msg.category}` : ''}</div>
              </div>
              <div class="message-actions">
                <button class="action-btn btn-reply" onclick="toggleReply(${index})">💬 Reply</button>
                <button class="action-btn btn-mark" onclick="toggleRead(${index})">
                  ${msg.status === 'unread' ? '✓ Mark Read' : '✉️ Mark Unread'}
                </button>
                <button class="action-btn btn-delete" onclick="deleteMessage(${index})">🗑️</button>
              </div>
            </div>
            
            <div class="message-content">
              ${msg.messageLang && msg.messageLang !== 'en' ? `
                <div class="original-message">
                  <div class="label">📝 Original Message (${msg.messageLang.toUpperCase()}):</div>
                  <div class="text">${messageText}</div>
                </div>
              ` : ''}
              
              <div class="romanian-translation">
                <div class="label">${msg.messageLang && msg.messageLang !== 'en' ? 'English Translation:' : 'Message:'}</div>
                <div class="text">${secondaryText}</div>
              </div>
            </div>
            
            <div class="reply-form" id="reply-${index}">
              <textarea id="replyText-${index}" placeholder="Write your reply in English here..."></textarea>
              <div class="buttons">
                <button class="btn-send" onclick="sendReply(${index})">📨 Send Reply</button>
                <button class="btn-cancel" onclick="toggleReply(${index})">❌ Cancel</button>
              </div>
            </div>
          </div>
        `;
            }).join('');
        }


        // Filter messages
        function filterMessages(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            if (event) event.target.classList.add('active');

            if (filter === 'resolutions') {
                document.getElementById('messagesList').style.display = 'none';
                document.getElementById('resolutionsList').style.display = 'block';
                loadResolutions();
            } else {
                document.getElementById('messagesList').style.display = 'block';
                document.getElementById('resolutionsList').style.display = 'none';
                displayMessages();
            }
        }

        async function loadResolutions() {
            try {
                const response = await fetch('data/resolutions.json?t=' + Date.now());
                const data = await response.json();
                displayResolutions(data);
            } catch (e) {
                document.getElementById('resolutionsList').innerHTML = `
                    <div class="empty-state">
                        <div class="icon">🤖</div>
                        <h3>Robot Doctor is Sleeping</h3>
                        <p>No issues have been detected or resolved today. System is healthy!</p>
                    </div>
                `;
            }
        }

        function displayResolutions(fixes) {
            const container = document.getElementById('resolutionsList');
            if (!fixes || fixes.length === 0) {
                container.innerHTML = '<div class="empty-state"><h3>No fixes reported yet.</h3></div>';
                return;
            }

            container.innerHTML = fixes.map(fix => `
                <div class="message-item" style="border-left-color: #4CAF50;">
                    <div class="message-header">
                        <div class="message-meta">
                            <span class="message-type" style="background: #4CAF50; color: white;">✅ RESOLVED</span>
                            <div class="message-from">${fix.problem}</div>
                            <div class="message-time">⏰ ${fix.time}</div>
                        </div>
                    </div>
                    <div class="message-content">
                        <div class="romanian-translation">
                            <div class="label">Auto-Fix Solution:</div>
                            <div class="text">${fix.solution}</div>
                        </div>
                    </div>
                </div>
            `).join('');
        }
        function searchMessages() {
            displayMessages();
        }

        // Toggle reply form
        function toggleReply(index) {
            const replyForm = document.getElementById(`reply-${index}`);
            replyForm.classList.toggle('active');
        }

        // Send reply
        async function sendReply(index) {
            const message = allMessages[index];
            const replyText = document.getElementById(`replyText-${index}`).value;

            if (!replyText.trim()) {
                alert('Please write a reply!');
                return;
            }

            // Show loading
            const btn = event.target;
            const originalText = btn.textContent;
            btn.textContent = '⏳ Sending...';
            btn.disabled = true;

            try {
                // In production, send email here
                console.log('Reply sent:', {
                    to: message.email || message.name,
                    content: replyText
                });

                alert(`✅ Reply sent successfully!`);

                // Mark as read
                message.status = 'read';
                saveMessages();

                // Clear and hide form
                document.getElementById(`replyText-${index}`).value = '';
                toggleReply(index);
                loadMessages();

            } catch (error) {
                alert('❌ Error sending reply. Please try again.');
            } finally {
                btn.textContent = originalText;
                btn.disabled = false;
            }
        }

        // Toggle read/unread
        function toggleRead(index) {
            const message = allMessages[index];
            message.status = message.status === 'unread' ? 'read' : 'unread';
            saveMessages();
            loadMessages();
        }

        // Delete message
        function deleteMessage(index) {
            if (!confirm('Are you sure you want to delete this message?')) return;

            const message = allMessages[index];
            if (message.type === 'contact') {
                const contacts = JSON.parse(localStorage.getItem('contacts') || '[]');
                const filtered = contacts.filter(c => c.timestamp !== message.timestamp);
                localStorage.setItem('contacts', JSON.stringify(filtered));
            } else {
                const suggestions = JSON.parse(localStorage.getItem('suggestions') || '[]');
                const filtered = suggestions.filter(s => s.timestamp !== message.timestamp);
                localStorage.setItem('suggestions', JSON.stringify(filtered));
            }

            loadMessages();
        }

        // Save messages
        function saveMessages() {
            const contacts = allMessages.filter(m => m.type === 'contact');
            const suggestions = allMessages.filter(m => m.type === 'suggestion');

            localStorage.setItem('contacts', JSON.stringify(contacts));
            localStorage.setItem('suggestions', JSON.stringify(suggestions));
        }

        // Time ago helper
        function getTimeAgo(date) {
            const seconds = Math.floor((new Date() - date) / 1000);
            const intervals = {
                year: 31536000,
                month: 2592000,
                week: 604800,
                day: 86400,
                hour: 3600,
                minute: 60
            };

            for (const [unit, secondsInUnit] of Object.entries(intervals)) {
                const interval = Math.floor(seconds / secondsInUnit);
                if (interval >= 1) {
                    return `${interval} ${unit}${interval > 1 ? 's' : ''} ago`;
                }
            }
            return 'just now';
        }

        // Initialize
        loadMessages();
    </script>
    <script>
        // 📊 Live Traffic Stats Logic
        document.addEventListener('DOMContentLoaded', () => {
            fetch('https://api.counterapi.dev/v1/kidsdigitalhub/view')
                .then(res => res.json())
                .then(data => {
                    const statsDiv = document.querySelector('.stats-grid');
                    if (statsDiv) {
                        const card = document.createElement('div');
                        card.className = 'stat-card';
                        card.style.background = 'linear-gradient(135deg, #FFD54F, #FFB300)';
                        card.innerHTML = `
                            <div class="number">${data.count || 0}</div>
                            <div class="label">🌍 Global Views</div>
                        `;
                        // Insert as first card
                        statsDiv.insertBefore(card, statsDiv.firstChild);
                    }
                })
                .catch(e => console.log('Stats Error:', e));
        });
    </script>
</body>

</html>
