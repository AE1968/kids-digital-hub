<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS SUPREME | Neural Intelligence</title>

    <!-- External Resources -->
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap"
        rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-purple: #bc13fe;
            --matrix-green: #00ff41;
            --alert-red: #ff003c;
            --bg-dark: #050505;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: var(--bg-dark);
            color: white;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Neural Background Animation */
        canvas#neuralNet {
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
            opacity: 0.3;
        }

        .main-hub {
            flex: 1;
            display: grid;
            grid-template-columns: 350px 1fr 350px;
            gap: 20px;
            padding: 20px;
        }

        /* Left: Vision & Biometrics */
        .vision-panel {
            background: rgba(10, 20, 30, 0.8);
            border: 1px solid var(--neon-cyan);
            border-radius: 15px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .video-container {
            width: 100%;
            height: 200px;
            background: #000;
            border-radius: 10px;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--matrix-green);
        }

        video#webcam {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        canvas#overlay {
            position: absolute;
            top: 0;
            left: 0;
        }

        /* Center: The Core */
        .core-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .nexus-avatar {
            width: 300px;
            height: 300px;
            border-radius: 50%;
            position: relative;
            background: radial-gradient(circle, var(--neon-purple), transparent);
            box-shadow: 0 0 60px var(--neon-cyan);
            animation: pulse 4s infinite ease-in-out;
        }

        .nexus-avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            filter: drop-shadow(0 0 10px var(--neon-cyan));
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
                filter: brightness(1);
            }

            50% {
                transform: scale(1.05);
                filter: brightness(1.3);
            }
        }

        /* Right: Intelligence & Memory */
        .chat-panel {
            background: rgba(10, 10, 20, 0.9);
            border: 1px solid var(--neon-purple);
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            padding: 15px;
            background: var(--neon-purple);
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            text-align: center;
            font-size: 0.8rem;
        }

        .chat-log {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
        }

        .msg {
            margin-bottom: 10px;
            padding: 5px 10px;
            border-radius: 5px;
            animation: slideIn 0.3s;
        }

        .msg.nexus {
            color: var(--neon-cyan);
            border-left: 2px solid var(--neon-cyan);
        }

        .msg.user {
            color: var(--neon-purple);
            text-align: right;
            border-right: 2px solid var(--neon-purple);
        }

        .msg.system {
            color: var(--matrix-green);
            font-size: 0.7rem;
            opacity: 0.7;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(10px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .chat-input-area {
            padding: 15px;
            border-top: 1px solid #333;
            display: flex;
            gap: 10px;
        }

        input#userInput {
            flex: 1;
            background: transparent;
            border: 1px solid var(--neon-cyan);
            border-radius: 20px;
            padding: 8px 15px;
            color: white;
            outline: none;
        }

        button {
            background: var(--neon-purple);
            border: none;
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            transition: 0.3s;
        }

        button:hover {
            filter: brightness(1.2);
            transform: scale(1.05);
        }

        /* HUD & Controls */
        .hud-bottom {
            height: 60px;
            background: rgba(0, 0, 0, 0.9);
            border-top: 1px solid var(--neon-cyan);
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 20px;
        }

        .biometric-data {
            font-family: 'Orbitron';
            font-size: 0.7rem;
            color: var(--matrix-green);
        }

        #omegaStatus {
            color: var(--alert-red);
            font-weight: bold;
        }
    </style>
</head>

<body>
    <canvas id="neuralNet"></canvas>

    <div class="main-hub">
        <!-- Vision -->
        <div class="vision-panel">
            <h3 style="font-family:'Orbitron'; font-size: 0.8rem; color: var(--neon-cyan);">👁️ VISION MODULE</h3>
            <div class="video-container">
                <video id="webcam" autoplay muted></video>
                <canvas id="overlay"></canvas>
            </div>
            <div class="biometric-data">
                <div>NAME: <span id="faceName">UNKNOWN</span></div>
                <div>EMOTION: <span id="faceEmotion">-</span></div>
                <div>PROTOCOL: <span id="omegaStatus">INACTIVE</span></div>
            </div>
            <button onclick="startVision()">ACTIVATE OPTICS</button>
            <button onclick="toggleOmega()" style="background: var(--alert-red)">PROTOCOL OMEGA</button>
        </div>

        <!-- Brain Core -->
        <div class="core-panel">
            <h1
                style="font-family:'Orbitron'; font-size: 2rem; margin-bottom: 20px; text-shadow: 0 0 10px var(--neon-cyan);">
                NEXUS SUPREME</h1>
            <div class="nexus-avatar">
                <img src="assets/images/nexus_avatar.png"
                    onerror="this.src='https://api.dicebear.com/7.x/bottts-neutral/svg?seed=Nexus&backgroundColor=00f3ff'">
            </div>
            <p id="brainState" style="margin-top:20px; color: var(--matrix-green); font-family:'Courier New';">IDLE •
                STANDBY</p>
        </div>

        <!-- Intelligence -->
        <div class="chat-panel">
            <div class="chat-header">NEURAL PROCESSOR UNIT</div>
            <div class="chat-log" id="chatLog"></div>
            <div class="chat-input-area">
                <button id="micBtn" onclick="toggleVoice()">🎤</button>
                <input type="text" id="userInput" placeholder="Transmit neural impulse..."
                    onkeypress="if(event.key==='Enter') processInput()">
                <button onclick="processInput()">SEND</button>
            </div>
        </div>
    </div>

    <div class="hud-bottom">
        <div class="biometric-data">UPTIME: <span id="uptime">00:00:00</span></div>
        <div class="biometric-data">NEURAL LOAD: <span id="load">12%</span></div>
        <div class="biometric-data">DOMAIN: www.kidsdigitalhub.com</div>
        <button onclick="location.href='index.html'">EXIT HUB</button>
    </div>

    <script>
        // --- BRAIN LOGIC ---
        const GEMINI_API_KEY = 'YOUR_API_KEY_HERE'; // Placeholder - will use local intelligence fallback
        let isOmegaActive = false;
        let isListening = false;

        async function processInput() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            addLog('user', text);
            input.value = '';

            setBrainState('THINKING...');

            // External AI or Advanced Local Simulation
            setTimeout(() => {
                const response = getNexusResponse(text);
                addLog('nexus', response);
                speak(response);
                setBrainState('IDLE');
            }, 800);
        }

        function getNexusResponse(msg) {
            const lower = msg.toLowerCase();
            const lang = detectLang(lower);

            const responses = {
                ro: {
                    hi: "Salut, Adrian. Sunt Nexus Supreme. Gata de acțiune.",
                    help: "Pot controla viziunea, Protocolul Omega și comunica prin rețeaua Neurală.",
                    omega: "Protocolul Omega este nucleul meu de securitate. Acces autorizat doar pentru tine.",
                    none: "Analtizez datele tale. Kids Digital Hub este sub protecția mea."
                },
                en: {
                    hi: "Greetings, Adrian. Nexus Supreme online. Neural links stable.",
                    help: "I manage Vision Modules, Protocol Omega, and Neural Communications.",
                    omega: "Protocol Omega is my security core. Authorized access only.",
                    none: "Processing data streams. Kids Digital Hub is secure."
                }
            };

            const pool = responses[lang];
            if (lower.includes('buna') || lower.includes('hello')) return pool.hi;
            if (lower.includes('ajutor') || lower.includes('help')) return pool.help;
            if (lower.includes('omega')) return pool.omega;

            return pool.none;
        }

        function detectLang(t) {
            return /\b(buna|salut|ce|fac|cum|ajutor|da|nu)\b/i.test(t) ? 'ro' : 'en';
        }

        function addLog(type, text) {
            const log = document.getElementById('chatLog');
            const d = document.createElement('div');
            d.className = `msg ${type}`;
            d.textContent = type === 'nexus' ? `[NEXUS]: ${text}` : `[YOU]: ${text}`;
            log.appendChild(d);
            log.scrollTop = log.scrollHeight;
        }

        function setBrainState(s) {
            document.getElementById('brainState').textContent = s;
        }

        // --- VISION MODULE (Face API) ---
        async function startVision() {
            addLog('system', 'Initializing Biometric Scanners...');
            const video = document.getElementById('webcam');
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: {} });
                video.srcObject = stream;

                addLog('system', 'Loading Neural Models...');
                const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
                await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
                await faceapi.nets.faceExpressionNet.loadFromUri(MODEL_URL);

                addLog('system', 'Vision Online. Scanning for Commander Adrian...');
                detectFaces();
            } catch (e) {
                addLog('system', 'Vision Error: Access Denied or No Camera.');
            }
        }

        async function detectFaces() {
            const video = document.getElementById('webcam');
            const canvas = document.getElementById('overlay');
            const displaySize = { width: video.width, height: video.height };
            // face-api setup... (simplified for stability)
            setInterval(async () => {
                const detections = await faceapi.detectAllFaces(video, new faceapi.TinyFaceDetectorOptions()).withFaceExpressions();
                if (detections.length > 0) {
                    const emotion = detections[0].expressions.asSorted()[0].expression;
                    document.getElementById('faceEmotion').textContent = emotion.toUpperCase();
                    document.getElementById('faceName').textContent = "ADRIAN (CMD)";
                }
            }, 500);
        }

        function toggleOmega() {
            isOmegaActive = !isOmegaActive;
            const status = document.getElementById('omegaStatus');
            status.textContent = isOmegaActive ? 'ACTIVE (VIP)' : 'INACTIVE';
            status.style.color = isOmegaActive ? 'var(--matrix-green)' : 'var(--alert-red)';

            const msg = isOmegaActive ? "Protocol Omega Activat. Securitate maximă." : "Protocol Omega dezactivat. Mod Public.";
            addLog('nexus', msg);
            speak(msg);
        }

        // --- VOICE MODULE ---
        function toggleVoice() {
            if (!('webkitSpeechRecognition' in window)) return alert('Browser not supported');
            const recognition = new webkitSpeechRecognition();
            recognition.lang = 'ro-RO';

            recognition.onstart = () => {
                isListening = true;
                document.getElementById('micBtn').style.background = 'var(--alert-red)';
                addLog('system', '🎤 Microphone Active. Speak now.');
            };

            recognition.onresult = (event) => {
                const text = event.results[0][0].transcript;
                document.getElementById('userInput').value = text;
                processInput();
            };

            recognition.onend = () => {
                isListening = false;
                document.getElementById('micBtn').style.background = 'var(--neon-purple)';
            };

            recognition.start();
        }

        function speak(t) {
            const ut = new SpeechSynthesisUtterance(t);
            ut.lang = detectLang(t) === 'ro' ? 'ro-RO' : 'en-US';
            ut.rate = 0.9;
            window.speechSynthesis.speak(ut);
        }

        // --- UI ANIMATIONS ---
        const canvas = document.getElementById('neuralNet');
        const ctx = canvas.getContext('2d');
        function initNeuralBg() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            // Neural web animation logic...
        }
        window.addEventListener('load', initNeuralBg);

        // Uptime counter
        let seconds = 0;
        setInterval(() => {
            seconds++;
            const h = Math.floor(seconds / 3600).toString().padStart(2, '0');
            const m = Math.floor((seconds % 3600) / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            document.getElementById('uptime').textContent = `${h}:${m}:${s}`;
        }, 1000);

    </script>
</body>

</html>
