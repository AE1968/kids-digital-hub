<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>The Magic Unicorn - Kids Digital Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <script data-goatcounter="https://adrian.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            background: linear-gradient(135deg, #FFEFBA 0%, #FFFFFF 100%);
            min-height: 100vh;
            color: #444;
            line-height: 1.6;
            overflow-x: hidden;
        }

        .rainbow-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 10% 20%, rgba(255, 182, 193, 0.2) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(173, 216, 230, 0.2) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(255, 255, 224, 0.2) 0%, transparent 50%);
            z-index: -1;
        }

        .story-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        .story-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 40px;
            padding: 50px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            border: 8px solid #fff;
            position: relative;
            overflow: hidden;
        }

        .story-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 10px;
            background: linear-gradient(to right, #ff9a9e, #fad0c4, #fad0c4, #ffd1ff, #a18cd1, #4facfe, #00f2fe);
        }

        .scene-emoji {
            font-size: 6rem;
            text-align: center;
            margin-bottom: 30px;
            animation: bounce 3s infinite;
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-15px);
            }
        }

        .progress-bar {
            width: 100%;
            height: 12px;
            background: #eee;
            border-radius: 6px;
            margin-bottom: 40px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(to right, #ff9a9e, #a18cd1);
            width: 0%;
            transition: width 0.5s ease-in-out;
        }

        h2 {
            font-size: 2.2rem;
            color: #764ba2;
            margin-bottom: 25px;
            text-align: center;
        }

        .story-text {
            font-size: 1.3rem;
            margin-bottom: 30px;
            text-align: center;
        }

        .choices {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 40px;
        }

        .choice-btn {
            padding: 20px;
            background: white;
            border: 3px solid #764ba2;
            border-radius: 20px;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s;
            color: #764ba2;
            font-weight: 600;
        }

        .choice-btn:hover {
            background: #764ba2;
            color: white;
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(118, 75, 162, 0.2);
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: white;
            color: #764ba2;
            padding: 10px 20px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .sparkle {
            position: absolute;
            pointer-events: none;
            animation: sparkleAnim 1s forwards;
        }

        @keyframes sparkleAnim {
            0% {
                transform: scale(0);
                opacity: 1;
            }

            100% {
                transform: scale(1.5);
                opacity: 0;
            }
        }
    </style>
</head>

<body>
    <div class="rainbow-bg"></div>
    <a href="../story-library.html" class="back-btn">← Library</a>

    <div class="story-container">
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="story-card">
            <div class="scene-emoji" id="sceneEmoji">🦄</div>
            <h2 id="sceneTitle">The Magic Unicorn</h2>
            <div class="story-text" id="storyText">
                Sparkle is a young unicorn with a shining silver horn. Today is her first day at the Rainbow Academy,
                but she's feeling a little nervous.
            </div>
            <div class="choices" id="choicesArea">
                <button class="choice-btn" onclick="nextScene('academy')">Go to Academy 🌈</button>
                <button class="choice-btn" onclick="nextScene('practice')">Practice Magic 🪄</button>
            </div>
        </div>
    </div>

    <script>
        const storyData = {
            start: {
                title: "Sparkle's Big Day",
                text: "Sparkle is a young unicorn with a shining silver horn. Today is her first day at the Rainbow Academy, but she's feeling a little nervous. What should she do?",
                emoji: "🦄",
                choices: [
                    { text: "Go to Academy 🌈", next: "academy" },
                    { text: "Practice Magic 🪄", next: "practice" }
                ],
                progress: 10
            },
            academy: {
                title: "The Rainbow Academy",
                text: "Sparkle arrives at the academy and sees a group of unicorns making clouds fly! Suddenly, a big gust of wind blows a baby bird out of its nest. Help!",
                emoji: "🏫",
                choices: [
                    { text: "Catch with Magic 🪄", next: "save_magic" },
                    { text: "Catch with a Cloud ☁️", next: "save_cloud" }
                ],
                progress: 40
            },
            practice: {
                title: "Magic Forest",
                text: "Sparkle goes to the whispering woods to practice. She tries to make a flower grow, but instead, she accidentally turns it into a giant strawberry! 🍓",
                emoji: "🌳",
                choices: [
                    { text: "Eat the Strawberry 😋", next: "eat" },
                    { text: "Fix the Flower 🌸", next: "academy" }
                ],
                progress: 40
            },
            save_magic: {
                title: "Sparkling Save!",
                text: "Sparkle's horn glows bright pink! A magical bubble surrounds the bird and gently lowers it back to its nest. The other unicorns cheer! 🎉",
                emoji: "✨",
                choices: [
                    { text: "Make Friends 🦄", next: "friends" },
                    { text: "Celebrate! 🧁", next: "end" }
                ],
                progress: 70
            },
            save_cloud: {
                title: "Cloud Catcher",
                text: "Sparkle jumps onto a fluffy cloud and catches the bird just in time! They soar through the sky like a soft airplane. ✈️",
                emoji: "☁️",
                choices: [
                    { text: "Fly higher! 🌤️", next: "friends" },
                    { text: "Landing Party! 🎊", next: "end" }
                ],
                progress: 70
            },
            eat: {
                title: "Yum Yum!",
                text: "The giant strawberry is delicious! Sparkle feels so energized that her mane starts glowing in all the colors of the rainbow. Ready for academy!",
                emoji: "🍓",
                choices: [
                    { text: "Run to Academy 🌈", next: "academy" },
                    { text: "Take a Nap 💤", next: "end" }
                ],
                progress: 60
            },
            friends: {
                title: "New Best Friends",
                text: "Sparkle meets Luna and Solar. They decide to combine their powers to create a giant heart-shaped rainbow in the sky for everyone to see. 💖",
                emoji: "👯‍♀️",
                choices: [
                    { text: "The End 🌟", next: "end" }
                ],
                progress: 90
            },
            end: {
                title: "A Magical Success!",
                text: "Sparkle learned that she is brave and talented. No matter what happens, she knows her friends will always be there to sparkle with her. You finished the story!",
                emoji: "👑",
                choices: [
                    { text: "Read Again 🔄", next: "start" },
                    { text: "More Stories 📚", next: "library" }
                ],
                progress: 100
            }
        };

        function nextScene(sceneId) {
            if (sceneId === 'library') {
                window.location.href = '../story-library.html';
                return;
            }

            const data = storyData[sceneId];
            if (!data) return;

            // Update UI with animation
            const card = document.querySelector('.story-card');
            card.style.opacity = '0';
            card.style.transform = 'translateY(20px)';

            setTimeout(() => {
                document.getElementById('sceneEmoji').textContent = data.emoji;
                document.getElementById('sceneTitle').textContent = data.title;
                document.getElementById('storyText').textContent = data.text;
                document.getElementById('progressFill').style.width = data.progress + '%';

                const choicesArea = document.getElementById('choicesArea');
                choicesArea.innerHTML = '';
                data.choices.forEach(choice => {
                    const btn = document.createElement('button');
                    btn.className = 'choice-btn';
                    btn.textContent = choice.text;
                    btn.onclick = () => {
                        createSparkles(event.clientX, event.clientY);
                        nextScene(choice.next);
                    };
                    choicesArea.appendChild(btn);
                });

                card.style.opacity = '1';
                card.style.transform = 'translateY(0)';

                if (data.progress === 100 && window.KDH_Achievements) {
                    KDH_Achievements.addProgress('reading');
                }

                if (window.KDH_Sounds) KDH_Sounds.playClick();
            }, 300);
        }

        function createSparkles(x, y) {
            for (let i = 0; i < 8; i++) {
                const s = document.createElement('div');
                s.className = 'sparkle';
                s.textContent = '✨';
                s.style.left = (x + (Math.random() - 0.5) * 60) + 'px';
                s.style.top = (y + (Math.random() - 0.5) * 60) + 'px';
                s.style.fontSize = (10 + Math.random() * 20) + 'px';
                document.body.appendChild(s);
                setTimeout(() => s.remove(), 1000);
            }
        }

        // Initialize sparkles on move
        document.addEventListener('click', (e) => {
            // Only occasional sparkles on clicks that aren't buttons
            if (Math.random() > 0.7) createSparkles(e.clientX, e.clientY);
        });
    </script>
</body>

</html>
