<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Stories - Kids Digital Hub</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        .gallery-header {
            background: #66BB6A;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: white;
            border-bottom: 5px solid #2E7D32;
        }

        .gallery-grid {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .slot {
            aspect-ratio: 1;
            background: white;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }

        .slot.filled {
            border: 4px solid #A5D6A7;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            background: #E8F5E9;
            flex-direction: column;
            gap: 10px;
        }

        .slot.filled:hover {
            transform: scale(1.05);
        }

        .slot.empty {
            border: 4px dashed #CFD8DC;
            background: #F5F5F5;
        }

        .empty-label {
            color: #B0BEC5;
            font-weight: bold;
            font-size: 0.9rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .slot-number {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .book-icon {
            font-size: 4rem;
        }

        .book-title {
            font-weight: bold;
            color: #2E7D32;
            font-size: 1rem;
            text-align: center;
            padding: 0 5px;
        }

        .btn-read {
            margin-top: 5px;
            padding: 5px 15px;
            background: #66BB6A;
            color: white;
            border: none;
            border-radius: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-back-dash {
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 15px;
            border-radius: 20px;
            color: white;
            text-decoration: none;
            font-weight: bold;
            border: 2px solid white;
        }
    </style>
</head>

<body>

    <header class="gallery-header">
        <div style="display:flex; align-items:center; gap:10px;">
            <span style="font-size:2rem;">📚</span>
            <h2 style="margin:0;">My Story Library</h2>
        </div>
        <a href="dashboard.html" class="btn-back-dash">⬅️ Dashboard</a>
    </header>

    <main>
        <div class="gallery-grid">
            <!-- SLOT 1: FILLED -->
            <div class="slot filled">
                <span class="slot-number">1</span>
                <span class="book-icon">🦁</span>
                <span class="book-title">Leo The Lion</span>
                <button class="btn-read">📖 Read</button>
            </div>

            <!-- SLOTS 2-10: EMPTY -->
            <div class="slot empty"><span class="slot-number">2</span>
                <div class="empty-label"><span>➕</span><span>Empty</span></div>
            </div>
            <div class="slot empty"><span class="slot-number">3</span>
                <div class="empty-label"><span>➕</span><span>Empty</span></div>
            </div>
            <div class="slot empty"><span class="slot-number">4</span>
                <div class="empty-label"><span>➕</span><span>Empty</span></div>
            </div>
            <div class="slot empty"><span class="slot-number">5</span>
                <div class="empty-label"><span>➕</span><span>Empty</span></div>
            </div>
            <div class="slot empty"><span class="slot-number">6</span>
                <div class="empty-label"><span>➕</span><span>Empty</span></div>
            </div>
            <div class="slot empty"><span class="slot-number">7</span>
                <div class="empty-label"><span>➕</span><span>Empty</span></div>
            </div>
            <div class="slot empty"><span class="slot-number">8</span>
                <div class="empty-label"><span>➕</span><span>Empty</span></div>
            </div>
            <div class="slot empty"><span class="slot-number">9</span>
                <div class="empty-label"><span>➕</span><span>Empty</span></div>
            </div>
            <div class="slot empty"><span class="slot-number">10</span>
                <div class="empty-label"><span>🔒 Premium</span></div>
            </div>
        </div>
    </main>

</body>

</html>
